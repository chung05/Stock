    // 噴日誌到控制台的引擎
    function pushLog(message, type = "info") {
      const consoleNode = document.getElementById("diagnosticConsole");
      if (!consoleNode) return;
      let colorClass = "text-emerald-400";
      if (type === "warning") colorClass = "text-amber-500 font-bold";
      if (type === "error") colorClass = "text-rose-500 font-black";
      if (type === "success") colorClass = "text-cyan-400 font-bold";
      
      consoleNode.innerHTML += `<div class="${colorClass}">&gt; [${new Date().toLocaleTimeString()}] ${message}</div>`;
      consoleNode.scrollTop = consoleNode.scrollHeight; // 自動捲動到最底部
    }

    function clearDiagnosticLogs() {
      document.getElementById("diagnosticConsole").innerHTML = `<div class="text-slate-500">&gt;_ 控制台已清空。就緒...</div>`;
    }

    function calculateTargetTradingDates() {
      let dates = []; let d = new Date();
      if (d.getHours() < 17) { d.setDate(d.getDate() - 1); }
      while(dates.length < 5) {
        if(d.getDay() !== 0 && d.getDay() !== 6) { dates.push(formatDateToString(d)); }
        d.setDate(d.getDate() - 1);
      }
      recentDates = dates;
      pushLog(`初步分析最近5個潛在工作開盤日：${recentDates.join(', ')}`, "info");
    }

    async function forceSyncFlow() {
      const modal = document.getElementById("loadingModal");
      const detailText = document.getElementById("loadingDetail");
      modal.classList.remove("hidden");

      try {
        pushLog("啟動一條龍智慧自動檢查流...", "success");

        extractActualTradingDatesFromCache();

        renderTableHeader();
        applyFilters();

      } catch (err) {
        pushLog(`一條龍流程觸發例外中斷: ${err.message}`, "error");
      } finally {
        modal.classList.add("hidden");
      }
    }

    function extractActualTradingDatesFromCache() {
      if (globalChipCache && globalChipCache.length > 0) {
        const uniqueDates = [...new Set(globalChipCache.map(c => c.date))];
        uniqueDates.sort((a, b) => b.localeCompare(a));
        recentDates = uniqueDates.slice(0, 5);
        if (recentDates.length > 0) {
          document.getElementById("chipUpdateTime").innerText = recentDates[0];
          pushLog(`已完成最近5天真實交易日校準：${recentDates.join(', ')}`, "success");
        }
      }
    }

    // 多重代理自動退讓與封包解鎖引擎
    async function fetchWithProxyRetry(targetUrl) {
      let lastErrorMessage = "";
      for (let i = 0; i < PROXY_POOL.length; i++) {
        let proxy = PROXY_POOL[i];
        try {
          let reqUrl = proxy.includes("allorigins") ? `${proxy}${encodeURIComponent(targetUrl)}` : `${proxy}${targetUrl}`;
          pushLog(`[代理試探] 正在透過節點 ${i+1}/${PROXY_POOL.length} 轉接官方封包...`, "info");
          
          const res = await fetch(reqUrl);
          if (!res.ok) {
            lastErrorMessage = `HTTP 狀態碼 ${res.status}`;
            continue;
          }
          
          if (proxy.includes("allorigins")) {
            const wrapper = await res.json();
            return JSON.parse(wrapper.contents);
          } else {
            return await res.json();
          }
        } catch (e) {
          lastErrorMessage = e.message;
          pushLog(`節點 ${i+1} 遭證交所阻擋(CORS或連線超時)，準備切換兜底代理...`, "warning");
        }
      }
      throw new Error(`全數跨域代理節點崩潰。最後回報錯誤: ${lastErrorMessage}`);
    }

      try {
        for (let dateStr of recentDates) {
          const rawDateFormatted = dateStr.replace(/-/g, ""); 
          let dailyRowsMap = new Map();

            const twseTarget = `https://www.twse.com.tw/rwd/zh/fund/T86W?date=${rawDateFormatted}&response=json`;
            const json = await fetchWithProxyRetry(twseTarget);
            
            if (json && json.stat === "OK" && Array.isArray(json.data)) {
              json.data.forEach(row => {
                const stockId = String(row[0]).trim();
                dailyRowsMap.set(stockId, {
                  stock_id: stockId, date: dateStr,
                  foreign_buy: parseInt(row[2].replace(/,/g, "")) || 0,
                  foreign_sell: parseInt(row[3].replace(/,/g, "")) || 0,
                  foreign_dealer_buy: parseInt(row[5].replace(/,/g, "")) || 0,
                  foreign_dealer_sell: parseInt(row[6].replace(/,/g, "")) || 0,
                  investment_buy: parseInt(row[8].replace(/,/g, "")) || 0,
                  investment_sell: parseInt(row[9].replace(/,/g, "")) || 0,
                  dealer_self_buy: parseInt(row[12].replace(/,/g, "")) || 0,
                  dealer_self_sell: parseInt(row[13].replace(/,/g, "")) || 0,
                  dealer_hedging_buy: parseInt(row[15].replace(/,/g, "")) || 0,
                  dealer_hedging_sell: parseInt(row[16].replace(/,/g, "")) || 0
                });
              });
              pushLog(`成功自證交所解析出 ${dailyRowsMap.size} 檔上市個股籌碼資料`, "success");
            } else {
              pushLog(`證交所回報空數據，可能 ${dateStr} 為非交易市場假日。`, "warning");
            }
          } else {
            pushLog(`[下載中] 請求櫃買中心 ${dateStr} 日報表資料...`);

            const tpexTarget = `https://www.tpex.org.tw/web/stock/3insti/daily_trade/3itrade_hedge_result.php?d=${tpexDateStr}&se=EW&response=json`;
            
            const json = await fetchWithProxyRetry(tpexTarget);
            if (json && json.aaData && Array.isArray(json.aaData)) {
              json.aaData.forEach(row => {
                const stockId = String(row[0]).trim();
                dailyRowsMap.set(stockId, {
                  stock_id: stockId, date: dateStr,
                  foreign_buy: parseInt(row[2].replace(/,/g, "")) || 0,
                  foreign_sell: parseInt(row[3].replace(/,/g, "")) || 0,
                  foreign_dealer_buy: parseInt(row[5].replace(/,/g, "")) || 0,
                  foreign_dealer_sell: parseInt(row[6].replace(/,/g, "")) || 0,
                  investment_buy: parseInt(row[8].replace(/,/g, "")) || 0,
                  investment_sell: parseInt(row[9].replace(/,/g, "")) || 0,
                  dealer_self_buy: parseInt(row[11].replace(/,/g, "")) || 0,
                  dealer_self_sell: parseInt(row[12].replace(/,/g, "")) || 0,
                  dealer_hedging_buy: parseInt(row[14].replace(/,/g, "")) || 0,
                  dealer_hedging_sell: parseInt(row[15].replace(/,/g, "")) || 0
                });
              });
              pushLog(`成功自櫃買中心解析出 ${dailyRowsMap.size} 檔上櫃個股籌碼資料`, "success");
            } else {
              pushLog(`櫃買中心回報空數據，可能 ${dateStr} 為非交易市場假日。`, "warning");
            }
          }

          const uploadArray = Array.from(dailyRowsMap.values());
          if (uploadArray.length > 0) {
            pushLog(`[寫入資料庫中] 正在將 ${dateStr} 的 ${uploadArray.length} 筆官方大矩陣上傳到 Supabase...`);

            } else {
              pushLog(`✅ ${dateStr} 雲端官方資料 Upsert 儲存成功！`, "success");
            }
          }
          await new Promise(r => setTimeout(r, 1000));
        }
        statusText.innerText = "手動單獨同步工作圓滿完成。";
      } catch (err) {
        pushLog(`手動執行遭阻斷: ${err.message}`, "error");
        statusText.innerText = "🚨 診斷流發生 HTTP/CORS 錯誤";
      }
    }

          }
        } catch(e) { console.error(e); }

        const uploadArray = Array.from(dailyRowsMap.values());
        if (uploadArray.length > 0) {
          pushLog(`正在將自動補抓的 ${dateStr} 全球籌碼 (${uploadArray.length} 筆) 寫入雲端資料庫...`);
          await supabaseClient.from('official_stock_chips').upsert(uploadArray, { onConflict: 'stock_id,date' });
        }
        await new Promise(r => setTimeout(r, 1000));
      }
      statusText.innerText = "智慧連線巡航完畢。";
    }

    async function fetchCachedChipsWithLogs() {
      pushLog("強制啟動雲端快取數據同步機制...", "info");
      await fetchAllChipsFromSupabase();
      extractActualTradingDatesFromCache();
      applyFilters();
      pushLog("表格數據本地重繪完畢！", "success");
    }

    async function fetchAllChipsFromSupabase() {
      let startRange = 0;
      const batchSize = 4000; 
      let keepFetching = true;
      let allChipsFetched = [];

      while (keepFetching) {
        let endRange = startRange + batchSize - 1;
        pushLog(`正在向 Supabase 提取第 ${startRange} ~ ${endRange} 筆官方快取...`);

        const { data, error } = await supabaseClient
          .from('official_stock_chips')
          .select('*')
          .in('date', recentDates)
          .range(startRange, endRange);

        if (error) {
          pushLog(`快取提取被拒絕: ${error.message}`, "error");
          break; 
        }

        if (data && data.length > 0) {
          allChipsFetched = allChipsFetched.concat(data);
          if (data.length < batchSize) { keepFetching = false; } 
          else { startRange += batchSize; }
        } else { keepFetching = false; }
      }
      globalChipCache = allChipsFetched;
      pushLog(`雲端歷史快取分批接駁完成，網頁前端共進駐 ${globalChipCache.length} 筆法人數據。`, "success");
    }

    function formatDateToString(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

      const headerDates = document.getElementById("tableHeaderDates");
      const headerSub = document.getElementById("tableHeaderSub");
      if (!headerDates || !headerSub) return;

      let datesHtml = `
        <th rowspan="2" class="px-1 py-3 bg-slate-200 sticky left-0 z-40 w-[90px] min-w-[90px] max-w-[90px] align-middle text-center border-r border-slate-300">
          <div class="flex flex-col items-center gap-1">
            <span class="font-extrabold text-[11px] text-slate-900 whitespace-nowrap tracking-tighter">標的(代號/名稱)</span>
            <select onchange="changeSortMode(this.value)" class="text-[11px] border border-slate-400 rounded px-0.5 py-0.5 bg-white font-bold cursor-pointer focus:outline-none w-full text-slate-800 tracking-tighter">
              <option value="stock_id" ${currentSortMode==='stock_id'?'selected':''}>🔢 代號排序</option>
              <option value="foreign_buy" ${currentSortMode==='foreign_buy'?'selected':''}>🔺 外資買超</option>
              <option value="foreign_dealer_buy" ${currentSortMode==='foreign_dealer_buy'?'selected':''}>🔺 外自營買</option>
              <option value="investment_buy" ${currentSortMode==='investment_buy'?'selected':''}>🔺 投信買超</option>
              <option value="dealer_self_buy" ${currentSortMode==='dealer_self_buy'?'selected':''}>🔺 自營自行</option>
              <option value="dealer_hedging_buy" ${currentSortMode==='dealer_hedging_buy'?'selected':''}>🔺 自營避險</option>
              <option value="foreign_sell" ${currentSortMode==='foreign_sell'?'selected':''}>🔻 外資賣超</option>
              <option value="investment_sell" ${currentSortMode==='investment_sell'?'selected':''}>🔻 投信賣超</option>
            </select>
          </div>
        </th>
        <th rowspan="2" class="px-1 py-3 bg-slate-100 font-extrabold text-xs text-slate-800 sticky left-[90px] z-40 w-[52px] min-w-[52px] max-w-[52px] align-middle whitespace-nowrap border-r border-slate-300 text-center">法人</th>
        <th rowspan="2" class="px-1 py-3 bg-amber-100 font-black text-xs text-amber-950 sticky left-[142px] z-40 w-[68px] min-w-[68px] max-w-[68px] align-middle whitespace-nowrap border-r border-slate-300 text-center sticky-col-shadow">5日結</th>
      `;
      let subHtml = "";

      recentDates.forEach((dateStr, index) => {
        const parts = dateStr.split('-');
        const formattedDate = parts.length === 3 ? `${parts[1]}/${parts[2]}` : dateStr;
        const borderClass = index === recentDates.length - 1 ? "" : "border-r border-slate-300";
        datesHtml += `<th colspan="3" class="px-3 py-2.5 ${borderClass} text-sm bg-slate-100 text-slate-900 font-extrabold whitespace-nowrap">${formattedDate}</th>`;
        
        const subBorderClass = index === recentDates.length - 1 ? "" : "border-r border-slate-300 bg-slate-50";
        subHtml += `
          <th class="py-2 border-r border-slate-200 w-[55px] min-w-[55px] text-sm font-bold text-slate-600">買</th>
          <th class="py-2 border-r border-slate-200 w-[55px] min-w-[55px] text-sm font-bold text-slate-600">賣</th>
          <th class="py-2 ${subBorderClass} w-[65px] min-w-[65px] text-sm font-extrabold text-slate-800">結</th>
        `;
      });
      headerDates.innerHTML = datesHtml;
      headerSub.innerHTML = subHtml;
    }

    function changeSortMode(val) {
      currentSortMode = val;
      applyFilters();
    }

    async function autoLoadAndSyncExcelList() {
      try {
        const response = await fetch(EXCEL_SOURCE_URL);
        if (!response.ok) throw new Error();
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        const stockMap = new Map();
        
        workbook.SheetNames.forEach(sheetName => {
          const worksheet = workbook.Sheets[sheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet);
          jsonData.forEach(row => {
            const stockId = String(row['股票代號'] || row['代號'] || '').trim();
            const stockName = String(row['股票名稱'] || row['名稱'] || '').trim();
            if (stockId && stockName) {
              if (stockMap.has(stockId)) {
                const item = stockMap.get(stockId);
                if (!item.sheet_tags.includes(sheetName)) item.sheet_tags.push(sheetName);
              } else {
                stockMap.set(stockId, { stock_id: stockId, stock_name: stockName, sheet_tags: [sheetName], updated_at: new Date().toISOString() });
              }
            }
          });
        });

        const rowsToUpload = Array.from(stockMap.values());
        if (rowsToUpload.length > 0) {
          await supabaseClient.from('stock_targets').upsert(rowsToUpload, { onConflict: 'stock_id' });
        }
        
        const { data: dbData } = await supabaseClient.from('stock_targets').select('stock_id, stock_name, sheet_tags').order('stock_id', { ascending: true });
        dbStockData = dbData || [];
        
        document.getElementById("listUpdateTime").innerText = new Date().toLocaleDateString();

        targetSheetsSet.clear();
        dbStockData.forEach(item => { if (Array.isArray(item.sheet_tags)) item.sheet_tags.forEach(tag => targetSheetsSet.add(tag)); });
        updateTabButtons(Array.from(targetSheetsSet));
      } catch (err) {
        const { data: dbData } = await supabaseClient.from('stock_targets').select('stock_id, stock_name, sheet_tags').order('stock_id', { ascending: true });
        dbStockData = dbData || [];
      }
    }

    function updateTabButtons(sheets) {
      const container = document.getElementById("tabContainer");
      container.innerHTML = `<button onclick="switchTab('全部')" id="tab-全部" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-xs whitespace-nowrap cursor-pointer transition-colors">🌐 全部成分股</button>`;
      sheets.forEach(sheet => {
        const theme = colorThemes[sheet] || colorThemes['預設'];
        container.innerHTML += `<button onclick="switchTab('${sheet}')" id="tab('${sheet}')" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.inactive} whitespace-nowrap transition-colors cursor-pointer">📁 ${sheet}</button>`;
      });
      setActiveTabUI();
    }

    function switchTab(sheetName) {
      currentSourceTab = sheetName;
      applyFilters();
    }

    function setActiveTabUI() {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        const id = btn.id.replace('tab-', '');
        const theme = colorThemes[id] || colorThemes['預設'];
        btn.className = `tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.inactive} whitespace-nowrap transition-colors cursor-pointer`;
      });
      const activeBtn = document.getElementById(`tab-${currentSourceTab}`);
      if (activeBtn) {
        const theme = colorThemes[currentSourceTab] || colorThemes['預設'];
        activeBtn.className = `tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.active} whitespace-nowrap cursor-pointer`;
      }
    }

    function applyFilters() {
      setActiveTabUI();
      let filteredStocks = [...dbStockData];
      if (currentSourceTab !== '全部') {
        filteredStocks = dbStockData.filter(item => Array.isArray(item.sheet_tags) && item.sheet_tags.includes(currentSourceTab));
      }
      
      filteredStocks.sort((a, b) => {
        if (currentSortMode === 'stock_id') {
          return a.stock_id.localeCompare(b.stock_id, undefined, { numeric: true, sensitivity: 'base' });
        }

        const getSumForStock = (stockId, keyFieldName) => {
          const chips = globalChipCache.filter(c => c.stock_id === stockId && recentDates.includes(c.date));
          return chips.reduce((acc, row) => {
            const b = Math.round((row[`${keyFieldName}_buy`] || 0) / 1000);
            const s = Math.round((row[`${keyFieldName}_sell`] || 0) / 1000);
            return acc + (b - s);
          }, 0);
        };

        let valA = 0, valB = 0;
        if (currentSortMode === 'foreign_buy') {
          valA = getSumForStock(a.stock_id, 'foreign'); valB = getSumForStock(b.stock_id, 'foreign');
          return valB - valA;
        } else if (currentSortMode === 'foreign_dealer_buy') {
          valA = getSumForStock(a.stock_id, 'foreign_dealer'); valB = getSumForStock(b.stock_id, 'foreign_dealer');
          return valB - valA;
        } else if (currentSortMode === 'investment_buy') {
          valA = getSumForStock(a.stock_id, 'investment'); valB = getSumForStock(b.stock_id, 'investment');
          return valB - valA;
        } else if (currentSortMode === 'dealer_self_buy') {
          valA = getSumForStock(a.stock_id, 'dealer_self'); valB = getSumForStock(b.stock_id, 'dealer_self');
          return valB - valA;
        } else if (currentSortMode === 'dealer_hedging_buy') {
          valA = getSumForStock(a.stock_id, 'dealer_hedging'); valB = getSumForStock(b.stock_id, 'dealer_hedging');
          return valB - valA;
        } else if (currentSortMode === 'foreign_sell') {
          valA = getSumForStock(a.stock_id, 'foreign'); valB = getSumForStock(b.stock_id, 'foreign');
          return valA - valB;
        } else if (currentSortMode === 'investment_sell') {
          valA = getSumForStock(a.stock_id, 'investment'); valB = getSumForStock(b.stock_id, 'investment');
          return valA - valB;
        }
        return 0;
      });

      renderMatrixTableFromCache(filteredStocks);
    }

    function renderMatrixTableFromCache(stocks) {
      document.getElementById("recordCount").innerText = stocks.length;
      const tbody = document.getElementById("stockTableBody");
      if (!tbody) return;
      let htmlString = "";

      stocks.forEach(item => {
        const stockChips = globalChipCache.filter(c => c.stock_id === item.stock_id);

        let chipMap = {
          foreign: {}, foreignDealer: {}, investment: {}, dealerSelf: {} , dealerHedging: {}
        };
        
        recentDates.forEach(d => {
          chipMap.foreign[d] = { buy: 0, sell: 0 };
          chipMap.foreignDealer[d] = { buy: 0, sell: 0 };
          chipMap.investment[d] = { buy: 0, sell: 0 };
          chipMap.dealerSelf[d] = { buy: 0, sell: 0 };
          chipMap.dealerHedging[d] = { buy: 0, sell: 0 };
        });

        stockChips.forEach(row => {
          const d = row.date;
          if(!chipMap.foreign[d]) return; 
          
          chipMap.foreign[d] = { buy: Math.round(row.foreign_buy/1000), sell: Math.round(row.foreign_sell/1000) };
          chipMap.foreignDealer[d] = { buy: Math.round(row.foreign_dealer_buy/1000), sell: Math.round(row.foreign_dealer_sell/1000) };
          chipMap.investment[d] = { buy: Math.round(row.investment_buy/1000), sell: Math.round(row.investment_sell/1000) };
          chipMap.dealerSelf[d] = { buy: Math.round(row.dealer_self_buy/1000), sell: Math.round(row.dealer_self_sell/1000) };
          chipMap.dealerHedging[d] = { buy: Math.round(row.dealer_hedging_buy/1000), sell: Math.round(row.dealer_hedging_sell/1000) };
        });

        const sumFin = recentDates.reduce((acc, d) => acc + (chipMap.foreign[d].buy - chipMap.foreign[d].sell), 0);
        const sumFinDea = recentDates.reduce((acc, d) => acc + (chipMap.foreignDealer[d].buy - chipMap.foreignDealer[d].sell), 0);
        const sumInv = recentDates.reduce((acc, d) => acc + (chipMap.investment[d].buy - chipMap.investment[d].sell), 0);
        const sumDeaSelf = recentDates.reduce((acc, d) => acc + (chipMap.dealerSelf[d].buy - chipMap.dealerSelf[d].sell), 0);
        const sumDeaHed = recentDates.reduce((acc, d) => acc + (chipMap.dealerHedging[d].buy - chipMap.dealerHedging[d].sell), 0);

        const getCell = (buy, sell) => {
          const net = buy - sell;
          let netHtml = `<td class="py-2.5 border-r border-slate-300 text-slate-400 font-bold text-sm">0</td>`;
          if (net > 0) netHtml = `<td class="py-2.5 border-r border-slate-300 font-extrabold bg-red-50 text-red-600 text-sm">+${net}</td>`;
          if (net < 0) netHtml = `<td class="py-2.5 border-r border-slate-300 font-black bg-green-50 text-green-600 text-sm">${net}</td>`;
          return `<td class="py-2.5 border-r border-slate-200 text-emerald-600 font-medium text-sm">${buy}</td><td class="py-2.5 border-r border-slate-200 text-rose-600 font-medium text-sm">${sell}</td>${netHtml}`;
        };

        const getSumCell = (val, isDarkRow) => {
          const bgClass = isDarkRow ? 'bg-amber-50/70' : 'bg-amber-50';
          if (val > 0) return `<td class="py-2.5 border-r border-slate-300 font-black text-rose-700 text-sm sticky left-[142px] z-20 ${bgClass} sticky-col-shadow text-center">+${val}</td>`;
          if (val < 0) return `<td class="py-2.5 border-r border-slate-300 font-black text-emerald-700 text-sm sticky left-[142px] z-20 ${bgClass} sticky-col-shadow text-center">${val}</td>`;
          return `<td class="py-2.5 border-r border-slate-300 font-bold text-slate-500 text-sm sticky left-[142px] z-20 ${bgClass} sticky-col-shadow text-center">0</td>`;
        };

        let fRow = "", fdRow = "", iRow = "", dsRow = "", dhRow = "";
        recentDates.forEach(d => {
          fRow += getCell(chipMap.foreign[d].buy, chipMap.foreign[d].sell);
          fdRow += getCell(chipMap.foreignDealer[d].buy, chipMap.foreignDealer[d].sell);
          iRow += getCell(chipMap.investment[d].buy, chipMap.investment[d].sell);
          dsRow += getCell(chipMap.dealerSelf[d].buy, chipMap.dealerSelf[d].sell);
          dhRow += getCell(chipMap.dealerHedging[d].buy, chipMap.dealerHedging[d].sell);
        });

        htmlString += `
          <tr class="border-t-2 border-slate-300 hover:bg-slate-50/50">
            <td rowspan="5" class="px-1 py-4 border-r border-slate-300 font-mono text-slate-900 bg-slate-100 sticky left-0 z-20 text-center leading-tight w-[90px] max-w-[90px] overflow-hidden">
              <div class="text-sm font-black tracking-tighter text-slate-950">${item.stock_id}</div>
              <div class="text-[11px] text-slate-600 font-sans mt-0.5 font-bold truncate tracking-tighter">${item.stock_name}</div>
            </td>
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-bold text-xs text-slate-700 whitespace-nowrap sticky left-[90px] z-20 text-center w-[52px]">外資</td>
            ${getSumCell(sumFin, false)}${fRow}
          </tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-100 font-bold text-xs text-slate-700 whitespace-nowrap sticky left-[90px] z-20 text-center w-[52px]">外資自營</td>
            ${getSumCell(sumFinDea, true)}${fdRow}
          </td>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-bold text-xs text-slate-700 whitespace-nowrap sticky left-[90px] z-20 text-center w-[52px]">投信</td>
            ${getSumCell(sumInv, false)}${iRow}
          </td>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-100 font-bold text-xs text-slate-700 whitespace-nowrap sticky left-[90px] z-20 text-center w-[52px]">自營(自)</td>
            ${getSumCell(sumDeaSelf, true)}${dsRow}
          </td>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-bold text-xs text-slate-700 whitespace-nowrap sticky left-[90px] z-20 text-center w-[52px]">自營(避)</td>
            ${getSumCell(sumDeaHed, false)}${dhRow}
          </td>
        `;
      });

      tbody.innerHTML = htmlString;
      document.getElementById("dataSourceLabel").innerText = "🟠 數據狀態：官方直接接駁核心中 (分頁 Pagination 模式)";
    }
  </script>
