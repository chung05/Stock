<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台股籌碼 AI 分析面板 - 終極穩定版</title>
    <style>
        body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        button { background: #00cbb9; color: white; border: none; padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:disabled { background: #cccccc; }
        #output { background: #f4f4f4; padding: 15px; border-left: 5px solid #00cbb9; margin-top: 20px; white-space: pre-wrap; font-size: 14px; }
    </style>
</head>
<body>

    <h2>📈 台股法人籌碼 AI 分析系統（終極穩定版）</h2>
    <p>此版本已將 Prompt 與 模擬數據 直接內嵌至網頁中，避開瀏覽器檔案讀取限制，可直接流暢測試。</p>

    <button id="btn" onclick="startAIAnalysis()">上傳資料並讓 AI 分析</button>

    <h3>📊 專業交易員盤後報告：</h3>
    <div id="output">等待指令中...</div>

    <script>
        // 1. 你的 Supabase 後端網址
        const BACKEND_URL = 'https://fekesirsqjbkrgaibrjf.supabase.co/functions/v1/rapid-service';

        // 2. ✨ 絕招一：直接把很長的台股 Prompt 當作 JavaScript 變數
        const TAIGU_PROMPT = `你是一位專業台股法人籌碼分析師、波段交易員與市場資金流研究員。
請根據我提供的台股資料，分析目前市場中：
1. 有潛力的強勢股
2. 高風險個股
3. 主力可能正在布局的股票
4. 疑似主力出貨的股票

--------------------------------------------------
【請輸出以下結果】
■ 第一部分：TOP 10 潛力股（代號、名稱、理由、趨勢判斷、強度評分★☆☆☆☆ ~ ★★★★★）
■ 第二部分：TOP 10 高風險股（代號、名稱、風險原因、風險等級）

請以「專業交易員」角度分析，盡可能具體、直接、明確。`;

        // 3. ✨ 絕招二：直接把你的 JSONL 數據當作文字貼在這裡（以下為模擬測試數據）
        // ⚠️ 未來你可以直接把 ai_analysis.jsonl 裡面的內容複製，貼到這兩個反單引號中間
        const MOCK_JSONL_DATA = `{"date": "2026-05-25", "symbol": "2330", "name": "台積電", "foreign_buy": 15000, "foreign_sell": 2000, "close": 1030, "volume": 45000, "ma20": 1010, "macd": "gold_cross", "rsi": 65}
{"date": "2026-05-26", "symbol": "2330", "name": "台積電", "foreign_buy": 18000, "foreign_sell": 1000, "close": 1045, "volume": 52000, "ma20": 1015, "macd": "expanding", "rsi": 68}
{"date": "2026-05-26", "symbol": "2454", "name": "聯發科", "foreign_buy": 100, "foreign_sell": 5000, "close": 1120, "volume": 12000, "ma20": 1150, "macd": "dead_cross", "rsi": 38}`;

        async function startAIAnalysis() {
            const btn = document.getElementById('btn');
            const output = document.getElementById('output');
            
            btn.disabled = true;
            output.innerText = "資料整備完畢！正在直接傳送至 Supabase 後端，請稍候 5~10 秒讓 Gemini 進行深度籌碼診斷...";

            try {
                // 🚀 完全不進行 fetch 讀檔，直接打包發送變數！
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        uploadData: MOCK_JSONL_DATA,       // 直接帶入數據字串
                        customPrompt: TAIGU_PROMPT         // 直接帶入 Prompt 字串
                    })
                });

                const resultData = await response.json();
                
                if (resultData.report) {
                    output.innerText = resultData.report; // 渲染 AI 報告
                } else {
                    output.innerText = "後端出錯了：" + (resultData.error || "未知錯誤");
                }

            } catch (err) {
                output.innerText = "網路連線失敗：" + err.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
