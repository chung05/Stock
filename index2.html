<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>AI 數據分析測試（網頁版後端）</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        button { background: #00cbb9; color: white; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:disabled { background: #cccccc; }
        #output { background: #f4f4f4; padding: 15px; border-left: 5px solid #00cbb9; margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>🚀 純網頁端架構：AI 數據分析測試</h2>
    <p>點擊下方按鈕，會將這筆「咖啡廳數據」上傳到你剛剛在 Supabase 網頁上建好的後端，並由 Gemini 進行分析。</p>

    <button id="btn" onclick="uploadAndAnalyze()">上傳資料並讓 AI 分析</button>

    <h3>📊 AI 分析報告結果：</h3>
    <div id="output">等待上傳資料中...</div>

    <script>
        // ⚠️ 請把這裡換成你剛剛在 Supabase 網頁上複製的那個 Function 網址！
        const BACKEND_URL = 'https://fekesirsqjbkrgaibrjf.supabase.co/functions/v1/data-analyzer';

        // 這是我們要上傳給 AI 的模擬資料
        const mockData = {
            store_name: "亞瑟咖啡廳",
            period: "本週銷售數據",
            revenue_twd: 68000,
            unsold_items: { "熱美式": 5, "起司蛋糕": 42 }, 
            customer_reviews: "蛋糕有點太甜了，但咖啡很好喝！"
        };

        async function uploadAndAnalyze() {
            const btn = document.getElementById('btn');
            const output = document.getElementById('output');
            
            btn.disabled = true;
            output.innerText = "正在將資料送往 Supabase 後端，Gemini 分析中...";

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ uploadData: mockData })
                });

                const data = await response.json();
                
                if (data.report) {
                    output.innerText = data.report; 
                } else {
                    output.innerText = "出錯了：" + (data.error || "未知錯誤");
                }
            } catch (err) {
                output.innerText = "連線後端失敗：" + err.message;
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
