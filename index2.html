<script>
    // 1. 指向全新的 fetch_data_2AI 專案網址
    const BACKEND_URL = 'https://fekesirsqjbkrgaibrjf.supabase.co/functions/v1/fetch_data_2AI';

    async function fetchAndAnalyze() {
        const btn = document.getElementById('btn');
        const output = document.getElementById('output');
        
        btn.disabled = true;
        output.innerText = "已發送分析指令，Supabase 正在雲端進行數據讀取與 AI 診斷...";

        // 🌟 2. 請填入你的 Supabase anon 公開金鑰（在專案 Settings -> API 頁面取得）
        const SUPABASE_ANON_KEY = "填入你的_SUPABASE_ANON_KEY"; 

        try {
            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    // 🌟 帶上通行證，確保在最外層絕對不被網關阻擋
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                },
                body: JSON.stringify({ 
                    action: "analyze_latest_chips" 
                })
            });

            if (!response.ok) {
                throw new Error(`無法連線至後端閘道器（狀態碼: ${response.status}），請確認後端 Function 是否成功 Deploy。`);
            }

            const resultData = await response.json();
            
            // 🌟 3. 判斷後端是否有傳回捕捉到的詳細紅字錯誤
            if (resultData.error) {
                output.innerHTML = `<span style="color: #ff3b30; font-weight: bold; white-space: pre-wrap;">${resultData.error}</span>`;
            } else if (resultData.report) {
                // 渲染正常的 AI 分析報告
                output.innerText = resultData.report; 
            } else {
                output.innerText = "❌ 後端回傳格式異常，未包含報告與錯誤內容。";
            }

        } catch (err) {
            output.innerText = "❌ 網頁前端發送請求失敗：\n" + err.message;
        } finally {
            btn.disabled = false;
        }
    }
</script>
