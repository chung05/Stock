<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>牛牛分析站 - 智慧過濾籌碼寬資版</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    .sticky-col-shadow { box-shadow: 3px 0 6px -3px rgba(0, 0, 0, 0.25); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <div id="loadingModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full mx-4 text-center border border-slate-100 flex flex-col items-center">
      <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
      <h3 class="text-base font-bold text-slate-900 mb-1">雲端籌碼智慧同步中...</h3>
      <p id="loadingDetail" class="text-xs text-slate-500 font-medium">安全連線中...</p>
    </div>
  </div>

  <div class="sticky top-0 z-40 bg-linear-to-r from-sky-400 via-cyan-400 to-blue-400 text-slate-900 py-3 shadow-md border-b border-sky-300/30 px-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
      
      <div class="flex items-center gap-2 max-w-[75%] sm:max-w-none">
        <img src="main_icon.png" alt="牛牛標誌" class="w-[36px] h-[36px] sm:w-[42px] sm:h-[42px] object-contain rounded-lg shadow-xs bg-white/40 p-0.5 shrink-0">
        <div class="flex flex-col md:flex-row md:items-center md:gap-4">
          <h1 class="text-lg sm:text-2xl font-extrabold tracking-tight text-slate-950 leading-tight shrink-0">牛牛分析站</h1>
          
          <div class="flex flex-wrap items-center gap-x-3 gap-y-0.5 text-[10px] sm:text-xs font-semibold text-slate-900/90 mt-0.5 md:mt-0 bg-white/20 px-2 py-0.5 rounded-md border border-white/10">
            <div class="flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-600"></span>
              <span>名單：<span id="listUpdateTime" class="font-bold">載入中...</span></span>
            </div>
            <div class="flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>
              <span>資料：<span id="chipUpdateTime" class="font-bold">檢測中...</span></span>
            </div>
            <div id="uploadStatus" class="hidden sm:inline-block text-[10px] text-blue-900 font-bold ml-1">同步檢查中...</div>
          </div>
        </div>
      </div>
      
      <div class="shrink-0">
        <button onclick="forceSyncFlow()" class="cursor-pointer bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-lg text-xs font-bold transition shadow-md whitespace-nowrap text-center flex items-center justify-center gap-1 border border-amber-500/20">
          ⚡ 更新
        </button>
      </div>
      
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 pt-4 pb-12">
    <section class="bg-white p-3 rounded-xl shadow-xs border border-slate-200 mb-3">
      <div class="flex flex-row items-center justify-between gap-2 w-full">
        
        <div class="grow max-w-[45%] sm:max-w-none">
          <div class="hidden sm:block">
            <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 px-1">成分股來源分類</div>
            <div class="flex overflow-x-auto gap-2 scrollbar-none" id="tabContainer">
              <button onclick="switchTab('全部')" id="tab-全部" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-xs whitespace-nowrap cursor-pointer transition-colors">🌐 全部成分股</button>
            </div>
          </div>
          
          <div class="block sm:hidden w-full">
            <select id="mobileTabSelect" onchange="switchTab(this.value)" class="w-full bg-slate-100 border border-slate-300 rounded-lg px-2 py-1.5 text-xs font-bold text-slate-800 focus:outline-none focus:border-blue-500">
              <option value="全部">🌐 全部成分股</option>
            </select>
          </div>
        </div>
        
        <div class="flex items-center gap-1.5 shrink-0 max-w-[55%] sm:max-w-none">
          <div class="relative flex items-center w-full">
            <input type="text" id="keywordInput" onkeyup="handleSearchKeyup(event)" placeholder="代號或名稱..." class="w-28 sm:w-40 md:w-48 bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs font-medium focus:outline-none focus:border-blue-500 focus:bg-white transition-colors" />
            <button onclick="clearSearchField()" id="clearSearchBtn" class="hidden absolute right-2 text-slate-400 hover:text-slate-600 text-xs font-bold cursor-pointer">✕</button>
          </div>
          <button onclick="executeStockSearch()" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-2.5 py-1.5 rounded-lg text-xs font-bold transition shadow-xs whitespace-nowrap flex items-center gap-1">
            🔍 <span class="hidden sm:inline">搜尋</span>
          </button>
        </div>
        
      </div>
    </section>

    <section class="bg-blue-50 p-3 rounded-xl border border-blue-100 mb-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div class="text-sm text-slate-700 font-semibold">目前分類共有: <span id="recordCount" class="font-bold text-lg text-blue-600">0</span> 檔股票</div>
      <div id="dataSourceLabel" class="text-xs text-slate-500 font-bold bg-white px-2 py-1 rounded border border-blue-200">數據狀態：檢測中</div>
    </section>

    <section class="bg-white rounded-xl shadow-md border border-slate-300 overflow-auto max-h-[72vh] relative">
      <table class="min-w-full text-center text-sm text-slate-700 border-collapse table-fixed">
        <thead class="text-slate-800 font-extrabold sticky top-0 z-30 bg-slate-100 shadow-xs border-b border-slate-300">
          <tr id="tableHeaderDates"></tr>
          <tr id="tableHeaderSub" class="text-xs text-slate-500 bg-slate-50/80"></tr>
        </thead>
        <tbody id="stockTableBody" class="bg-white"></tbody>
      </table>
    </section>
  </div>

  <script>
    const SUPABASE_URL = "https://fekesirsqjbkrgaibrjf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZla2VzaXJzcWpia3JnYWlicmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTY0MjUsImV4cCI6MjA5NDU5MjQyNX0.82wBFq-B8cxfK9h_gkJQgIpMEabke1EhB6Oacw2lonc";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const colorThemes = {
      '全部': { active: 'bg-slate-800 text-white shadow-xs', inactive: 'bg-slate-100 text-slate-700 hover:bg-slate-200' },
      '高股息自選股': { active: 'bg-amber-500 text-white shadow-xs', inactive: 'bg-amber-50 text-amber-700 hover:bg-amber-100' },
      '電子權值股': { active: 'bg-indigo-600 text-white shadow-xs', inactive: 'bg-indigo-50 text-indigo-700 hover:bg-indigo-100' },
      '預設': { active: 'bg-emerald-600 text-white shadow-xs', inactive: 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100' }
    };

    let currentSourceTab = '全部';
    let dbStockData = [];          
    let globalChipCache = [];      
    let targetSheetsSet = new Set();
    let recentDates = []; 
    let currentSortMode = 'stock_id'; 
    let searchKeyword = ""; 

    document.addEventListener("DOMContentLoaded", async () => {
      calculateRecentFiveTradeDays(); 
      renderTableHeader(); 
      await forceSyncFlow(); 
    });

    function calculateRecentFiveTradeDays() {
      let dates = [];
      let d = new Date();
      while(dates.length < 5) {
        let day = d.getDay();
        if (day !== 0 && day !== 6) { 
          dates.push(formatDateToString(d));
        }
        d.setDate(d.getDate() - 1);
      }
      recentDates = dates; 
      document.getElementById("chipUpdateTime").innerText = recentDates[0];
    }

    async function forceSyncFlow() {
      const modal = document.getElementById("loadingModal");
      const detailText = document.getElementById("loadingDetail");
      const statusText = document.getElementById("uploadStatus");
      modal.classList.remove("hidden");

      try {
        statusText.innerText = "🔄 正在讀取雲端快取數據...";

        detailText.innerText = "1. 載入雲端股票名單與成分分類...";
        const { data: dbData, error: targetError } = await supabaseClient
          .from('stock_targets')
          .select('stock_id, stock_name, sheet_tags')
          .order('stock_id', { ascending: true });
          
        if (targetError) throw targetError;
        dbStockData = dbData || [];

        // 設定分類頁籤 UI
        document.getElementById("listUpdateTime").innerText = new Date().toLocaleDateString();
        targetSheetsSet.clear();
        dbStockData.forEach(item => { 
          if (Array.isArray(item.sheet_tags)) item.sheet_tags.forEach(tag => targetSheetsSet.add(tag)); 
        });
        updateTabButtons(Array.from(targetSheetsSet));

        detailText.innerText = "2. 正在精準定位最新 5 日盤後寬數據...";
        calculateRecentFiveTradeDays();

        detailText.innerText = "3. 分批讀取雲端大量籌碼快取庫...";
        await fetchAllChipsFromSupabase();

        detailText.innerText = "4. 正在佈局視覺矩陣...";
        renderTableHeader();
        applyFilters();

        statusText.innerText = "";
        document.getElementById("dataSourceLabel").innerText = "🟢 數據狀態：Supabase 雲端寬資料快取供應中";

      } catch (err) {
        console.error("讀取雲端快取資料流程發生異常:", err);
        statusText.innerText = "❌ 雲端讀取異常，請稍後重試";
      } finally {
        modal.classList.add("hidden");
      }
    }

    async function fetchAllChipsFromSupabase() {
      if (recentDates.length === 0 || dbStockData.length === 0) return;
      const detailText = document.getElementById("loadingDetail");
      const stockIdsInList = dbStockData.map(s => s.stock_id);
      
      let allChipsFetched = [];
      let startRange = 0;
      const batchSize = 3000;
      let keepFetching = true;

      while (keepFetching) {
        let endRange = startRange + batchSize - 1;
        detailText.innerText = `3. 分批載入雲端寬數據中 (${startRange} ~ ${endRange} 筆)...`;

        const { data, error } = await supabaseClient
          .from('stock_chips_daily')
          .select('*')
          .in('stock_id', stockIdsInList)
          .in('date', recentDates)
          .range(startRange, endRange);

        if (error) {
          console.error("分批讀取寬表雲端快取異常:", error);
          break;
        }

        if (data && data.length > 0) {
          allChipsFetched = allChipsFetched.concat(data);
          if (data.length < batchSize) {
            keepFetching = false;
          } else {
            startRange += batchSize;
          }
        } else {
          keepFetching = false;
        }
      }

      globalChipCache = allChipsFetched;
    }

    function formatDateToString(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function renderTableHeader() {
      const headerDates = document.getElementById("tableHeaderDates");
      const headerSub = document.getElementById("tableHeaderSub");
      if (!headerDates || !headerSub) return;

      let datesHtml = `
        <th rowspan="2" class="px-1 py-2 bg-slate-200 sticky left-0 z-40 w-[94px] min-w-[94px] max-w-[94px] align-middle text-center border-r border-slate-300">
          <div class="flex flex-col items-center gap-1">
            <span class="font-extrabold text-[11px] text-slate-900 whitespace-nowrap tracking-tighter">標的(代號/名稱)</span>
            <select onchange="changeSortMode(this.value)" class="text-[11px] border border-slate-400 rounded px-0.5 py-0.5 bg-white font-bold cursor-pointer focus:outline-none w-full text-slate-800 tracking-tighter">
              <option value="stock_id" ${currentSortMode==='stock_id'?'selected':''}>🔢 代號排序</option>
              <option value="foreign_buy" ${currentSortMode==='foreign_buy'?'selected':''}>🔺 外資買超</option>
              <option value="foreign_dealer_buy" ${currentSortMode==='foreign_dealer_buy'?'selected':''}>🔺 外自營買</option>
              <option value="investment_buy" ${currentSortMode==='investment_buy'?'selected':''}>🔺 投信買超</option>
              <option value="dealer_self_buy" ${currentSortMode==='dealer_self_buy'?'selected':''}>🔺 自營自行</option>
              <option value="dealer_hedging_buy" ${currentSortMode==='dealer_hedging_buy'?'selected':''}>🔺 自營避險</option>
              <option value="foreign_sell" ${currentSortMode==='foreign_sell'?'selected':''}>🔻 外資賣超</option>
              <option value="foreign_dealer_sell" ${currentSortMode==='foreign_dealer_sell'?'selected':''}>🔻 外自營賣</option>
              <option value="investment_sell" ${currentSortMode==='investment_sell'?'selected':''}>🔻 投信賣超</option>
              <option value="dealer_self_sell" ${currentSortMode==='dealer_self_sell'?'selected':''}>🔻 自營自行賣</option>
              <option value="dealer_hedging_sell" ${currentSortMode==='dealer_hedging_sell'?'selected':''}>🔻 自營避險賣</option>
            </select>
          </div>
        </th>
        <th rowspan="2" class="px-1 py-2 bg-slate-100 font-extrabold text-xs text-slate-800 sticky left-[94px] z-40 w-[52px] min-w-[52px] max-w-[52px] align-middle whitespace-nowrap border-r border-slate-300 text-center">法人</th>
        <th rowspan="2" class="px-1 py-2 bg-amber-100 font-black text-xs text-amber-950 sticky left-[146px] z-40 w-[68px] min-w-[68px] max-w-[68px] align-middle whitespace-nowrap border-r border-slate-300 text-center sticky-col-shadow">5日結</th>
      `;
      let subHtml = "";

      recentDates.forEach((dateStr, index) => {
        const parts = dateStr.split('-');
        const formattedDate = parts.length === 3 ? `${parts[1]}/${parts[2]}` : dateStr;
        const borderClass = index === recentDates.length - 1 ? "" : "border-r border-slate-300";
        datesHtml += `<th colspan="3" class="px-2 py-2 ${borderClass} text-sm bg-slate-100 text-slate-900 font-bold whitespace-nowrap">${formattedDate}</th>`;
        
        const subBorderClass = index === recentDates.length - 1 ? "" : "border-r border-slate-300 bg-slate-50";
        subHtml += `
          <th class="py-1.5 border-r border-slate-200 w-[55px] min-w-[55px] text-sm font-bold text-slate-600">買</th>
          <th class="py-1.5 border-r border-slate-200 w-[55px] min-w-[55px] text-sm font-bold text-slate-600">賣</th>
          <th class="py-1.5 ${subBorderClass} w-[65px] min-w-[65px] text-sm font-extrabold text-slate-800">結</th>
        `;
      });
      headerDates.innerHTML = datesHtml;
      headerSub.innerHTML = subHtml;
    }

    function changeSortMode(val) {
      currentSortMode = val;
      applyFilters();
    }

    function updateTabButtons(sheets) {
      // 1. 同步更新桌面版 Tab
      const container = document.getElementById("tabContainer");
      container.innerHTML = `<button onclick="switchTab('全部')" id="tab-全部" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-xs whitespace-nowrap cursor-pointer transition-colors">🌐 全部成分股</button>`;
      
      // 2. 同步更新手機版下拉選單
      const mobileSelect = document.getElementById("mobileTabSelect");
      mobileSelect.innerHTML = `<option value="全部">🌐 全部成分股</option>`;

      sheets.forEach(sheet => {
        const theme = colorThemes[sheet] || colorThemes['預設'];
        container.innerHTML += `<button onclick="switchTab('${sheet}')" id="tab-${sheet}" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.inactive} whitespace-nowrap transition-colors cursor-pointer">📁 ${sheet}</button>`;
        mobileSelect.innerHTML += `<option value="${sheet}">📁 ${sheet}</option>`;
      });
      setActiveTabUI();
    }

    function switchTab(sheetName) {
      currentSourceTab = sheetName;
      applyFilters();
    }

    function setActiveTabUI() {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        const id = btn.id.replace('tab-', '');
        const theme = colorThemes[id] || colorThemes['預設'];
        btn.className = `tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.inactive} whitespace-nowrap transition-colors cursor-pointer`;
      });
      const activeBtn = document.getElementById(`tab-${currentSourceTab}`);
      if (activeBtn) {
        const theme = colorThemes[currentSourceTab] || colorThemes['預設'];
        activeBtn.className = `tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.active} whitespace-nowrap cursor-pointer`;
      }

      const mobileSelect = document.getElementById("mobileTabSelect");
      if (mobileSelect && mobileSelect.value !== currentSourceTab) {
        mobileSelect.value = currentSourceTab;
      }
    }

    function handleSearchKeyup(e) {
      const input = document.getElementById("keywordInput");
      const clearBtn = document.getElementById("clearSearchBtn");
      if (input.value.trim() !== "") {
        clearBtn.classList.remove("hidden");
      } else {
        clearBtn.classList.add("hidden");
      }
      if (e.key === "Enter") executeStockSearch();
    }

    function executeStockSearch() {
      const input = document.getElementById("keywordInput");
      searchKeyword = input.value.trim().toLowerCase();
      applyFilters();
    }

    function clearSearchField() {
      const input = document.getElementById("keywordInput");
      input.value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      searchKeyword = "";
      applyFilters();
    }

    function applyFilters() {
      setActiveTabUI();
      let filteredStocks = [...dbStockData];
      
      if (currentSourceTab !== '全部') {
        filteredStocks = dbStockData.filter(item => Array.isArray(item.sheet_tags) && item.sheet_tags.includes(currentSourceTab));
      }
      
      if (searchKeyword !== "") {
        filteredStocks = filteredStocks.filter(item => 
          item.stock_id.toLowerCase().includes(searchKeyword) || 
          item.stock_name.toLowerCase().includes(searchKeyword)
        );
      }
      
      filteredStocks.sort((a, b) => {
        if (currentSortMode === 'stock_id') {
          return a.stock_id.localeCompare(b.stock_id, undefined, { numeric: true, sensitivity: 'base' });
        }

        const getSumForStock = (stockId, buyField, sellField) => {
          const chips = globalChipCache.filter(c => c.stock_id === stockId);
          return chips.reduce((acc, row) => {
            const buy = Math.round((row[buyField] || 0) / 1000);
            const sell = Math.round((row[sellField] || 0) / 1000);
            return acc + (buy - sell);
          }, 0);
        };

        let valA = 0, valB = 0;
        switch (currentSortMode) {
          case 'foreign_buy':
            valA = getSumForStock(a.stock_id, 'f_buy', 'f_sell'); valB = getSumForStock(b.stock_id, 'f_buy', 'f_sell'); return valB - valA;
          case 'foreign_dealer_buy':
            valA = getSumForStock(a.stock_id, 'fd_buy', 'fd_sell'); valB = getSumForStock(b.stock_id, 'fd_buy', 'fd_sell'); return valB - valA;
          case 'investment_buy':
            valA = getSumForStock(a.stock_id, 'it_buy', 'it_sell'); valB = getSumForStock(b.stock_id, 'it_buy', 'it_sell'); return valB - valA;
          case 'dealer_self_buy':
            valA = getSumForStock(a.stock_id, 'ds_buy', 'ds_sell'); valB = getSumForStock(b.stock_id, 'ds_buy', 'ds_sell'); return valB - valA;
          case 'dealer_hedging_buy':
            valA = getSumForStock(a.stock_id, 'dh_buy', 'dh_sell'); valB = getSumForStock(b.stock_id, 'dh_buy', 'dh_sell'); return valB - valA;
          case 'foreign_sell':
            valA = getSumForStock(a.stock_id, 'f_buy', 'f_sell'); valB = getSumForStock(b.stock_id, 'f_buy', 'f_sell'); return valA - valB;
          case 'foreign_dealer_sell':
            valA = getSumForStock(a.stock_id, 'fd_buy', 'fd_sell'); valB = getSumForStock(b.stock_id, 'fd_buy', 'fd_sell'); return valA - valB;
          case 'investment_sell':
            valA = getSumForStock(a.stock_id, 'it_buy', 'it_sell'); valB = getSumForStock(b.stock_id, 'it_buy
