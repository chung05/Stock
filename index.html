<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <div id="newsModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 px-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-6xl w-full max-h-[90vh] min-h-[550px] md:min-h-0 flex flex-col border border-slate-100 overflow-hidden">
      
      <div class="py-2 px-4 border-b border-slate-200 flex items-center justify-between bg-slate-50 rounded-t-2xl shrink-0">

        <button onclick="closeNewsModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold cursor-pointer p-1">✕</button>
      </div>

      <div id="modalIndicatorBar" class="bg-linear-to-r from-slate-50 to-slate-100 border-b border-slate-200 px-4 py-2.5 grid grid-cols-3 sm:grid-cols-5 gap-2 shrink-0 text-center">
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs">
          <div class="text-[10px] font-bold text-slate-400">目前股價</div>
          <div id="modalInfoPrice" class="text-xs font-black text-slate-800">--</div>
        </div>
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs">
          <div class="text-[10px] font-bold text-slate-400">今日漲跌</div>
          <div id="modalInfoChange" class="text-xs font-black text-slate-800">--</div>
        </div>
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs">
          <div class="text-[10px] font-bold text-slate-400">MA10 均線</div>
          <div id="modalInfoMA10" class="text-xs font-black text-blue-600">--</div>
        </div>
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs">
          <div class="text-[10px] font-bold text-slate-400">MA20 均線</div>
          <div id="modalInfoMA20" class="text-xs font-black text-orange-600">--</div>
        </div>
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs">
          <div class="text-[10px] font-bold text-slate-400">RSI14 強弱</div>
          <div id="modalInfoRSI14" class="text-xs font-black text-purple-600">--</div>
        </div>
      </div>

      <div class="flex border-b border-slate-200 bg-slate-50/50 px-4 shrink-0">
        <button id="tabBtnTrend" onclick="switchModalTab('trend')" class="py-1.5 px-4 text-sm font-black border-b-2 border-blue-600 text-blue-600 focus:outline-none cursor-pointer transition-all">
          📈 近期走勢
        </button>
        <button id="tabBtnNews" onclick="switchModalTab('news')" class="py-1.5 px-4 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 focus:outline-none cursor-pointer transition-all">
          📰 財經新聞
        </button>
      </div>
      
      <div class="p-4 overflow-y-auto h-[500px] md:h-auto md:grow bg-slate-50/30 relative flex flex-col">
        
        <div id="trendZone" class="block space-y-4 w-full grow">
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs">
            <h4 class="text-xs font-black text-slate-500 mb-1 flex items-center gap-1">🔹 股價走勢</h4>
            
            <div id="priceScrollWrapper" class="w-full overflow-x-auto pb-2 scrollbar-thin">
              <div class="min-w-[960px] px-1">
                <div id="trendPriceChart" class="flex items-end justify-between h-24 pt-4 border-b border-slate-200 relative w-full">
                  </div>
                <div id="trendPriceDates" class="flex justify-between font-black mt-1.5 w-full"></div>
              </div>
            </div>
            
          </div>

          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs">
            <div class="flex justify-between items-center border-b border-slate-100 pb-1 mb-1">
              <h4 class="text-xs font-black text-slate-500 flex items-center gap-1">🔹 三大法人 (張)</h4>
              <div class="flex bg-slate-100 p-0.5 rounded-lg border border-slate-200">
                <button id="subTabF" onclick="switchChipSubTab('f')" class="px-3 py-1 text-xs font-black bg-white text-slate-900 rounded-md shadow-2xs cursor-pointer transition-all">外資</button>
                <button id="subTabIT" onclick="switchChipSubTab('it')" class="px-3 py-1 text-xs font-bold text-slate-500 hover:text-slate-800 rounded-md cursor-pointer transition-all">投信</button>
                <button id="subTabDS" onclick="switchChipSubTab('ds')" class="px-3 py-1 text-xs font-bold text-slate-500 hover:text-slate-800 rounded-md cursor-pointer transition-all">自營商</button>
              </div>
            </div>
            
            <div id="chipScrollWrapper" class="w-full overflow-x-auto pb-2 scrollbar-thin">
              <div id="trendChipChart" class="w-full min-w-[960px]">
                </div>
            </div>
          </div>
        </div>

        <div id="newsZone" class="hidden h-full w-full overflow-y-auto grow">
          <div id="newsListZone" class="space-y-3 block w-full"></div>
        </div>

      </div>
    </div>
  </div>

  <div class="sticky top-0 z-40 bg-linear-to-r from-sky-400 via-cyan-400 to-blue-400 text-slate-900 py-3 shadow-md border-b border-sky-300/30 px-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      
      <div class="flex items-center gap-2.5 min-w-0 shrink-0">
        <img src="main_icon.png" alt="牛牛標誌" class="w-[36px] h-[36px] object-contain rounded-lg shadow-xs bg-white/40 p-0.5 shrink-0">
        <h1 class="text-lg md:text-xl font-extrabold tracking-tight text-slate-950 whitespace-nowrap">牛牛分析站</h1>
      </div>
      
      <div class="flex items-center gap-4 shrink-0 min-w-0">
        <div class="hidden sm:flex items-center gap-3 text-[11px] font-bold text-slate-800/90 whitespace-nowrap overflow-hidden">
          <span class="flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-600"></span>
            名單更新：<span id="listUpdateTime" class="font-black text-slate-950">載入中...</span>
          </span>
          <span class="flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>
            資料更新：<span id="chipUpdateTime" class="font-black text-slate-950">檢測中...</span>
          </span>
        </div>
        
        <button onclick="forceSyncFlow()" class="cursor-pointer bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-xs whitespace-nowrap flex items-center justify-center gap-1">
          ⚡ 更新
        </button>
      </div>
      
    </div>
  </div>

  <div class="sm:hidden bg-slate-100 border-b border-slate-200 px-4 py-1.5 flex items-center justify-between text-[11px] font-bold text-slate-600">
    <span>名單：<span id="listUpdateTimeMob" class="text-slate-900 font-black">..</span></span>
    <span>資料更新：<span id="chipUpdateTimeMob" class="text-slate-900 font-black">..</span></span>
  </div>

  <div class="max-w-7xl mx-auto px-4 pt-4 pb-12">
    <section class="bg-white p-3 rounded-xl shadow-xs border border-slate-200 mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      
      <div class="flex items-center gap-3 grow sm:max-w-xl">
        <div class="w-40 md:w-48 shrink-0">
          <select id="tabSelect" onchange="switchTab(this.value)" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs font-bold text-slate-700 focus:outline-none focus:border-blue-500 focus:bg-white cursor-pointer transition-colors">
            <option value="全部">🌐 全部成分股</option>
          </select>
        </div>
        <div class="text-xs text-slate-500 font-semibold whitespace-nowrap">
          共有: <span id="recordCount" class="font-bold text-sm text-blue-600">0</span> 檔股票
        </div>
      </div>
      
      <div class="flex items-center gap-1.5 shrink-0 justify-start sm:justify-end">
        <div class="relative flex items-center">
          <input type="text" id="keywordInput" onkeyup="handleSearchKeyup(event)" placeholder="輸入代號或名稱..." class="w-36 md:w-48 bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-medium focus:outline-none focus:border-blue-500 focus:bg-white transition-colors" />
          <button onclick="clearSearchField()" id="clearSearchBtn" class="hidden absolute right-2.5 text-slate-400 hover:text-slate-600 text-xs font-bold cursor-pointer">✕</button>
        </div>
        <button onclick="executeStockSearch()" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-xs whitespace-nowrap flex items-center gap-1">
          🔍 搜尋
        </button>
      </div>
    </section>

    <section id="mainTableWrapper" class="bg-white rounded-xl shadow-md border border-slate-300 overflow-auto max-h-[72vh] relative">
      <table class="min-w-full text-center text-sm text-slate-700 border-collapse table-fixed">
        <thead class="text-slate-800 font-extrabold sticky top-0 z-30 bg-slate-100 shadow-xs border-b border-slate-300">
          <tr id="tableHeaderDates"></tr>
          <tr id="tableHeaderSub" class="text-xs text-slate-500 bg-slate-50/80"></tr>
        </thead>
        <tbody id="stockTableBody" class="bg-white"></tbody>
      </table>
    </section>
  </div>

  <script>
    const SUPABASE_URL = "https://fekesirsqjbkrgaibrjf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZla2VzaXJzcWpia3JnYWlicmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTY0MjUsImV4cCI6MjA5NDU5MjQyNX0.82wBFq-B8cxfK9h_gkJQgIpMEabke1EhB6Oacw2lonc";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 全域變數
    let currentSourceTab = '全部';
    let dbStockData = [];          
    let globalChipCache = [];      
    let targetSheetsSet = new Set();
    let recentDates = [];           // 主表格專用的最新5天日期 (全域)
    let extendedTrendDates = [];    // 趨勢圖預設20天日期 (全域備用)
    
    let currentSortMode = 'investment_buy'; 
    let currentSumDaysMode = 5; 
    let searchKeyword = ""; 
    let activeNewsData = []; 
    let currentActiveStockId = ""; 
    let currentChipSubTab = "f";   

    document.addEventListener("DOMContentLoaded", async () => {
      calculateTradeDaysLists(); 
      renderTableHeader(); 
      await forceSyncFlow(); 
    });

    function calculateTradeDaysLists() {
      let dates20 = [];
      let d = new Date();
      while(dates20.length < 20) {
        let day = d.getDay();
        if (day !== 0 && day !== 6) { 
          dates20.push(formatDateToString(d));
        }
        d.setDate(d.getDate() - 1);
      }
      extendedTrendDates = dates20; 
      recentDates = dates20.slice(0, 5); 
      updateDisplayDates(recentDates[0]);
    }

    function updateDisplayDates(startDateStr) {
      const el = document.getElementById("chipUpdateTime");
      const elMob = document.getElementById("chipUpdateTimeMob");
      if (el) el.innerText = startDateStr || "--";
      if (elMob) elMob.innerText = startDateStr || "--";
    }

    async function forceSyncFlow() {
      const modal = document.getElementById("loadingModal");
      const detailText = document.getElementById("loadingDetail");
      modal.classList.remove("hidden");

      try {
        detailText.innerText = "1. 載入雲端股票名單與成分分類...";
        const { data: dbData, error: targetError = null } = await supabaseClient
          .from('stock_targets')
          .select('*')
          .order('stock_id', { ascending: true });
          
        if (targetError) throw targetError;
        dbStockData = dbData || [];

        const todayStr = new Date().toLocaleDateString();
        if(document.getElementById("listUpdateTime")) document.getElementById("listUpdateTime").innerText = todayStr;
        if(document.getElementById("listUpdateTimeMob")) document.getElementById("listUpdateTimeMob").innerText = todayStr;

        targetSheetsSet.clear();
        dbStockData.forEach(item => { 
          if (Array.isArray(item.sheet_tags)) {
            item.sheet_tags.forEach(tag => targetSheetsSet.add(tag)); 
          }
        });
        
        updateTabSelectOptions(Array.from(targetSheetsSet));
        
        calculateTradeDaysLists();

        detailText.innerText = "2. 正在讀取雲端籌碼與股價數據...";
        await fetchAllChipsFromSupabase();

        detailText.innerText = "3. 正在建立網頁表格視覺矩陣...";
        renderTableHeader();
        applyFilters();

      } catch (err) {
        console.error("讀取雲端快取資料流程發生異常:", err);
      } finally {
        modal.classList.add("hidden");
      }
    }

    async function fetchAllChipsFromSupabase() {
      if (extendedTrendDates.length === 0 || dbStockData.length === 0) return;
      const detailText = document.getElementById("loadingDetail");
      
      let allChipsFetched = [];
      const stockIds = dbStockData.map(s => String(s.stock_id).trim());
      
      const chunkSize = 50; 
      for (let i = 0; i < stockIds.length; i += chunkSize) {
        const chunkIds = stockIds.slice(i, i + chunkSize);
        detailText.innerText = `2. 同步核心籌碼數據中 (${Math.min(i + chunkSize, stockIds.length)} / ${stockIds.length} 檔)...`;

        let retries = 3;
        let success = false;

        while (retries > 0 && !success) {
          const { data, error } = await supabaseClient
            .from('stock_chips_daily')
            .select('*')
            .in('stock_id', chunkIds)
            .in('date', extendedTrendDates); 

          if (error) {
            console.warn(`批次 ${i} 讀取失敗，剩餘重試次數: ${retries - 1}`, error);
            retries--;
            if (retries === 0) {
              console.error(`❌ 批次 ${i} 徹底失敗。`);
            } else {
              await new Promise(resolve => setTimeout(resolve, 500));
            }
          } else {
            if (data) {
              allChipsFetched = allChipsFetched.concat(data);
            }
            success = true;
          }
        }
      }

      globalChipCache = allChipsFetched;

      if (globalChipCache.length > 0) {
        const dbDates = Array.from(new Set(globalChipCache.map(c => String(c.date))))
                             .sort((a, b) => b.localeCompare(a)); 
        
        if (dbDates.length > 0) {
          extendedTrendDates = dbDates.slice(0, 20); 
          recentDates = dbDates.slice(0, 5); 
          updateDisplayDates(recentDates[0]);
        }
      }
    }

    function formatDateToString(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function changeSumDaysMode(val) {
      currentSumDaysMode = parseInt(val, 10);
      applyFilters();
    }

    function renderTableHeader() {
      const headerDates = document.getElementById("tableHeaderDates");
      const headerSub = document.getElementById("tableHeaderSub");
      if (!headerDates || !headerSub) return;

      let datesHtml = `
        <th rowspan="2" class="px-1 py-2 bg-slate-200 sticky left-0 z-40 w-[112px] min-w-[112px] max-w-[112px] align-middle text-center border-r border-slate-300">
          <div class="flex flex-col items-center gap-1">
            <span class="font-extrabold text-[11px] text-slate-900 whitespace-nowrap tracking-tighter">標的</span>
            <select onchange="changeSortMode(this.value)" class="text-[11px] border border-slate-400 rounded px-0.5 py-0.5 bg-white font-bold cursor-pointer focus:outline-none w-full text-slate-800 tracking-tighter">
              <option value="stock_id" ${currentSortMode==='stock_id'?'selected':''}>🔢 代號排序</option>
              <option value="foreign_buy" ${currentSortMode==='foreign_buy'?'selected':''}>🔺 外資買超</option>
              <option value="foreign_dealer_buy" ${currentSortMode==='foreign_dealer_buy'?'selected':''}>🔺 外陸資自營商買</option>
              <option value="investment_buy" ${currentSortMode==='investment_buy'?'selected':''}>🔺 投信買超</option>
              <option value="dealer_self_buy" ${currentSortMode==='dealer_self_buy'?'selected':''}>🔺 自營商(自行)買</option>
              <option value="dealer_hedging_buy" ${currentSortMode==='dealer_hedging_buy'?'selected':''}>🔺 自營商(避險)買</option>
              <option value="foreign_sell" ${currentSortMode==='foreign_sell'?'selected':''}>🔻 外資賣超</option>
              <option value="foreign_dealer_sell" ${currentSortMode==='foreign_dealer_sell'?'selected':''}>🔻 外陸資自營商賣</option>
              <option value="investment_sell" ${currentSortMode==='investment_sell'?'selected':''}>🔻 投信賣超</option>
              <option value="dealer_self_sell" ${currentSortMode==='dealer_self_sell'?'selected':''}>🔻 自營商(自行)賣</option>
              <option value="dealer_hedging_sell" ${currentSortMode==='dealer_hedging_sell'?'selected':''}>🔻 自營商(避險)賣</option>
            </select>
          </div>
        </th>
        <th rowspan="2" class="px-1 py-2 bg-slate-100 font-extrabold text-xs text-slate-800 sticky left-[112px] z-40 w-[52px] min-w-[52px] max-w-[52px] align-middle whitespace-nowrap border-r border-slate-300 text-center">法人</th>
        <th rowspan="2" class="px-1 py-1 bg-rose-50 sticky left-[164px] z-40 w-[74px] min-w-[74px] max-w-[74px] align-middle border-r border-slate-300 text-center sticky-col-shadow">
          <select onchange="changeSumDaysMode(this.value)" class="text-[11px] border border-slate-400 rounded px-0.5 py-0.5 bg-white font-black cursor-pointer focus:outline-none w-full text-rose-600 tracking-tighter text-center">
            <option value="5" ${currentSumDaysMode===5?'selected':''}>5日結</option>
            <option value="3" ${currentSumDaysMode===3?'selected':''}>3日結</option>
          </select>
        </th>
      `;
      let subHtml = "";

      recentDates.forEach((dateStr, index) => {
        const parts = dateStr.split('-');
        const formattedDate = parts.length === 3 ? `${parts[1]}/${parts[2]}` : dateStr;
        const borderClass = index === recentDates.length - 1 ? "" : "border-r border-slate-300";
        datesHtml += `<th colspan="3" class="px-2 py-2 ${borderClass} text-sm bg-slate-100 text-slate-900 font-bold whitespace-nowrap">${formattedDate}</th>`;
        
        const subBorderClass = index === recentDates.length - 1 ? "" : "border-r border-slate-300";
        subHtml += `
          <th class="py-1.5 border-r border-slate-200 w-[55px] min-w-[55px] text-sm font-bold text-blue-600">買</th>
          <th class="py-1.5 border-r border-slate-200 w-[55px] min-w-[55px] text-sm font-bold text-emerald-600">賣</th>
          <th class="py-1.5 ${subBorderClass} w-[65px] min-w-[65px] text-sm font-extrabold text-rose-600">結</th>
        `;
      });
      headerDates.innerHTML = datesHtml;
      headerSub.innerHTML = subHtml;
    }

    function changeSortMode(val) {
      currentSortMode = val;
      applyFilters();
    }

    function getActiveSumDates() {
      return recentDates.slice(0, currentSumDaysMode);
    }

    function updateTabSelectOptions(sheets) {
      const select = document.getElementById("tabSelect");
      if (!select) return;
      select.innerHTML = `<option value="全部">🌐 全部成分股</option>`;
      sheets.forEach(sheet => {
        if (!sheet) return;
        select.innerHTML += `<option value="${sheet}">📁 ${sheet}</option>`;
      });
      select.value = currentSourceTab;
    }

    function switchTab(sheetName) {
      currentSourceTab = sheetName;
      applyFilters();
    }

    function handleSearchKeyup(e) {
      const input = document.getElementById("keywordInput");
      const clearBtn = document.getElementById("clearSearchBtn");
      if (input.value.trim() !== "") {
        clearBtn.classList.remove("hidden");
      } else {
        clearBtn.classList.add("hidden");
      }
      if (e.key === "Enter") executeStockSearch();
    }

    function executeStockSearch() {
      const input = document.getElementById("keywordInput");
      searchKeyword = input.value.trim().toLowerCase();
      applyFilters();
    }

    function clearSearchField() {
      const input = document.getElementById("keywordInput");
      input.value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      searchKeyword = "";
      applyFilters();
    }

    function applyFilters() {
      let filteredStocks = [...dbStockData];
      
      if (currentSourceTab !== '全部') {
        filteredStocks = dbStockData.filter(item => item && Array.isArray(item.sheet_tags) && item.sheet_tags.includes(currentSourceTab));
      }
      
      if (searchKeyword !== "") {
        filteredStocks = filteredStocks.filter(item => {
          if (!item) return false;
          const idStr = String(item.stock_id).toLowerCase();
          const nameStr = String(item.stock_name || '').toLowerCase();
          return idStr.includes(searchKeyword) || nameStr.includes(searchKeyword);
        });
      }
      
      filteredStocks.sort((a, b) => {
        const idA = String(a.stock_id).trim();
        const idB = String(b.stock_id).trim();

        if (currentSortMode === 'stock_id') {
          return idA.localeCompare(idB, undefined, { numeric: true, sensitivity: 'base' });
        }

        const getSumForStock = (stockId, buyField, sellField) => {
          const chips = globalChipCache.filter(c => String(c.stock_id).trim() === stockId);
          const sumDates = getActiveSumDates();
          return chips.reduce((acc, row) => {
            if (!sumDates.includes(String(row.date))) return acc; 
            const buy = Math.round((row[buyField] || 0) / 1000);
            const sell = Math.round((row[sellField] || 0) / 1000);
            return acc + (buy - sell);
          }, 0);
        };

        let valA = 0, valB = 0;
        switch (currentSortMode) {
          case 'foreign_buy':
            valA = getSumForStock(idA, 'f_buy', 'f_sell'); valB = getSumForStock(idB, 'f_buy', 'f_sell');
            return valB - valA; 
          case 'foreign_dealer_buy':
            valA = getSumForStock(idA, 'fd_buy', 'fd_sell'); valB = getSumForStock(idB, 'fd_buy', 'fd_sell');
            return valB - valA;
          case 'investment_buy':
            valA = getSumForStock(idA, 'it_buy', 'it_sell'); valB = getSumForStock(idB, 'it_buy', 'it_sell');
            return valB - valA;
          case 'dealer_self_buy':
            valA = getSumForStock(idA, 'ds_buy', 'ds_sell'); valB = getSumForStock(idB, 'ds_buy', 'ds_sell');
            return valB - valA;
          case 'dealer_hedging_buy':
            valA = getSumForStock(idA, 'dh_buy', 'dh_sell'); valB = getSumForStock(idB, 'dh_buy', 'dh_sell');
            return valB - valA;
          case 'foreign_sell':
            valA = getSumForStock(idA, 'f_buy', 'f_sell'); valB = getSumForStock(idB, 'f_buy', 'f_sell');
            return valA - valB; 
          case 'foreign_dealer_sell':
            valA = getSumForStock(idA, 'fd_buy', 'fd_sell'); valB = getSumForStock(idB, 'fd_buy', 'fd_sell');
            return valA - valB;
          case 'investment_sell':
            valA = getSumForStock(idA, 'it_buy', 'it_sell'); valB = getSumForStock(idB, 'it_buy', 'it_sell');
            return valA - valB;
          case 'dealer_self_sell':
            valA = getSumForStock(idA, 'ds_buy', 'ds_sell'); valB = getSumForStock(idB, 'ds_buy', 'ds_sell');
            return valA - valB;
          case 'dealer_hedging_sell':
            valA = getSumForStock(idA, 'dh_buy', 'dh_sell'); valB = getSumForStock(idB, 'dh_buy', 'dh_sell');
            return valA - valB;
          default:
            return 0;
        }
      });

      renderMatrixTableFromCache(filteredStocks);
      const tableWrapper = document.getElementById("mainTableWrapper");
      if (tableWrapper) tableWrapper.scrollTop = 0;
    }

    function renderMatrixTableFromCache(stocks) {
      document.getElementById("recordCount").innerText = stocks.length;
      const tbody = document.getElementById("stockTableBody");
      if (!tbody) return;
      
      if (stocks.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${3 + recentDates.length * 3}" class="py-8 text-slate-400 font-medium text-center">無符合條件的股票資料</td></tr>`;
        return;
      }

      let htmlString = "";
      const sumDates = getActiveSumDates();

      stocks.forEach(item => {
        if (!item) return;
        const currentIdStr = String(item.stock_id).trim();
        const myChips = globalChipCache.filter(c => String(c.stock_id).trim() === currentIdStr);

        let currentPrice = "--";
        let changeValue = 0; 
        let mainMA10 = "--";
        let mainMA20 = "--";
        let mainRSI14 = "--";
        
        if (recentDates.length > 0) {
          const latestDayData = myChips.find(c => String(c.date) === recentDates[0]);
          if (latestDayData) {
            if (latestDayData.price !== undefined && latestDayData.price !== null) currentPrice = latestDayData.price;
            changeValue = latestDayData.change_value || 0;
            if (latestDayData.ma10 !== undefined && latestDayData.ma10 !== null) mainMA10 = latestDayData.ma10;
            if (latestDayData.ma20 !== undefined && latestDayData.ma20 !== null) mainMA20 = latestDayData.ma20;
            if (latestDayData.rsi14 !== undefined && latestDayData.rsi14 !== null) mainRSI14 = latestDayData.rsi14;
          }
        }

        let priceChangeHtml = `<span class="text-slate-500 font-medium">0.0</span>`;
        if (changeValue > 0) {
          priceChangeHtml = `<span class="text-rose-600 font-bold">▲${changeValue}</span>`;
        } else if (changeValue < 0) {
          priceChangeHtml = `<span class="text-emerald-600 font-bold">▼${Math.abs(changeValue)}</span>`;
        }

        let sumF = 0, sumFD = 0, sumIT = 0, sumDS = 0, sumDH = 0;
        let fRow = "", fdRow = "", iRow = "", dsRow = "", dhRow = "";

        const getCell = (b, s) => {
          const buy = Math.round((b || 0) / 1000);
          const sell = Math.round((s || 0) / 1000);
          const net = buy - sell;
          
          let netHtml = `<td class="py-2.5 border-r border-slate-300 text-slate-400 font-medium text-sm">0</td>`;
          if (net > 0) netHtml = `<td class="py-2.5 border-r border-slate-300 font-black text-rose-600 text-sm">+${net}</td>`;
          if (net < 0) netHtml = `<td class="py-2.5 border-r border-slate-300 font-black text-emerald-600 text-sm">${net}</td>`;
          
          return `<td class="py-2.5 border-r border-slate-200 text-blue-600 font-bold text-xs">${buy}</td><td class="py-2.5 border-r border-slate-200 text-emerald-600 font-bold text-xs">${sell}</td>${netHtml}`;
        };

        recentDates.forEach(d => {
          const dayData = myChips.find(c => String(c.date) === d) || { f_buy:0, f_sell:0, fd_buy:0, fd_sell:0, it_buy:0, it_sell:0, ds_buy:0, ds_sell:0, dh_buy:0, dh_sell:0 };
          
          if (sumDates.includes(d)) {
            sumF += (Math.round((dayData.f_buy||0)/1000) - Math.round((dayData.f_sell||0)/1000));
            sumFD += (Math.round((dayData.fd_buy||0)/1000) - Math.round((dayData.fd_sell||0)/1000));
            sumIT += (Math.round((dayData.it_buy||0)/1000) - Math.round((dayData.it_sell||0)/1000));
            sumDS += (Math.round((dayData.ds_buy||0)/1000) - Math.round((dayData.ds_sell||0)/1000));
            sumDH += (Math.round((dayData.dh_buy||0)/1000) - Math.round((dayData.dh_sell||0)/1000));
          }

          fRow += getCell(dayData.f_buy, dayData.f_sell);
          fdRow += getCell(dayData.fd_buy, dayData.fd_sell);
          iRow += getCell(dayData.it_buy, dayData.it_sell);
          dsRow += getCell(dayData.ds_buy, dayData.ds_sell);
          dhRow += getCell(dayData.dh_buy, dayData.dh_sell);
        });

        const getSumCell = (val, isDarkRow) => {
          const bgClass = isDarkRow ? 'bg-slate-100' : 'bg-white';
          if (val > 0) return `<td class="py-2.5 border-r border-slate-300 font-black text-rose-600 text-sm sticky left-[164px] z-20 ${bgClass} sticky-col-shadow text-center">+${val}</td>`;
          if (val < 0) return `<td class="py-2.5 border-r border-slate-300 font-black text-emerald-600 text-sm sticky left-[164px] z-20 ${bgClass} sticky-col-shadow text-center">${val}</td>`;
          return `<td class="py-2.5 border-r border-slate-300 font-bold text-slate-400 text-sm sticky left-[164px] z-20 ${bgClass} sticky-col-shadow text-center">0</td>`;
        };

        htmlString += `
          <tr class="border-t-2 border-slate-300 hover:bg-slate-50/50">
            <td rowspan="5" onclick="openCombinedModal('${item.stock_id}', '${item.stock_name || ''}')" class="px-1 py-3 border-r border-slate-300 font-mono bg-slate-100 sticky left-0 z-20 text-center leading-tight w-[112px] max-w-[112px] overflow-hidden cursor-pointer hover:bg-blue-50 transition-colors">
              <div class="text-base font-black tracking-tighter text-blue-700 hover:text-blue-900 underline decoration-2 underline-offset-2 decoration-blue-700">${item.stock_id}</div>
              <div class="text-sm font-extrabold mt-0.5 truncate tracking-tighter text-blue-700 hover:text-blue-900 underline decoration-2 underline-offset-2 decoration-blue-700">${item.stock_name || ''}</div>
              <div class="mt-1 tracking-tighter flex flex-col items-center gap-0.5 whitespace-nowrap">
                <div class="text-sm text-slate-900 font-bold">${currentPrice}</div>
                <div class="text-xs mt-0.5">${priceChangeHtml}</div>
              </div>
              <div class="mt-2 mx-0.5 p-1 bg-slate-200/80 rounded border border-slate-300/60 flex flex-col gap-0.5 text-[14px] font-black text-left tracking-tighter leading-none">
                <div class="flex items-center"><span class="text-blue-600 shrink-0 font-bold">M10:</span><span class="text-slate-950 ml-1 grow text-right">${mainMA10}</span></div>
                <div class="flex items-center"><span class="text-orange-600 shrink-0 font-bold">M20:</span><span class="text-slate-950 ml-1 grow text-right">${mainMA20}</span></div>
                <div class="flex items-center"><span class="text-purple-600 shrink-0 font-bold">RSI:</span><span class="text-slate-950 ml-1 grow text-right">${mainRSI14}</span></div>
              </div>
            </td>
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[112px] z-20 text-center w-[52px]">外資</td>
            ${getSumCell(sumF, false)}${fRow}
          </tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-100 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[112px] z-20 text-center w-[52px]">外陸資自營商</td>
            ${getSumCell(sumFD, true)}${fdRow}
          </tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[112px] z-20 text-center w-[52px]">投信</td>
            ${getSumCell(sumIT, false)}${iRow}
          </tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-100 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[112px] z-20 text-center w-[52px]">自營商(自行)</td>
            ${getSumCell(sumDS, true)}${dsRow}
          </tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-100 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[112px] z-20 text-center w-[52px]">自營商(避險)</td>
            ${getSumCell(sumDH, false)}${dhRow}
          </tr>
        `;
      });

      tbody.innerHTML = htmlString;
    }

    function switchModalTab(tabMode) {
      const btnTrend = document.getElementById("tabBtnTrend");
      const btnNews = document.getElementById("tabBtnNews");
      const zoneTrend = document.getElementById("trendZone");
      const zoneNews = document.getElementById("newsZone");

      if (tabMode === 'trend') {
        btnTrend.className = "py-1.5 px-4 text-sm font-black border-b-2 border-blue-600 text-blue-600 focus:outline-none cursor-pointer transition-all";
        btnNews.className = "py-1.5 px-4 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 focus:outline-none cursor-pointer transition-all";
        zoneTrend.classList.replace("hidden", "block");
        zoneNews.classList.replace("block", "hidden");
        scrollToLatestTrend();
      } else {
        btnNews.className = "py-1.5 px-4 text-sm font-black border-b-2 border-blue-600 text-blue-600 focus:outline-none cursor-pointer transition-all";
        btnTrend.className = "py-1.5 px-4 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 focus:outline-none cursor-pointer transition-all";
        zoneTrend.classList.replace("block", "hidden");
        zoneNews.classList.replace("hidden", "block");
      }
    }

    function switchChipSubTab(subKey) {
      currentChipSubTab = subKey;
      const tabs = { f: 'subTabF', it: 'subTabIT', ds: 'subTabDS' };
      
      Object.keys(tabs).forEach(k => {
        const btn = document.getElementById(tabs[k]);

          btn.className = "px-3 py-1 text-xs font-black bg-white text-slate-900 rounded-md shadow-2xs cursor-pointer transition-all";
        } else {
          btn.className = "px-3 py-1 text-xs font-bold text-slate-500 hover:text-slate-800 rounded-md cursor-pointer transition-all";
        }
      });

    function scrollToLatestTrend() {
      setTimeout(() => {
        const pWrapper = document.getElementById("priceScrollWrapper");
        const cWrapper = document.getElementById("chipScrollWrapper");
        if (pWrapper) pWrapper.scrollLeft = 0;
        if (cWrapper) cWrapper.scrollLeft = 0;
      }, 60);
    }

async function openCombinedModal(stockId, stockName) {
      currentActiveStockId = stockId; 
      document.getElementById("newsModalTitle").innerText = `${stockId} ${stockName} - 智慧指標與籌碼數據庫`;
      
      document.getElementById("newsModal").classList.remove("hidden");
      switchModalTab('trend'); 
      switchChipSubTab('f'); 

      const myChipsRaw = globalChipCache.filter(c => String(c.stock_id).trim() === String(stockId).trim());
      
      const localTrendDates = [...extendedTrendDates]
        .filter(d => myChipsRaw.some(c => String(c.date) === d))
        .sort((a, b) => b.localeCompare(a)); 

      if (recentDates.length > 0) {
        const latestDayData = myChipsRaw.find(c => String(c.date) === recentDates[0]);
        if (latestDayData) {
          document.getElementById("modalInfoPrice").innerText = latestDayData.price || '--';
          const cv = latestDayData.change_value || 0;
          if (cv > 0) {
            document.getElementById("modalInfoChange").innerHTML = `<span class="text-rose-600">▲${cv}</span>`;
          } else if (cv < 0) {
            document.getElementById("modalInfoChange").innerHTML = `<span class="text-emerald-600">▼${Math.abs(cv)}</span>`;
          } else {
            document.getElementById("modalInfoChange").innerText = '0.0';
          }
          document.getElementById("modalInfoMA10").innerText = (latestDayData.ma10 !== undefined && latestDayData.ma10 !== null) ? latestDayData.ma10 : '--';
          document.getElementById("modalInfoMA20").innerText = (latestDayData.ma20 !== undefined && latestDayData.ma20 !== null) ? latestDayData.ma20 : '--';
          document.getElementById("modalInfoRSI14").innerText = (latestDayData.rsi14 !== undefined && latestDayData.rsi14 !== null) ? latestDayData.rsi14 : '--';
        }
      }

      const priceChartEl = document.getElementById("trendPriceChart");
      const priceDatesEl = document.getElementById("trendPriceDates");
      
      if (localTrendDates.length > 0) {
        let pricePoints = localTrendDates.map(d => {
          const day = myChipsRaw.find(c => String(c.date) === d);
          return (day && day.price) ? day.price : null;
        });

        let validPrices = pricePoints.filter(p => p !== null);
        if (validPrices.length > 0) {
          let maxP = Math.max(...validPrices);
          let minP = Math.min(...validPrices);
          let rangeP = maxP - minP === 0 ? 1 : maxP - minP;

          let priceHtml = "";
          let dateHtml = "";

          localTrendDates.forEach((d, idx) => {
            const price = pricePoints[idx];
            const displayP = price !== null ? price : '--';
            const heightPercent = price !== null ? Math.round(((price - minP) / rangeP) * 50) + 10 : 40;
            const datePart = d.split('-')[1] + '/' + d.split('-')[2];

            priceHtml += `
              <div class="flex flex-col items-center flex-1 h-full justify-end relative group min-w-0">
                <div class="absolute w-2.5 h-2.5 rounded-full bg-blue-600 z-10 shadow-xs transition-all group-hover:scale-125" style="bottom: ${heightPercent}%;"></div>
                <div class="absolute w-[1px] bg-slate-200 bottom-0 top-0 left-1/2 -translate-x-1/2 border-dashed"></div>
                <span class="text-xs font-black text-slate-900 absolute bg-white/90 px-1 rounded border border-slate-300 shadow-3xs whitespace-nowrap z-20 scale-90" style="bottom: calc(${heightPercent}% + 12px);">${displayP}</span>
              </div>
            `;
            dateHtml += `<span class="flex-1 text-center font-black text-[10px] text-slate-900 truncate px-0.5">${datePart}</span>`;
          });
          priceChartEl.innerHTML = priceHtml;
          priceDatesEl.innerHTML = dateHtml;
        } else {
          priceChartEl.innerHTML = `<div class="text-xs text-slate-400 m-auto">無近期股價趨勢資料</div>`;
          priceDatesEl.innerHTML = "";
        }

        renderChipTrendChart();
        scrollToLatestTrend();
      } else {
        priceChartEl.innerHTML = `<div class="text-xs text-slate-400 m-auto py-4">資料庫初期建置中，暫無此標的之歷史資料</div>`;
        document.getElementById("trendChipChart").innerHTML = `<div class="text-xs text-slate-400 text-center py-4">暫無歷史籌碼資料</div>`;
        priceDatesEl.innerHTML = "";
      }

      // 🔄 呼叫核心新聞加載引擎
      await fetchStockNewsEngine(stockId, stockName);
    }

    // 🌟 新增：獨立出的高韌性新聞交叉擷取與過濾引擎（含手動重試功能）
    async function fetchStockNewsEngine(stockId, stockName) {
      const listZone = document.getElementById("newsListZone");
      if (!listZone) return;

      // 1. 渲染高對比度的優雅提示字體
      listZone.innerHTML = `
        <div class="flex flex-col items-center justify-center py-12 px-4 text-center">
          <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
          <div class="text-base font-extrabold text-blue-600 tracking-wider animate-pulse flex items-center gap-1.5 justify-center">
            <span>📰 正在即時智慧過濾最新財經新聞...</span>
          </div>
          <p class="text-xs text-slate-400 font-bold mt-1">智慧交叉檢索 Yahoo 股市與 Google 數據中心</p>
        </div>
      `;

      // 建立備用代理網址陣列，防止單一代理伺服器掛點
      const proxyList = [
        (u) => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
        (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
      ];

      // 輔助函式：嘗試多重代理下載
      async function fetchWithBackupProxies(targetUrl) {
        let lastError = null;
        for (let proxyFn of proxyList) {
          try {
            const pUrl = proxyFn(targetUrl);
            const res = await fetch(pUrl, { signal: AbortSignal.timeout(6000) }); // 6秒超時防堵卡死
            if (!res.ok) {
              // 針對 codetabs 或純文字返回
              if (pUrl.includes("codetabs")) {
                const text = await res.text();
                if (text && text.trim().startsWith("<")) return text;
              }
              continue;
            }
            const jsonOrText = await res.text();
            // 如果是 allorigins 回傳的 JSON 包裝
            if (pUrl.includes("allorigins.win")) {
              const parsed = JSON.parse(jsonOrText);
              if (parsed && parsed.contents) return parsed.contents;
            }
            if (jsonOrText && jsonOrText.trim().startsWith("<")) {
              return jsonOrText;
            }
          } catch (e) {
            lastError = e;
            console.warn(`代理節點連線微調，嘗試切換備援路徑...`, e.message);
          }
        }
        throw lastError || new Error("所有跨網域代理解析節點皆忙碌中");
      }

      // 等待 DOM 渲染完畢
      await new Promise(resolve => setTimeout(resolve, 80));

      let mappedNews = [];
      let yahooSuccess = false;
      let googleSuccess = false;

      // 🔷 【第一區塊：全獨立 Yahoo 奇摩股市 RSS 獲取沙盒】
      try {
        const yahooRssUrl = `https://tw.stock.yahoo.com/rss?s=${stockId}`;
        const xmlContent = await fetchWithBackupProxies(yahooRssUrl);
        
        if (xmlContent) {
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlContent, "text/xml");
          const items = xmlDoc.getElementsByTagName("item");
          
          if (items.length > 0) {
            for (let i = 0; i < Math.min(items.length, 12); i++) {
              const item = items[i];
              const title = item.getElementsByTagName("title")[0]?.textContent || "";
              const link = item.getElementsByTagName("link")[0]?.textContent || "";
              const pubDateText = item.getElementsByTagName("pubDate")[0]?.textContent || "";
              
              const pubDate = new Date(pubDateText);
              const dateStr = isNaN(pubDate.getTime()) ? "近期" : `${pubDate.getFullYear()}-${String(pubDate.getMonth()+1).padStart(2,'0')}-${String(pubDate.getDate()).padStart(2,'0')}`;
              
              mappedNews.push({
                date: dateStr,
                timestamp: isNaN(pubDate.getTime()) ? 0 : pubDate.getTime(),
                source: "Yahoo奇摩股市",
                title: title,
                link: link
              });
            }
            if (mappedNews.length > 0) yahooSuccess = true;
          }
        }
      } catch (yahooErr) {
        console.warn("⚠️ Yahoo 新聞核心異常（已自動由 Google 新聞接管備援）：", yahooErr.message);
      }

      // 🔶 【第二區塊：全獨立 Google 財經混合同步沙盒】
      try {
        const targetQuery = `${stockId} ${stockName}`;
        const googleRssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(targetQuery)}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`;
        const xmlContentGeo = await fetchWithBackupProxies(googleRssUrl);
        
        if (xmlContentGeo) {
          const parser = new DOMParser();
          const xmlDoc = parser.parseFromString(xmlContentGeo, "text/xml");
          const items = xmlDoc.getElementsByTagName("item");
          
          if (items.length > 0) {
            for (let i = 0; i < Math.min(items.length, 12); i++) {
              const item = items[i];
              const title = item.getElementsByTagName("title")[0]?.textContent || "";
              const link = item.getElementsByTagName("link")[0]?.textContent || "";
              const pubDateText = item.getElementsByTagName("pubDate")[0]?.textContent || "";
              const source = item.getElementsByTagName("source")[0]?.textContent || "Google財經";
              
              const pubDate = new Date(pubDateText);
              const dateStr = isNaN(pubDate.getTime()) ? "近期" : `${pubDate.getFullYear()}-${String(pubDate.getMonth()+1).padStart(2,'0')}-${String(pubDate.getDate()).padStart(2,'0')}`;
              
              // 避免與 Yahoo 抓到完全重複的標題
              if (!mappedNews.some(n => n.title === title)) {
                mappedNews.push({
                  date: dateStr,
                  timestamp: isNaN(pubDate.getTime()) ? 0 : pubDate.getTime(),
                  source: source,
                  title: title,
                  link: link
                });
              }
            }
            googleSuccess = true;
          }
        }
      } catch (googleErr) {
        console.warn("⚠️ Google 新聞通道異常：", googleErr.message);
      }

      // 🚨 【判定最终渲染與再試一次按鍵處理機制】
      if (mappedNews.length === 0) {
        // 當兩個管道都徹底失敗，或是完全沒有新聞時
        if (!yahooSuccess && !googleSuccess) {
          listZone.innerHTML = `
            <div class="p-6 border border-rose-200 rounded-xl bg-rose-50 text-center m-2 flex flex-col items-center justify-center gap-3">
              <div class="text-sm text-rose-600 font-extrabold">⚠️ 新聞伺服器連線中斷（外部代理伺服器忙碌中）</div>
              <p class="text-xs text-slate-500 font-medium max-w-md">網頁即時串接 Yahoo 與 Google RSS 數據庫發生超時。您可以直接點選下方按鈕重新對此個股進行即時同步。</p>
              <button onclick="fetchStockNewsEngine('${stockId}', '${stockName}')" 
                      class="mt-1 bg-rose-600 hover:bg-rose-700 text-white font-black text-xs px-4 py-2 rounded-lg shadow-md hover:shadow-lg active:scale-95 transition-all cursor-pointer flex items-center gap-1.5">
                🔄 伺服器忙碌中，點此再試一次
              </button>
            </div>
          `;
        } else {
          listZone.innerHTML = `<div class="text-xs text-slate-400 font-medium py-8 text-center">目前網路上查無此個股之相關新聞</div>`;
        }
        return;
      }

      // 市場時間混合排序（最新到最舊）
      mappedNews.sort((a, b) => b.timestamp - a.timestamp);
      activeNewsData = mappedNews;

      let listHtml = "";
      activeNewsData.forEach((news) => {
        listHtml += `
          <a href="${news.link}" target="_blank" rel="noopener noreferrer" 
             class="block p-3 border border-slate-200 rounded-xl bg-slate-50 hover:bg-blue-50/50 cursor-pointer transition-all flex flex-col gap-1.5 text-left group/item">
            <div class="text-xs text-slate-400 font-bold flex items-center gap-2">
              <span>📅 ${news.date}</span>
              <span class="px-1.5 py-0.5 bg-slate-200 text-slate-600 rounded text-[10px] font-black">${news.source}</span>
            </div>
            <h4 class="text-sm font-extrabold text-blue-700 leading-snug group-hover/item:text-blue-900 group-hover/item:underline">${news.title}</h4>
          </a>
        `;
      });
      listZone.innerHTML = listHtml;
    }

    function renderChipTrendChart() {
      const chipChartEl = document.getElementById("trendChipChart");
      if (!chipChartEl || !currentActiveStockId) return;

      const myChipsRaw = globalChipCache.filter(c => String(c.stock_id).trim() === String(currentActiveStockId).trim());
      
      const localTrendDates = [...extendedTrendDates]
        .filter(d => myChipsRaw.some(c => String(c.date) === d))
        .sort((a, b) => b.localeCompare(a));

      const subTabConfigs = {
        f: { label: '外資 (張)', bKey: 'f_buy', sKey: 'f_sell', color: 'bg-rose-500', negColor: 'bg-emerald-500' },
        it: { label: '投信 (張)', bKey: 'it_buy', sKey: 'it_sell', color: 'bg-orange-500', negColor: 'bg-teal-500' },
        ds: { label: '自營商(自行+避險) (張)', bKey: 'ds_buy', sKey: 'ds_sell', color: 'bg-red-500', negColor: 'bg-green-500' }
      };

      const cfg = subTabConfigs[currentChipSubTab];
      
      let nets = localTrendDates.map(d => {
        const row = myChipsRaw.find(c => String(c.date) === d);
        if (!row) return 0;
        if (currentChipSubTab === "ds") {
          const buySum = (row.ds_buy || 0) + (row.dh_buy || 0);
          const sellSum = (row.ds_sell || 0) + (row.dh_sell || 0);
          return Math.round(buySum / 1000) - Math.round(sellSum / 1000);
        }
        return Math.round((row[cfg.bKey]||0)/1000) - Math.round((row[cfg.sKey]||0)/1000);
      });

      let absMax = Math.max(...nets.map(Math.abs), 1);

      let barsHtml = localTrendDates.map((d, i) => {
        const val = nets[i];
        const isPositive = val >= 0;
        const heightPct = Math.min(Math.round((Math.abs(val) / absMax) * 80), 80);
        const signStr = isPositive && val > 0 ? `+${val}` : val;
        const valColor = val > 0 ? 'text-rose-600' : (val < 0 ? 'text-emerald-600' : 'text-slate-400');
        const datePart = d.split('-')[1] + '/' + d.split('-')[2];

        return `
          <div class="flex flex-col flex-1 h-full min-w-0 relative items-center">
            <div class="w-full h-1/2 flex flex-col justify-end items-center relative">
              ${isPositive && val > 0 ? `
                <span class="text-xs font-black ${valColor} mb-1 tracking-tighter whitespace-nowrap">${signStr}</span>
                <div class="w-full max-w-[20px] min-w-[4px] ${cfg.color} rounded-t-xs shadow-2xs" style="height: ${heightPct}%;"></div>
              ` : ''}
              ${val === 0 ? `<span class="text-xs font-bold text-slate-400 mb-1">0</span>` : ''}
            </div>
            <div class="w-full h-1/2 flex flex-col justify-start items-center relative">
              ${!isPositive ? `
                <div class="w-full max-w-[20px] min-w-[4px] ${cfg.negColor} rounded-b-xs shadow-2xs" style="height: ${heightPct}%;"></div>
                <span class="text-xs font-black ${valColor} mt-1 tracking-tighter whitespace-nowrap">${signStr}</span>
              ` : ''}
              <span class="absolute top-[2px] text-[10px] text-slate-950 font-black tracking-tighter pointer-events-none">${datePart}</span>
            </div>
          </div>
        `;
      }).join('');

      chipChartEl.innerHTML = `
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-1.5 w-full">
          <div class="w-full h-32 flex justify-between bg-white rounded-lg border border-slate-200 px-1 relative items-center">
            <div class="absolute left-0 right-0 h-[1.5px] bg-slate-400 z-10"></div>
            ${barsHtml}
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
