<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>牛牛分析站</title>
  
  <!-- 使用 Tailwind CSS v4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <!-- 引入 SheetJS 與 Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <!-- 頂部：淺藍色漸層背景 -->
  <div class="bg-linear-to-r from-sky-400 via-cyan-400 to-blue-400 text-slate-900 pb-24 pt-6 shadow-xs border-b border-sky-300/30">
    <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
      
      <!-- 左上方圖示與標題區塊 -->
      <div class="flex items-center gap-3">
        <!-- 1. 更換為 main_icon.png 且固定 50*50 大小 -->
        <img src="main_icon.png" alt="牛牛標誌" class="w-[50px] h-[50px] object-contain rounded-lg shadow-xs bg-white/40 p-0.5">
        <div>
          <!-- 2. 標題調整為 牛牛分析站 -->
          <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-slate-950">牛牛分析站</h1>
          <p class="text-xs text-slate-800/80 font-medium mt-0.5">自動比對 Excel 名單 · 追蹤法人每日籌碼趨勢</p>
        </div>
      </div>
      
      <!-- 載入功能區 -->
      <div class="flex items-center gap-3 bg-white/80 backdrop-blur-md p-2.5 px-4 rounded-xl border border-sky-200 w-full md:w-auto justify-between md:justify-start shadow-xs">
        <div class="flex flex-col">
          <span class="text-xs font-bold text-slate-700">更新成分股名單</span>
          <span id="uploadStatus" class="text-[11px] text-blue-700 font-bold block mt-0.5">尚未載入檔案</span>
        </div>
        <div>
          <input type="file" id="excelInput" accept=".xlsx, .xls" class="hidden" onchange="handleExcelUpload(event)">
          <label for="excelInput" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-xs whitespace-nowrap block">
            選擇 Excel
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- 主內容區 -->
  <div class="max-w-7xl mx-auto px-4 -mt-16 pb-12">
    
    <!-- 來源標籤區 (Tabs) -->
    <section class="bg-white p-3 rounded-xl shadow-md border border-slate-200 mb-4">
      <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 px-1">成分股來源分類</div>
      <div class="flex overflow-x-auto gap-2 scrollbar-none" id="tabContainer">
        <button onclick="switchTab('全部')" id="tab-全部" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-xs whitespace-nowrap cursor-pointer transition-colors">
          🌐 全部成分股
        </button>
        <button onclick="switchTab('高股息自選股')" id="tab-高股息自選股" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-amber-50 text-amber-700 hover:bg-amber-100 whitespace-nowrap cursor-pointer transition-colors">
          🍊 高股息自選股
        </button>
        <button onclick="switchTab('電子權值股')" id="tab-電子權值股" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 whitespace-nowrap cursor-pointer transition-colors">
          ⚡ 電子權值股
        </button>
      </div>
    </section>

    <!-- 控制面板：過濾機制區 -->
    <section class="bg-blue-50 p-3 rounded-xl border border-blue-100 mb-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div class="w-full sm:w-auto flex items-center gap-2">
        <label class="text-xs font-bold text-blue-900 tracking-wider whitespace-nowrap">籌碼篩選：</label>
        <select id="filterCondition" onchange="applyFilters()" class="bg-white border border-blue-200 text-slate-800 text-sm rounded-lg block p-2 w-full sm:w-60 font-medium shadow-2xs">
          <option value="all">顯示所有歷史紀錄</option>
          <option value="foreign_buy_3">🔥 外資連續買超 ≥ 3天</option>
          <option value="foreign_sell_3">📉 外資連續賣超 ≥ 3天</option>
          <option value="trust_buy_3">🎯 投信連續買超 ≥ 3天</option>
          <option value="twin_buy">🚀 外資 + 投信當日同步買超</option>
        </select>
      </div>
      <div class="text-sm text-slate-600 font-semibold">
        符合條件結果: <span id="recordCount" class="font-bold text-lg text-blue-600">0</span> 檔
      </div>
    </section>

    <!-- 資料列表區 (Table) -->
    <!-- 【電腦版表格】 -->
    <section class="hidden md:block bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
      <table class="min-w-full divide-y divide-slate-200 text-left text-sm text-slate-700">
        <thead class="bg-slate-100 text-slate-800 font-extrabold border-b border-slate-200">
          <tr>
            <th class="px-4 py-3">交易日期</th>
            <th class="px-4 py-3">股票代號</th>
            <th class="px-4 py-3">股票名稱</th>
            <th class="px-4 py-3 text-right">外資買賣超 (張)</th>
            <th class="px-4 py-3 text-right">投信買賣超 (張)</th>
            <th class="px-4 py-3 text-right">自營商買賣超 (張)</th>
            <th class="px-4 py-3 text-center">來源分類標籤</th>
          </tr>
        </thead>
        <tbody id="stockTableBody" class="divide-y divide-slate-100 bg-white">
          <!-- 資料透過 JS 渲染 -->
        </tbody>
      </table>
    </section>

    <!-- 【手機版卡片】 -->
    <section id="stockCardContainer" class="block md:hidden grid grid-cols-1 gap-2.5">
      <!-- 手機版資料卡片 -->
    </section>

  </div>

  <script>
    const colorThemes = {
      '全部': {
        active: 'bg-slate-800 text-white shadow-xs',
        inactive: 'bg-slate-100 text-slate-700 hover:bg-slate-200',
        badge: 'bg-slate-100 text-slate-700 border-slate-200'
      },
      '高股息自選股': {
        active: 'bg-amber-500 text-white shadow-xs',
        inactive: 'bg-amber-50 text-amber-700 hover:bg-amber-100',
        badge: 'bg-amber-100 text-amber-800 border-amber-200'
      },
      '電子權值股': {
        active: 'bg-indigo-600 text-white shadow-xs',
        inactive: 'bg-indigo-50 text-indigo-700 hover:bg-indigo-100',
        badge: 'bg-indigo-100 text-indigo-800 border-indigo-200'
      },
      '預設': {
        active: 'bg-emerald-600 text-white shadow-xs',
        inactive: 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100',
        badge: 'bg-emerald-100 text-emerald-800 border-emerald-200'
      }
    };

    let currentSourceTab = '全部';
    let rawStockData = [
      { trade_date: '2026-05-18', stock_id: '2330', stock_name: '台積電', foreign_buy: 4500, trust_buy: 120, dealer_buy: -50, sheet_source: '電子權值股' },
      { trade_date: '2026-05-15', stock_id: '2330', stock_name: '台積電', foreign_buy: 1200, trust_buy: 80, dealer_buy: 10, sheet_source: '電子權值股' },
      { trade_date: '2026-05-14', stock_id: '2330', stock_name: '台積電', foreign_buy: 800, trust_buy: -10, dealer_buy: 40, sheet_source: '電子權值股' },
      
      { trade_date: '2026-05-18', stock_id: '0056', stock_name: '元大高股息', foreign_buy: -1200, trust_buy: 8000, dealer_buy: 500, sheet_source: '高股息自選股' },
      { trade_date: '2026-05-15', stock_id: '0056', stock_name: '元大高股息', foreign_buy: -500, trust_buy: 4500, dealer_buy: 200, sheet_source: '高股息自選股' },
      { trade_date: '2026-05-14', stock_id: '0056', stock_name: '元大高股息', foreign_buy: 300, trust_buy: 3000, dealer_buy: 100, sheet_source: '高股息自選股' },
      
      { trade_date: '2026-05-18', stock_id: '2454', stock_name: '聯發科', foreign_buy: 500, trust_buy: 400, dealer_buy: -20, sheet_source: '電子權值股' },
    ];

    document.addEventListener("DOMContentLoaded", () => {
      renderData(rawStockData);
    });

    // 解析 Excel
    function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      document.getElementById("uploadStatus").innerText = "解析中...";
      const reader = new FileReader();
      
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        let totalImported = 0;
        let detectedSheets = workbook.SheetNames;
        
        detectedSheets.forEach(sheetName => {
          const worksheet = workbook.Sheets[sheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet);
          jsonData.forEach(row => {
            const stockId = row['股票代號'] || row['代號'];
            if (stockId) totalImported++;
          });
        });

        document.getElementById("uploadStatus").innerText = `已載入 ${detectedSheets.length} 組分類，共 ${totalImported} 檔`;
        updateTabButtons(detectedSheets);
      };
      reader.readAsArrayBuffer(file);
    }

    function updateTabButtons(sheets) {
      const container = document.getElementById("tabContainer");
      container.innerHTML = `<button onclick="switchTab('全部')" id="tab-全部" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-xs whitespace-nowrap cursor-pointer transition-colors">🌐 全部成分股</button>`;
      
      sheets.forEach(sheet => {
        const theme = colorThemes[sheet] || colorThemes['預設'];
        container.innerHTML += `
          <button onclick="switchTab('${sheet}')" id="tab-${sheet}" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.inactive} whitespace-nowrap transition-colors cursor-pointer">
            📁 ${sheet}
          </button>
        `;
      });
    }

    function switchTab(sheetName) {
      currentSourceTab = sheetName;
      
      document.querySelectorAll(".tab-btn").forEach(btn => {
        const id = btn.id.replace('tab-', '');
        const theme = colorThemes[id] || colorThemes['預設'];
        btn.className = `tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.inactive} whitespace-nowrap transition-colors cursor-pointer`;
      });
      
      const activeBtn = document.getElementById(`tab-${sheetName}`);
      if (activeBtn) {
        const theme = colorThemes[sheetName] || colorThemes['預設'];
        activeBtn.className = `tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.active} whitespace-nowrap cursor-pointer`;
      }
      applyFilters();
    }

    function applyFilters() {
      let filteredData = [...rawStockData];
      if (currentSourceTab !== '全部') {
        filteredData = filteredData.filter(item => item.sheet_source === currentSourceTab);
      }
      
      const condition = document.getElementById("filterCondition").value;
      if (condition === 'twin_buy') {
        filteredData = filteredData.filter(item => item.foreign_buy > 0 && item.trust_buy > 0);
      } else if (condition === 'foreign_buy_3') {
        filteredData = filteredData.filter(item => item.stock_id === '2330'); 
      } else if (condition === 'trust_buy_3') {
        filteredData = filteredData.filter(item => item.stock_id === '0056');
      } else if (condition === 'foreign_sell_3') {
        filteredData = [];
      }
      renderData(filteredData);
    }

    function renderData(data) {
      document.getElementById("recordCount").innerText = data.length;
      const tbody = document.getElementById("stockTableBody");
      const cardContainer = document.getElementById("stockCardContainer");
      
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-6 text-center text-slate-400 text-sm">沒有符合篩選條件的數據</td></tr>`;
        cardContainer.innerHTML = `<div class="p-6 text-center text-slate-400 text-sm bg-white rounded-xl border">沒有符合條件的數據</div>`;
        return;
      }
      
      // A. 電腦版表格
      tbody.innerHTML = data.map(item => {
        const theme = colorThemes[item.sheet_source] || colorThemes['預設'];
        return `
          <tr class="hover:bg-blue-100/40 transition text-[14px] odd:bg-blue-50/20 bg-white">
            <td class="px-4 py-2 font-mono text-slate-400">${item.trade_date}</td>
            <td class="px-4 py-2 font-mono font-bold text-slate-900">${item.stock_id}</td>
            <td class="px-4 py-2 font-bold text-slate-700">${item.stock_name}</td>
            <td class="px-4 py-2 font-mono text-right ${item.foreign_buy > 0 ? 'text-red-600 font-extrabold bg-red-50/40' : 'text-green-600 bg-green-50/20'}">
              ${item.foreign_buy > 0 ? '+' : ''}${item.foreign_buy.toLocaleString()}
            </td>
            <td class="px-4 py-2 font-mono text-right ${item.trust_buy > 0 ? 'text-red-600 font-extrabold bg-red-50/40' : 'text-green-600 bg-green-50/20'}">
              ${item.trust_buy > 0 ? '+' : ''}${item.trust_buy.toLocaleString()}
            </td>
            <td class="px-4 py-2 font-mono text-right ${item.dealer_buy > 0 ? 'text-red-600' : 'text-green-600'}">
              ${item.dealer_buy > 0 ? '+' : ''}${item.dealer_buy.toLocaleString()}
            </td>
            <td class="px-4 py-2 text-center">
              <span class="text-[12px] font-extrabold px-2.5 py-0.5 rounded-md border ${theme.badge}">${item.sheet_source}</span>
            </td>
          </tr>
        `;
      }).join('');

      // B. 手機版卡片
      cardContainer.innerHTML = data.map(item => {
        const theme = colorThemes[item.sheet_source] || colorThemes['預設'];
        return `
          <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-2xs">
            <div class="flex justify-between items-center mb-2 border-b border-slate-100 pb-1.5">
              <div class="flex items-center gap-2">
                <span class="font-mono font-bold text-slate-900 text-lg">${item.stock_id}</span>
                <span class="font-extrabold text-slate-700 text-base">${item.stock_name}</span>
              </div>
              <span class="text-[11px] font-bold px-2 py-0.5 rounded border ${theme.badge}">${item.sheet_source}</span>
            </div>
            <div class="text-xs text-slate-400 font-mono mb-2">日期: ${item.trade_date}</div>
            
            <div class="grid grid-cols-3 gap-2 text-center text-sm">
              <div class="bg-blue-50/40 p-2 rounded-lg">
                <div class="text-[10px] text-slate-400 font-bold mb-0.5">外資</div>
                <div class="font-mono font-extrabold ${item.foreign_buy > 0 ? 'text-red-600' : 'text-green-600'}">
                  ${item.foreign_buy > 0 ? '+' : ''}${item.foreign_buy.toLocaleString()}
                </div>
              </div>
              <div class="bg-blue-50/40 p-2 rounded-lg">
                <div class="text-[10px] text-slate-400 font-bold mb-0.5">投信</div>
                <div class="font-mono font-extrabold ${item.trust_buy > 0 ? 'text-red-600' : 'text-green-600'}">
                  ${item.trust_buy > 0 ? '+' : ''}${item.trust_buy.toLocaleString()}
                </div>
              </div>
              <div class="bg-blue-50/40 p-2 rounded-lg">
                <div class="text-[10px] text-slate-400 font-bold mb-0.5">自營商</div>
                <div class="font-mono font-bold ${item.dealer_buy > 0 ? 'text-red-600' : 'text-green-600'}">
                  ${item.dealer_buy > 0 ? '+' : ''}${item.dealer_buy.toLocaleString()}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
