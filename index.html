  <script>
    const SUPABASE_URL = "https://fekesirsqjbkrgaibrjf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZla2VzaXJzcWpia3JnYWlicmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTY0MjUsImV4cCI6MjA5NDU5MjQyNX0.82wBFq-B8cxfK9h_gkJQgIpMEabke1EhB6Oacw2lonc";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentSourceTab = '全部';
    let dbStockData = [];          
    let globalChipCache = [];      
    let targetSheetsSet = new Set();
    let recentDates = [];           
    let extendedTrendDates = [];    
    
    let currentSortMode = 'investment_buy'; 
    let currentSumDaysMode = 5; 
    let searchKeyword = ""; 
    let activeNewsData = []; 
    let currentActiveStockId = ""; 
    let currentChipSubTab = "f";   

    function getValIgnoreCase(obj, targetKey) {
      if (!obj) return null;
      const actualKey = Object.keys(obj).find(k => k.toLowerCase() === targetKey.toLowerCase());
      return actualKey ? obj[actualKey] : null;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      calculateTradeDaysLists(); 
      renderTableHeader(); 
      await forceSyncFlow(); 
    });

    function calculateTradeDaysLists() {
      let dates20 = [];
      let d = new Date();
      while(dates20.length < 20) {
        let day = d.getDay();
        if (day !== 0 && day !== 6) { 
          dates20.push(formatDateToString(d));
        }
        d.setDate(d.getDate() - 1);
      }
      extendedTrendDates = dates20; 
      recentDates = dates20.slice(0, 5); 
      updateDisplayDates(recentDates[0]);
    }

    function updateDisplayDates(startDateStr) {
      const el = document.getElementById("chipUpdateTime");
      const elMob = document.getElementById("chipUpdateTimeMob");
      if (el) el.innerText = startDateStr || "--";
      if (elMob) elMob.innerText = startDateStr || "--";
    }

    async function forceSyncFlow() {
      const modal = document.getElementById("loadingModal");
      const detailText = document.getElementById("loadingDetail");
      modal.classList.remove("hidden");

      try {
        detailText.innerText = "1. 載入雲端股票名單與成分分類...";
        const { data: dbData, error: targetError = null } = await supabaseClient
          .from('stock_targets')
          .select('*')
          .order('stock_id', { ascending: true });
          
        if (targetError) throw targetError;
        dbStockData = dbData || [];

        const todayStr = new Date().toLocaleDateString();
        if(document.getElementById("listUpdateTime")) document.getElementById("listUpdateTime").innerText = todayStr;
        if(document.getElementById("listUpdateTimeMob")) document.getElementById("listUpdateTimeMob").innerText = todayStr;

        targetSheetsSet.clear();
        dbStockData.forEach(item => { 
          if (Array.isArray(item.sheet_tags)) {
            item.sheet_tags.forEach(tag => targetSheetsSet.add(tag)); 
          }
        });
        
        updateTabSelectOptions(Array.from(targetSheetsSet));
        calculateTradeDaysLists();

        detailText.innerText = "2. 正在讀取雲端籌碼與股價數據...";
        await fetchAllChipsFromSupabase();

        detailText.innerText = "3. 正在建立網頁表格視覺矩陣...";
        renderTableHeader();
        applyFilters();

      } catch (err) {
        console.error("讀取雲端快取資料流程發生異常:", err);
      } finally {
        modal.classList.add("hidden");
      }
    }

    async function fetchAllChipsFromSupabase() {
      if (extendedTrendDates.length === 0 || dbStockData.length === 0) return;
      const detailText = document.getElementById("loadingDetail");
      
      let allChipsFetched = [];
      const stockIds = dbStockData.map(s => String(s.stock_id).trim());
      
      const chunkSize = 50; 
      for (let i = 0; i < stockIds.length; i += chunkSize) {
        const chunkIds = stockIds.slice(i, i + chunkSize);
        detailText.innerText = `2. 同步核心籌碼數據中 (${Math.min(i + chunkSize, stockIds.length)} / ${stockIds.length} 檔)...`;

        let retries = 3;
        let success = false;

        while (retries > 0 && !success) {
          const { data, error } = await supabaseClient
            .from('stock_chips_daily')
            .select('*, macd_dif, macd_signal, macd_osc') 
            .in('stock_id', chunkIds)
            .in('date', extendedTrendDates); 

          if (error) {
            console.warn(`批次 ${i} 讀取失敗，剩餘重試次數: ${retries - 1}`, error);
            retries--;
            if (retries === 0) {
              console.error(`❌ 批次 ${i} 徹底失敗。`);
            } else {
              await new Promise(resolve => setTimeout(resolve, 500));
            }
          } else {
            if (data) {
              allChipsFetched = allChipsFetched.concat(data);
            }
            success = true;
          }
        }
      }

      globalChipCache = allChipsFetched;

      if (globalChipCache.length > 0) {
        const dbDates = Array.from(new Set(globalChipCache.map(c => String(c.date))))
                             .sort((a, b) => b.localeCompare(a)); 
        
        if (dbDates.length > 0) {
          extendedTrendDates = dbDates.slice(0, 20); 
          recentDates = dbDates.slice(0, 5); 
          updateDisplayDates(recentDates[0]);
        }
      }
    }

    function formatDateToString(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function changeSumDaysMode(val) {
      currentSumDaysMode = parseInt(val, 10);
      applyFilters();
    }

    function renderTableHeader() {
      const headerDates = document.getElementById("tableHeaderDates");
      const headerSub = document.getElementById("tableHeaderSub");
      if (!headerDates || !headerSub) return;

      let datesHtml = `
        <th rowspan="2" class="px-1 py-2 bg-slate-200 sticky left-0 z-40 w-[112px] min-w-[112px] max-w-[112px] align-middle text-center border-r border-slate-300">
          <div class="flex flex-col items-center gap-1">
            <span class="font-extrabold text-[11px] text-slate-900 whitespace-nowrap tracking-tighter">標的</span>
            <select onchange="changeSortMode(this.value)" class="text-[11px] border border-slate-400 rounded px-0.5 py-0.5 bg-white font-bold cursor-pointer focus:outline-none w-full text-slate-800 tracking-tighter">
              <option value="stock_id" ${currentSortMode==='stock_id'?'selected':''}>🔢 代號排序</option>
              <option value="foreign_buy" ${currentSortMode==='foreign_buy'?'selected':''}>🔺 外資買超</option>
              <option value="foreign_dealer_buy" ${currentSortMode==='foreign_dealer_buy'?'selected':''}>🔺 外陸資自營商買</option>
              <option value="investment_buy" ${currentSortMode==='investment_buy'?'selected':''}>🔺 投信買超</option>
              <option value="dealer_self_buy" ${currentSortMode==='dealer_self_buy'?'selected':''}>🔺 自營商(自行)買</option>
              <option value="dealer_hedging_buy" ${currentSortMode==='dealer_hedging_buy'?'selected':''}>🔺 自營商(避險)買</option>
              <option value="foreign_sell" ${currentSortMode==='foreign_sell'?'selected':''}>🔻 外資賣超</option>
              <option value="foreign_dealer_sell" ${currentSortMode==='foreign_dealer_sell'?'selected':''}>🔻 外陸資自營商賣</option>
              <option value="investment_sell" ${currentSortMode==='investment_sell'?'selected':''}>🔻 投信賣超</option>
              <option value="dealer_self_sell" ${currentSortMode==='dealer_self_sell'?'selected':''}>🔻 自營商(自行)賣</option>
              <option value="dealer_hedging_sell" ${currentSortMode==='dealer_hedging_sell'?'selected':''}>🔻 自營商(避險)賣</option>
            </select>
          </div>
        </th>
        <th rowspan="2" class="px-1 py-2 bg-slate-100 font-extrabold text-xs text-slate-800 sticky left-[112px] z-40 w-[52px] min-w-[52px] max-w-[52px] align-middle whitespace-nowrap border-r border-slate-300 text-center">法人</th>
        <th rowspan="2" class="px-1 py-1 bg-rose-50 sticky left-[164px] z-40 w-[74px] min-w-[74px] max-w-[74px] align-middle border-r border-slate-300 text-center sticky-col-shadow">
          <select onchange="changeSumDaysMode(this.value)" class="text-[11px] border border-slate-400 rounded px-0.5 py-0.5 bg-white font-black cursor-pointer focus:outline-none w-full text-rose-600 tracking-tighter text-center">
            <option value="5" ${currentSumDaysMode===5?'selected':''}>5日結</option>
            <option value="3" ${currentSumDaysMode===3?'selected':''}>3日結</option>
          </select>
        </th>
      `;
      let subHtml = "";

      recentDates.forEach((dateStr, index) => {
        const parts = dateStr.split('-');
        const formattedDate = parts.length === 3 ? `${parts[1]}/${parts[2]}` : dateStr;
        const borderClass = index === recentDates.length - 1 ? "" : "border-r border-slate-300";
        datesHtml += `<th colspan="3" class="px-2 py-2 ${borderClass} text-sm bg-slate-100 text-slate-900 font-bold whitespace-nowrap">${formattedDate}</th>`;
        
        const subBorderClass = index === recentDates.length - 1 ? "" : "border-r border-slate-300";
        subHtml += `
          <th class="py-1.5 border-r border-slate-200 w-[55px] min-w-[55px] text-sm font-bold text-blue-600">買</th>
          <th class="py-1.5 border-r border-slate-200 w-[55px] min-w-[55px] text-sm font-bold text-emerald-600">賣</th>

    function applyFilters() {
      let filteredStocks = [...dbStockData];
      if (currentSourceTab !== '全部') {
        filteredStocks = dbStockData.filter(item => item && Array.isArray(item.sheet_tags) && item.sheet_tags.includes(currentSourceTab));
      }
      if (searchKeyword !== "") {
        filteredStocks = filteredStocks.filter(item => {
          if (!item) return false;
          const idStr = String(item.stock_id).toLowerCase();
          const nameStr = String(item.stock_name || '').toLowerCase();
          return idStr.includes(searchKeyword) || nameStr.includes(searchKeyword);
        });
      }
      filteredStocks.sort((a, b) => {
        const idA = String(a.stock_id).trim();
        const idB = String(b.stock_id).trim();
        if (currentSortMode === 'stock_id') return idA.localeCompare(idB, undefined, { numeric: true, sensitivity: 'base' });

        const getSumForStock = (stockId, buyField, sellField) => {
          const chips = globalChipCache.filter(c => String(c.stock_id).trim() === stockId);
          const sumDates = getActiveSumDates();
          return chips.reduce((acc, row) => {
            if (!sumDates.includes(String(row.date))) return acc; 
            const buy = Math.round((row[buyField] || 0) / 1000);
            const sell = Math.round((row[sellField] || 0) / 1000);
            return acc + (buy - sell);
          }, 0);
        };

        let valA = 0, valB = 0;
        switch (currentSortMode) {
          case 'foreign_buy': valA = getSumForStock(idA, 'f_buy', 'f_sell'); valB = getSumForStock(idB, 'f_buy', 'f_sell'); return valB - valA;
          case 'foreign_dealer_buy': valA = getSumForStock(idA, 'fd_buy', 'fd_sell'); valB = getSumForStock(idB, 'fd_buy', 'fd_sell'); return valB - valA;
          case 'investment_buy': valA = getSumForStock(idA, 'it_buy', 'it_sell'); valB = getSumForStock(idB, 'it_buy', 'it_sell'); return valB - valA;
          case 'dealer_self_buy': valA = getSumForStock(idA, 'ds_buy', 'ds_sell'); valB = getSumForStock(idB, 'ds_buy', 'ds_sell'); return valB - valA;
          case 'dealer_hedging_buy': valA = getSumForStock(idA, 'dh_buy', 'dh_sell'); valB = getSumForStock(idB, 'dh_buy', 'dh_sell'); return valB - valA;
          case 'foreign_sell': valA = getSumForStock(idA, 'f_buy', 'f_sell'); valB = getSumForStock(idB, 'f_buy', 'f_sell'); return valA - valB;
          case 'foreign_dealer_sell': valA = getSumForStock(idA, 'fd_buy', 'fd_sell'); valB = getSumForStock(idB, 'fd_buy', 'fd_sell'); return valA - valB;
          case 'investment_sell': valA = getSumForStock(idA, 'it_buy', 'it_sell'); valB = getSumForStock(idB, 'it_buy', 'it_sell'); return valA - valB;
          case 'dealer_self_sell': valA = getSumForStock(idA, 'ds_buy', 'ds_sell'); valB = getSumForStock(idB, 'ds_buy', 'ds_sell'); return valA - valB;
          case 'dealer_hedging_sell': valA = getSumForStock(idA, 'dh_buy', 'dh_sell'); valB = getSumForStock(idB, 'dh_buy', 'dh_sell'); return valA - valB;
          default: return 0;
        }
      });
      renderMatrixTableFromCache(filteredStocks);
    }

    function renderMatrixTableFromCache(stocks) {

        return;
      }

      let htmlString = "";
      const sumDates = getActiveSumDates();

      stocks.forEach(item => {
        if (!item) return;
        const currentIdStr = String(item.stock_id).trim();
        const myChips = globalChipCache.filter(c => String(c.stock_id).trim() === currentIdStr);

        let currentPrice = "--", changeValue = 0, mainMA10 = "--", mainMA20 = "--", mainRSI14 = "--", mainMACDOsc = "--";
        
        if (recentDates.length > 0) {

          if (latestDayData) {

            changeValue = latestDayData.change_value || 0;
            if (latestDayData.ma10 !== undefined && latestDayData.ma10 !== null) mainMA10 = latestDayData.ma10;
            if (latestDayData.ma20 !== undefined && latestDayData.ma20 !== null) mainMA20 = latestDayData.ma20;
            if (latestDayData.rsi14 !== undefined && latestDayData.rsi14 !== null) mainRSI14 = latestDayData.rsi14;
            const rawMacd = getValIgnoreCase(latestDayData, 'macd_osc');
            if (rawMacd !== null && rawMacd !== undefined) mainMACDOsc = rawMacd;

        let priceChangeHtml = `<span class="text-slate-500 font-medium">0.0</span>`;

        else if (changeValue < 0) priceChangeHtml = `<span class="text-emerald-600 font-bold">▼${Math.abs(changeValue)}</span>`;

        let macdHtml = `<span class="text-slate-950 ml-1 grow text-right">${mainMACDOsc}</span>`;

          if (mainMACDOsc > 0) macdHtml = `<span class="text-rose-600 ml-1 grow text-right font-black">▲${mainMACDOsc}</span>`;

        }

        let sumF = 0, sumFD = 0, sumIT = 0, sumDS = 0, sumDH = 0;
        let fRow = "", fdRow = "", iRow = "", dsRow = "", dhRow = "";

        const getCell = (b, s) => {
          const buy = Math.round((b || 0) / 1000);

          const net = buy - sell;
          let netHtml = `<td class="py-2.5 border-r border-slate-300 text-slate-400 font-medium text-sm">0</td>`;
          if (net > 0) netHtml = `<td class="py-2.5 border-r border-slate-300 font-black text-rose-600 text-sm">+${net}</td>`;
          if (net < 0) netHtml = `<td class="py-2.5 border-r border-slate-300 font-black text-emerald-600 text-sm">${net}</td>`;

        };

        recentDates.forEach(d => {
          const dayData = myChips.find(c => String(c.date) === d) || { f_buy:0, f_sell:0, fd_buy:0, fd_sell:0, it_buy:0, it_sell:0, ds_buy:0, ds_sell:0, dh_buy:0, dh_sell:0 };
          if (sumDates.includes(d)) {
            sumF += (Math.round((dayData.f_buy||0)/1000) - Math.round((dayData.f_sell||0)/1000));
            sumFD += (Math.round((dayData.fd_buy||0)/1000) - Math.round((dayData.fd_sell||0)/1000));
            sumIT += (Math.round((dayData.it_buy||0)/1000) - Math.round((dayData.it_sell||0)/1000));
            sumDS += (Math.round((dayData.ds_buy||0)/1000) - Math.round((dayData.ds_sell||0)/1000));
            sumDH += (Math.round((dayData.dh_buy||0)/1000) - Math.round((dayData.dh_sell||0)/1000));
          }
          fRow += getCell(dayData.f_buy, dayData.f_sell); fdRow += getCell(dayData.fd_buy, dayData.fd_sell); iRow += getCell(dayData.it_buy, dayData.it_sell); dsRow += getCell(dayData.ds_buy, dayData.ds_sell); dhRow += getCell(dayData.dh_buy, dayData.dh_sell);
        });

        const getSumCell = (val, isDarkRow) => {
          const bgClass = isDarkRow ? 'bg-slate-100' : 'bg-white';

          if (val < 0) return `<td class="py-2.5 border-r border-slate-300 font-black text-emerald-600 text-sm sticky left-[164px] z-20 ${bgClass} sticky-col-shadow text-center">${val}</td>`;
          return `<td class="py-2.5 border-r border-slate-300 font-bold text-slate-400 text-sm sticky left-[164px] z-20 ${bgClass} sticky-col-shadow text-center">0</td>`;

        htmlString += `

            <td rowspan="5" onclick="openCombinedModal('${item.stock_id}', '${item.stock_name || ''}')" class="px-1 py-3 border-r border-slate-300 font-mono bg-slate-100 sticky left-0 z-20 text-center leading-tight w-[112px] max-w-[112px] cursor-pointer hover:bg-blue-50 transition-colors">
              <div class="text-base font-black tracking-tighter text-blue-700 underline decoration-2 underline-offset-2 decoration-blue-700">${item.stock_id}</div>
              <div class="text-sm font-extrabold mt-0.5 truncate tracking-tighter text-blue-700 underline decoration-2 underline-offset-2 decoration-blue-700">${item.stock_name || ''}</div>
              <div class="mt-1 tracking-tighter flex flex-col items-center gap-0.5">
                <div class="text-sm text-slate-900 font-bold">${currentPrice}</div>
                <div class="text-xs mt-0.5">${priceChangeHtml}</div>
              </div>
              <div class="mt-2 mx-0.5 p-1 bg-slate-200/80 rounded border border-slate-300/60 flex flex-col gap-0.5 text-[14px] font-black text-left tracking-tighter leading-none">
                <div class="flex items-center"><span class="text-blue-600 font-bold">M10:</span><span class="text-slate-950 ml-1 grow text-right">${mainMA10}</span></div>
                <div class="flex items-center"><span class="text-orange-600 font-bold">M20:</span><span class="text-slate-950 ml-1 grow text-right">${mainMA20}</span></div>
                <div class="flex items-center"><span class="text-purple-600 font-bold">RSI:</span><span class="text-slate-950 ml-1 grow text-right">${mainRSI14}</span></div>
                <div class="flex items-center"><span class="text-teal-600 font-bold">MACD:</span>${macdHtml}</div>
              </div>
            </td>
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-extrabold text-xs text-slate-700 sticky left-[112px] z-20 text-center w-[52px]">外資</td>
            ${getSumCell(sumF, false)}${fRow}
          </tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50"><td class="py-3 border-r border-slate-300 bg-slate-100 font-extrabold text-xs text-slate-700 sticky left-[112px] z-20 text-center w-[52px]">外陸資自營商</td>${getSumCell(sumFD, true)}${fdRow}</tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50"><td class="py-3 border-r border-slate-300 bg-slate-50 font-extrabold text-xs text-slate-700 sticky left-[112px] z-20 text-center w-[52px]">投信</td>${getSumCell(sumIT, false)}${iRow}</tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50"><td class="py-3 border-r border-slate-300 bg-slate-100 font-extrabold text-xs text-slate-700 sticky left-[112px] z-20 text-center w-[52px]">自營商(自行)</td>${getSumCell(sumDS, true)}${dsRow}</tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50"><td class="py-3 border-r border-slate-300 bg-slate-100 font-extrabold text-xs text-slate-700 sticky left-[112px] z-20 text-center w-[52px]">自營商(避險)</td>${getSumCell(sumDH, false)}${dhRow}</tr>
        `;
      });
      tbody.innerHTML = htmlString;
    }

    // 💡 升級版：支援三個頁籤切換

    async function openCombinedModal(stockId, stockName) {
      currentActiveStockId = stockId; 
      document.getElementById("newsModalTitle").innerText = `${stockId} ${stockName} - 智慧指標與籌碼數據庫`;
      switchModalTab('trend');
      switchChipSubTab('f');

      const debugBox = document.getElementById("debugLogZone");
      debugBox.classList.remove("hidden");
      debugBox.innerHTML = `[系統診斷開始] 初始化 ${stockId} (${stockName}) 新聞獲取流...\n`;

      const myChipsRaw = globalChipCache.filter(c => String(c.stock_id).trim() === String(stockId).trim());
      const localTrendDates = [...extendedTrendDates].filter(d => myChipsRaw.some(c => String(c.date) === d)).sort((a, b) => b.localeCompare(a)); 

      if (recentDates.length > 0) {
        const latestDayData = myChipsRaw.find(c => String(c.date) === recentDates[0]);
        if (latestDayData) {
          document.getElementById("modalInfoPrice").innerText = latestDayData.price || '--';

          document.getElementById("modalInfoMA10").innerText = latestDayData.ma10 || '--';
          document.getElementById("modalInfoMA20").innerText = latestDayData.ma20 || '--';
          document.getElementById("modalInfoRSI14").innerText = latestDayData.rsi14 || '--';
          
          const rawMacd = getValIgnoreCase(latestDayData, 'macd_osc');
          document.getElementById("modalInfoMACD").innerHTML = rawMacd !== null && rawMacd !== undefined ? (rawMacd > 0 ? `<span class="text-rose-600 font-bold">▲${rawMacd}</span>` : (rawMacd < 0 ? `<span class="text-emerald-600 font-bold">▼${Math.abs(rawMacd)}</span>` : '0.0')) : '--';
        }
      }

      // 1. 繪製收盤價趨勢圖
      const priceChartEl = document.getElementById("trendPriceChart");
      const priceDatesEl = document.getElementById("trendPriceDates");
      if (localTrendDates.length > 0) {
        let pricePoints = localTrendDates.map(d => { const day = myChipsRaw.find(c => String(c.date) === d); return (day && day.price) ? day.price : null; });
        let validPrices = pricePoints.filter(p => p !== null);
        if (validPrices.length > 0) {
          let maxP = Math.max(...validPrices), minP = Math.min(...validPrices), rangeP = maxP - minP === 0 ? 1 : maxP - minP;
          let priceHtml = "", dateHtml = "";
          localTrendDates.forEach((d, idx) => {
            const price = pricePoints[idx];
            const displayP = price !== null ? price : '--';
            const heightPercent = price !== null ? Math.round(((price - minP) / rangeP) * 50) + 10 : 40;
            priceHtml += `<div class="flex flex-col items-center flex-1 h-full justify-end relative group min-w-0"><div class="absolute w-2.5 h-2.5 rounded-full bg-blue-600 z-10 transition-all group-hover:scale-125" style="bottom: ${heightPercent}%;"></div><div class="absolute w-[1px] bg-slate-200 bottom-0 top-0 left-1/2 -translate-x-1/2 border-dashed"></div><span class="text-xs font-black text-slate-900 absolute bg-white/90 px-1 rounded border border-slate-300 shadow-3xs whitespace-nowrap z-20 scale-90" style="bottom: calc(${heightPercent}% + 12px);">${displayP}</span></div>`;
            dateHtml += `<span class="flex-1 text-center font-black text-[10px] text-slate-950 truncate px-0.5">${d.split('-')[1] + '/' + d.split('-')[2]}</span>`;
          });
          priceChartEl.innerHTML = priceHtml; priceDatesEl.innerHTML = dateHtml;
        }
        renderChipTrendChart();
        
        // 💡 2. 核心功能：全新精心設計的 MACD 組合視覺圖表渲染
        renderCombinedMacdChart(localTrendDates, myChipsRaw);
        scrollToLatestTrend();
      }

      // 新聞即時連線邏輯維持原樣
      const listZone = document.getElementById("newsListZone");
      listZone.innerHTML = `<div class="text-xs text-slate-400 font-medium py-6 text-center animate-pulse">正在即時連線抓取最新財經新聞...</div>`;
      const rssUrl = `https://news.google.com/rss/search?q=${encodeURIComponent(`"${stockId}" OR "${stockName}"`)}&hl=zh-TW&gl=TW&ceid=TW:zh-Hant`;
      const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&count=10`;
      let maxRetries = 3, currentRetry = 0, successFetch = false, resJson = null;

      while (currentRetry < maxRetries && !successFetch) {
        currentRetry++;
        if (currentRetry > 1) {
          debugBox.innerHTML += `⏳ 伺服器忙碌，正進行第 ${currentRetry} 次重試...\n`;
          await new Promise(resolve => setTimeout(resolve, 3000));
        }
        try {
          const res = await fetch(apiUrl);
          if (res.ok) { const json = await res.json(); if (json.status === 'ok') { resJson = json; successFetch = true; break; } }
        } catch (fetchErr) { debugBox.innerHTML += `⚠️ 請求失敗: ${fetchErr.message}\n`; }
      }

      if (successFetch && resJson) {
        const fetchedItems = resJson.items || [];
        if (fetchedItems.length > 0) {
          let listHtml = "";
          fetchedItems.slice(0, 10).forEach(item => {
            const pubDate = new Date(item.pubDate);
            const dStr = `${pubDate.getFullYear()}-${String(pubDate.getMonth()+1).padStart(2,'0')}-${String(pubDate.getDate()).padStart(2,'0')}`;
            listHtml += `<a href="${item.link}" target="_blank" rel="noopener noreferrer" class="block p-3 border border-slate-200 rounded-xl bg-slate-50 hover:bg-blue-50/50 flex flex-col gap-1.5 text-left group/item"><div class="text-xs text-slate-400 font-bold flex items-center gap-2"><span>📅 ${dStr}</span><span class="px-1.5 py-0.5 bg-slate-200 text-slate-600 rounded text-[10px] font-black">${item.author || "財經媒體"}</span></div><h4 class="text-sm font-extrabold text-blue-700 leading-snug group-hover/item:text-blue-900 group-hover/item:underline">${item.title}</h4></a>`;
          });
          listZone.innerHTML = listHtml; debugBox.classList.add("hidden");
        } else { listZone.innerHTML = `<div class="text-xs text-slate-400 font-medium py-8 text-center">查無相關新聞</div>`; }
      } else { listZone.innerHTML = `<div class="text-xs text-rose-500 font-medium py-8 text-center">新聞載入失敗。</div>`; }
    }

    // 💡 核心繪圖引擎：純 CSS 視覺完美表現 MACD 組合圖 (DIF線 + DEA線 + 動能柱)
    function renderCombinedMacdChart(dates, chips) {
      const chartEl = document.getElementById("combinedMacdChart");
      const datesEl = document.getElementById("combinedMacdDates");
      
      // 提取 20 天內所有的指標數值
      let dataset = dates.map(d => {
        const row = chips.find(c => String(c.date) === d);
        return {
          date: d,
          dif: row ? getValIgnoreCase(row, 'macd_dif') : null,
          sig: row ? getValIgnoreCase(row, 'macd_signal') : null,
          osc: row ? getValIgnoreCase(row, 'macd_osc') : null
        };
      });

      // 找出全局最大絕對值，用來等比例規劃正負零軸上下空間
      let allValues = dataset.flatMap(d => [d.dif, d.sig, d.osc]).filter(v => v !== null && !isNaN(v));
      let maxAbs = Math.max(...allValues.map(Math.abs), 0.1);

      let chartHtml = `<div class="absolute left-0 right-0 h-[1.5px] bg-slate-400 z-10" style="top: 50%;"></div>`;
      let dateHtml = "";

      dataset.forEach((d, idx) => {
        const datePart = d.date.split('-')[1] + '/' + d.date.split('-')[2];
        dateHtml += `<span class="flex-1 text-center font-black text-[10px] text-slate-950 truncate px-0.5">${datePart}</span>`;

        // 1. 動能柱 (OSC) 的高度與上下對齊
        let oscHeightPct = 0, oscBg = "bg-transparent", oscTop = "50%", oscHeightStyle = "0%";
        if (d.osc !== null) {
          oscHeightPct = Math.min((Math.abs(d.osc) / maxAbs) * 50, 50);
          if (d.osc > 0) {
            oscBg = "bg-rose-500/80";
            oscTop = `calc(50% - ${oscHeightPct}%)`;
            oscHeightStyle = `${oscHeightPct}%`;
          } else if (d.osc < 0) {
            oscBg = "bg-emerald-500/80";
            oscTop = "50%";
            oscHeightStyle = `${oscHeightPct}%`;
          }
        }

        // 2. 快慢線 (DIF / DEA) 指標折線點的垂直百分比定位 (自頂部向下算)
        let difPosPct = d.dif !== null ? 50 - (d.dif / maxAbs) * 50 : 50;
        let sigPosPct = d.sig !== null ? 50 - (d.sig / maxAbs) * 50 : 50;

        chartHtml += `
          <div class="flex flex-col items-center flex-1 h-full relative group min-w-0">
            <div class="absolute w-[1px] bg-slate-100 top-0 bottom-0 left-1/2 -translate-x-1/2 border-dashed"></div>
            
            <div class="absolute w-3 max-w-[12px] min-w-[4px] ${oscBg} transition-all group-hover:brightness-90 z-20" style="top: ${oscTop}; height: ${oscHeightStyle};"></div>
            
            <div class="absolute w-2 h-2 rounded-full bg-sky-500 z-30 ring-1 ring-white" style="top: calc(${difPosPct}% - 4px); left: calc(50% - 4px);"></div>
            
            <div class="absolute w-2 h-2 rounded-full bg-amber-500 z-30 ring-1 ring-white" style="top: calc(${sigPosPct}% - 4px); left: calc(50% - 4px);"></div>

            <div class="hidden group-hover:flex flex-col absolute bg-slate-900/95 text-white text-[10px] p-1.5 rounded shadow-lg z-40 border border-slate-700 pointer-events-none -top-12 whitespace-nowrap font-medium leading-tight">
              <div>📅 ${d.date}</div>
              <div class="text-sky-400">DIF: ${d.dif !== null ? d.dif.toFixed(3) : '--'}</div>
              <div class="text-amber-400">DEA: ${d.sig !== null ? d.sig.toFixed(3) : '--'}</div>
              <div class="${d.osc >= 0 ? 'text-rose-400' : 'text-emerald-400'}">OSC: ${d.osc !== null ? d.osc.toFixed(3) : '--'}</div>
            </div>
          </div>
        `;
      });

      chartEl.innerHTML = chartHtml;
      datesEl.innerHTML = dateHtml;
    }

    function closeNewsModal() { document.getElementById("newsModal").classList.add("hidden"); }
    function switchTab(sheetName) { currentSourceTab = sheetName; applyFilters(); }
    function handleSearchKeyup(e) { if (document.getElementById("keywordInput").value.trim() !== "") { document.getElementById("clearSearchBtn").classList.remove("hidden"); } else { document.getElementById("clearSearchBtn").classList.add("hidden"); } if (e.key === "Enter") executeStockSearch(); }
    function executeStockSearch() { searchKeyword = document.getElementById("keywordInput").value.trim().toLowerCase(); applyFilters(); }
    function clearSearchField() { document.getElementById("keywordInput").value = ""; document.getElementById("clearSearchBtn").classList.add("hidden"); searchKeyword = ""; applyFilters(); }

    function renderChipTrendChart() {
      const chipChartEl = document.getElementById("trendChipChart");
      if (!chipChartEl || !currentActiveStockId) return;
      const myChipsRaw = globalChipCache.filter(c => String(c.stock_id).trim() === String(currentActiveStockId).trim());
      const localTrendDates = [...extendedTrendDates].filter(d => myChipsRaw.some(c => String(c.date) === d)).sort((a, b) => b.localeCompare(a));
      const subTabConfigs = { f: { bKey: 'f_buy', sKey: 'f_sell', color: 'bg-rose-500', negColor: 'bg-emerald-500' }, it: { bKey: 'it_buy', sKey: 'it_sell', color: 'bg-orange-500', negColor: 'bg-teal-500' }, ds: { bKey: 'ds_buy', sKey: 'ds_sell', color: 'bg-red-500', negColor: 'bg-green-500' } };
      const cfg = subTabConfigs[currentChipSubTab];
      let nets = localTrendDates.map(d => { const row = myChipsRaw.find(c => String(c.date) === d); if (!row) return 0; if (currentChipSubTab === "ds") return Math.round(((row.ds_buy||0)+(row.dh_buy||0))/1000) - Math.round(((row.ds_sell||0)+(row.dh_sell||0))/1000); return Math.round((row[cfg.bKey]||0)/1000) - Math.round((row[cfg.sKey]||0)/1000); });
      let absMax = Math.max(...nets.map(Math.abs), 1);
      let barsHtml = localTrendDates.map((d, i) => { const val = nets[i]; const isPositive = val >= 0; const heightPct = Math.min(Math.round((Math.abs(val) / absMax) * 80), 80); return `<div class="flex flex-col flex-1 h-full min-w-0 relative items-center"><div class="w-full h-1/2 flex flex-col justify-end items-center relative">${isPositive && val > 0 ? `<span class="text-xs font-black text-rose-600 mb-1 tracking-tighter">${val > 0 ? '+' + val : val}</span><div class="w-full max-w-[20px] min-w-[4px] ${cfg.color} rounded-t-xs shadow-2xs" style="height: ${heightPct}%;"></div>` : ''}${val === 0 ? `<span class="text-xs font-bold text-slate-400 mb-1">0</span>` : ''}</div><div class="w-full h-1/2 flex flex-col justify-start items-center relative">${!isPositive ? `<div class="w-full max-w-[20px] min-w-[4px] ${cfg.negColor} rounded-b-xs shadow-2xs" style="height: ${heightPct}%;"></div><span class="text-xs font-black text-emerald-600 mt-1 tracking-tighter">${val}</span>` : ''}<span class="absolute top-[2px] text-[10px] text-slate-950 font-black tracking-tighter">${d.split('-')[1] + '/' + d.split('-')[2]}</span></div></div>`; }).join('');
      chipChartEl.innerHTML = `<div class="bg-slate-50 border border-slate-200 rounded-xl p-1.5 w-full"><div class="w-full h-32 flex justify-between bg-white rounded-lg border border-slate-200 px-1 relative items-center"><div class="absolute left-0 right-0 h-[1.5px] bg-slate-400 z-10"></div>${barsHtml}</div></div>`;
    }
    function updateTabSelectOptions(sheets) { const select = document.getElementById("tabSelect"); if (!select) return; select.innerHTML = `<option value="全部">🌐 全部成分股</option>`; sheets.forEach(sheet => { if (sheet) select.innerHTML += `<option value="${sheet}">📁 ${sheet}</option>`; }); select.value = currentSourceTab; }
  </script>
</body>
</html>
