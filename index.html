  <script>
    const SUPABASE_URL = "https://fekesirsqjbkrgaibrjf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZla2VzaXJzcWpia3JnYWlicmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTY0MjUsImV4cCI6MjA5NDU5MjQyNX0.82wBFq-B8cxfK9h_gkJQgIpMEabke1EhB6Oacw2lonc";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const FINMIND_TOKEN = "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoiQ2h1bmcwNSIsImVtYWlsIjoiY2hpdTYuY2h1bmcwNUBnbWFpbC5jb20iLCJ0b2tlbl92ZXJzaW9uIjowfQ.Jsmprys2d_Vz8x5eeXnLZRn9_MjWpNH7kp77gL3qRz0";
    
    const colorThemes = {
      '全部': { active: 'bg-slate-800 text-white shadow-xs', inactive: 'bg-slate-100 text-slate-700 hover:bg-slate-200' },
      '高股息自選股': { active: 'bg-amber-500 text-white shadow-xs', inactive: 'bg-amber-50 text-amber-700 hover:bg-amber-100' },
      '電子權值股': { active: 'bg-indigo-600 text-white shadow-xs', inactive: 'bg-indigo-50 text-indigo-700 hover:bg-indigo-100' },
      '預設': { active: 'bg-emerald-600 text-white shadow-xs', inactive: 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100' }
    };

    let currentSourceTab = '全部';
    let dbStockData = [];          
    let globalChipCache = [];      
    let targetSheetsSet = new Set();

    document.addEventListener("DOMContentLoaded", async () => {
      calculateRecentFiveTradeDays();
      renderTableHeader();
      await forceSyncFlow(); 
    });

    // 💡 鐵腕計算最近 5 個可能交易日（排除週末）
    function calculateRecentFiveTradeDays() {
      let dates = [];
      let d = new Date();
      while(dates.length < 5) {
        let day = d.getDay();
        if (day !== 0 && day !== 6) { 
          dates.push(formatDateToString(d));
        }
        d.setDate(d.getDate() - 1);
      }
      recentDates = dates; 
      document.getElementById("chipUpdateTime").innerText = recentDates[0];
      console.log("🎯 前端硬性指定的5個看盤交易日區間：", recentDates);
    }

    async function forceSyncFlow() {
      const modal = document.getElementById("loadingModal");
      const detailText = document.getElementById("loadingDetail");
      modal.classList.remove("hidden");

      try {
        detailText.innerText = "1. 讀取並更新 Excel 標的名單...";
        await autoLoadAndSyncExcelList();

        detailText.innerText = "2. 檢查雲端缺口並精準回補 (FinMind)...";
        await handleSmartWideBackfill();

        detailText.innerText = "3. 從新寬資料表取回全量 5 日籌碼...";
        await fetchWideChipsFromSupabase();

        detailText.innerText = "4. 建立多窗格看盤矩陣與排序...";
        renderTableHeader();
        applyFilters();

      } catch (err) {
        console.error("總流程異常:", err);
      } finally {
        modal.classList.add("hidden");
      }
    }

    // 拉回目標股票這 5 天的寬資料（精準且不重複）
    async function fetchWideChipsFromSupabase() {
      if (dbStockData.length === 0) return;
      const stockIdsInList = dbStockData.map(s => s.stock_id);

      const { data, error } = await supabaseClient
        .from('stock_chips_daily')
        .select('*')
        .in('stock_id', stockIdsInList)
        .in('date', recentDates);

      if (error) {
        console.error("讀取新寬表失敗:", error);
        return;
      }

      globalChipCache = data || [];
      console.log(`🎉 寬資料載入完成，共 ${globalChipCache.length} 筆資料。`);
    }

    // 精準補網機制
    async function handleSmartWideBackfill() {
      const statusText = document.getElementById("uploadStatus");
      const detailText = document.getElementById("loadingDetail");
      const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

      if (dbStockData.length === 0) return;
      
      const startDateStr = recentDates[recentDates.length - 1];
      const endDateStr = recentDates[0];

      statusText.innerText = `🔄 正在核對雲端 5 日寬資料完整度...`;

      const { data: existingRows } = await supabaseClient
        .from('stock_chips_daily')
        .select('stock_id, date')
        .in('stock_id', dbStockData.map(s => s.stock_id))
        .in('date', recentDates);

      const existingSet = new Set((existingRows || []).map(r => `${r.stock_id}_${r.date}`));

      for (let i = 0; i < dbStockData.length; i++) {
        const stock = dbStockData[i];
        let isMissing = false;
        for (let d of recentDates) {
          if (!existingSet.has(`${stock.stock_id}_${d}`)) {
            isMissing = true;
            break;
          }
        }

        if (!isMissing) continue; 

        detailText.innerText = `[精準回補寬缺口] ${stock.stock_id} ${stock.stock_name} (${i+1}/${dbStockData.length})`;

        try {
          const apiUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInstitutionalInvestorsBuySell&data_id=${stock.stock_id}&start_date=${startDateStr}&end_date=${endDateStr}&token=${FINMIND_TOKEN}`;
          const res = await fetch(apiUrl);
          if (res.status === 429) { await sleep(4000); i--; continue; } 
          
          const resJson = await res.json();
          if (resJson.status === 200 && Array.isArray(resJson.data) && resJson.data.length > 0) {
            
            const dateMap = {};
            resJson.data.forEach(row => {
              const d = row.date;
              if (!dateMap[d]) {
                dateMap[d] = { stock_id: stock.stock_id, date: d, f_buy:0, f_sell:0, fd_buy:0, fd_sell:0, it_buy:0, it_sell:0, ds_buy:0, ds_sell:0, dh_buy:0, dh_sell:0 };
              }
              if (row.name === 'Foreign_Investor') { dateMap[d].f_buy = row.buy; dateMap[d].f_sell = row.sell; }
              else if (row.name === 'Foreign_Dealer_Self') { dateMap[d].fd_buy = row.buy; dateMap[d].fd_sell = row.sell; }
              else if (row.name === 'Investment_Trust') { dateMap[d].it_buy = row.buy; dateMap[d].it_sell = row.sell; }
              else if (row.name === 'Dealer_self') { dateMap[d].ds_buy = row.buy; dateMap[d].ds_sell = row.sell; }
              else if (row.name === 'Dealer_Hedging') { dateMap[d].dh_buy = row.buy; dateMap[d].dh_sell = row.sell; }
            });

            const rowsToUpsert = Object.values(dateMap);
            if (rowsToUpsert.length > 0) {
              await supabaseClient.from('stock_chips_daily').upsert(rowsToUpsert);
            }
          }
        } catch (err) {
          console.error(err);
        }
        await sleep(300); 
      }
      statusText.innerText = "✅ 5日寬化庫對接檢查全數落幕！";
    }

    function formatDateToString(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    // 🎯 核心更換：完美找回並內嵌排序下拉選單
    function renderTableHeader() {
      const headerDates = document.getElementById("tableHeaderDates");
      const headerSub = document.getElementById("tableHeaderSub");
      if (!headerDates || !headerSub) return;

      let datesHtml = `
        <th rowspan="2" class="px-1 py-2 bg-slate-200 sticky left-0 z-40 w-[94px] min-w-[94px] max-w-[94px] align-middle text-center border-r border-slate-300">
          <div class="flex flex-col items-center gap-1">
            <span class="font-extrabold text-[11px] text-slate-900 whitespace-nowrap tracking-tighter">標的(代號/名稱)</span>
            <select onchange="changeSortMode(this.value)" class="text-[11px] border border-slate-400 rounded px-0.5 py-0.5 bg-white font-bold cursor-pointer focus:outline-none w-full text-slate-800 tracking-tighter">
              <option value="stock_id" ${currentSortMode==='stock_id'?'selected':''}>🔢 代號排序</option>
              <option value="foreign_buy" ${currentSortMode==='foreign_buy'?'selected':''}>🔺 外資買超</option>
              <option value="foreign_dealer_buy" ${currentSortMode==='foreign_dealer_buy'?'selected':''}>🔺 外自營買</option>
              <option value="investment_buy" ${currentSortMode==='investment_buy'?'selected':''}>🔺 投信買超</option>
              <option value="dealer_self_buy" ${currentSortMode==='dealer_self_buy'?'selected':''}>🔺 自營自行</option>
              <option value="dealer_hedging_buy" ${currentSortMode==='dealer_hedging_buy'?'selected':''}>🔺 自營避險</option>
              <option value="foreign_sell" ${currentSortMode==='foreign_sell'?'selected':''}>🔻 外資賣超</option>
              <option value="foreign_dealer_sell" ${currentSortMode==='foreign_dealer_sell'?'selected':''}>🔻 外自營賣</option>
              <option value="investment_sell" ${currentSortMode==='investment_sell'?'selected':''}>🔻 投信賣超</option>
              <option value="dealer_self_sell" ${currentSortMode==='dealer_self_sell'?'selected':''}>🔻 自營自行賣</option>
              <option value="dealer_hedging_sell" ${currentSortMode==='dealer_hedging_sell'?'selected':''}>🔻 自營避險賣</option>
            </select>
          </div>
        </th>
        <th rowspan="2" class="px-1 py-2 bg-slate-100 font-extrabold text-xs text-slate-800 sticky left-[94px] z-40 w-[52px] min-w-[52px] max-w-[52px] align-middle whitespace-nowrap border-r border-slate-300 text-center">法人</th>
        <th rowspan="2" class="px-1 py-2 bg-amber-100 font-black text-xs text-amber-950 sticky left-[146px] z-40 w-[68px] min-w-[68px] max-w-[68px] align-middle whitespace-nowrap border-r border-slate-300 text-center sticky-col-shadow">5日結</th>
      `;
      let subHtml = "";

      recentDates.forEach((dateStr, index) => {
        const parts = dateStr.split('-');
        const formattedDate = parts.length === 3 ? `${parts[1]}/${parts[2]}` : dateStr;
        const borderClass = index === recentDates.length - 1 ? "" : "border-r border-slate-300";
        datesHtml += `<th colspan="3" class="px-2 py-2 ${borderClass} text-sm bg-slate-100 text-slate-900 font-bold whitespace-nowrap">${formattedDate}</th>`;
        
        const subBorderClass = index === recentDates.length - 1 ? "" : "border-r border-slate-300 bg-slate-50";
        subHtml += `
          <th class="py-1.5 border-r border-slate-200 w-[55px] min-w-[55px] text-sm font-bold text-slate-600">買</th>
          <th class="py-1.5 border-r border-slate-200 w-[55px] min-w-[55px] text-sm font-bold text-slate
