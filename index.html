<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>牛牛分析站 - 智慧過濾籌碼寬資版</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    .sticky-col-shadow { box-shadow: 3px 0 6px -3px rgba(0, 0, 0, 0.25); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <div id="loadingModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full mx-4 text-center border border-slate-100 flex flex-col items-center">
      <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
      <h3 class="text-base font-bold text-slate-900 mb-1">雲端籌碼智慧同步中...</h3>
      <p id="loadingDetail" class="text-xs text-slate-500 font-medium">安全連線中...</p>
    </div>
  </div>

  <div class="sticky top-0 z-40 bg-linear-to-r from-sky-400 via-cyan-400 to-blue-400 text-slate-900 py-3 shadow-md border-b border-sky-300/30 px-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      
      <div class="flex items-center gap-2.5 min-w-0 grow">
        <img src="main_icon.png" alt="牛牛標誌" class="w-[36px] h-[36px] object-contain rounded-lg shadow-xs bg-white/40 p-0.5 shrink-0">
        <div class="flex flex-col sm:flex-row sm:items-baseline gap-x-4 gap-y-0.5 min-w-0">
          <h1 class="text-lg md:text-xl font-extrabold tracking-tight text-slate-950 whitespace-nowrap">牛牛分析站</h1>
          
          <div class="flex items-center gap-3 text-[11px] font-bold text-slate-800/90 whitespace-nowrap overflow-hidden">
            <span class="flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-600"></span>
              名單更新：<span id="listUpdateTime" class="font-black text-slate-950">載入中...</span>
            </span>
            <span class="flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>
              資料更新：<span id="chipUpdateTime" class="font-black text-slate-950">檢測中...</span>
            </span>
          </div>
        </div>
      </div>
      
      <div class="shrink-0">
        <button onclick="forceSyncFlow()" class="cursor-pointer bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-xs whitespace-nowrap flex items-center justify-center gap-1">
          ⚡ 更新
        </button>
      </div>
      
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 pt-4 pb-12">
    <section class="bg-white p-3 rounded-xl shadow-xs border border-slate-200 mb-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      
      <div class="flex items-center gap-2 grow sm:max-w-xs">
        <label for="tabSelect" class="text-xs font-bold text-slate-400 shrink-0 whitespace-nowrap uppercase tracking-wider">成分股來源</label>
        <select id="tabSelect" onchange="switchTab(this.value)" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs font-bold text-slate-700 focus:outline-none focus:border-blue-500 focus:bg-white cursor-pointer transition-colors">
          <option value="全部">🌐 全部成分股</option>
        </select>
      </div>
      
      <div class="flex items-center gap-2 shrink-0 justify-between sm:justify-end">
        <div class="relative flex items-center">
          <input type="text" id="keywordInput" onkeyup="handleSearchKeyup(event)" placeholder="輸入代號或名稱..." class="w-40 md:w-48 bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-medium focus:outline-none focus:border-blue-500 focus:bg-white transition-colors" />
          <button onclick="clearSearchField()" id="clearSearchBtn" class="hidden absolute right-2.5 text-slate-400 hover:text-slate-600 text-xs font-bold cursor-pointer">✕</button>
        </div>
        <button onclick="executeStockSearch()" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-xs whitespace-nowrap flex items-center gap-1">
          🔍 搜尋
        </button>
      </div>
    </section>

    <section class="bg-blue-50 p-3 rounded-xl border border-blue-100 mb-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div class="text-sm text-slate-700 font-semibold">目前分類共有: <span id="recordCount" class="font-bold text-lg text-blue-600">0</span> 檔股票</div>
      <div id="dataSourceLabel" class="text-xs text-slate-500 font-bold bg-white px-2 py-1 rounded border border-blue-200">數據狀態：檢測中</div>
    </section>

    <section class="bg-white rounded-xl shadow-md border border-slate-300 overflow-auto max-h-[72vh] relative">
      <table class="min-w-full text-center text-sm text-slate-700 border-collapse table-fixed">
        <thead class="text-slate-800 font-extrabold sticky top-0 z-30 bg-slate-100 shadow-xs border-b border-slate-300">
          <tr id="tableHeaderDates"></tr>
          <tr id="tableHeaderSub" class="text-xs text-slate-500 bg-slate-50/80"></tr>
        </thead>
        <tbody id="stockTableBody" class="bg-white"></tbody>
      </table>
    </section>
  </div>

  <script>
    const SUPABASE_URL = "https://fekesirsqjbkrgaibrjf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZla2VzaXJzcWpia3JnYWlicmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTY0MjUsImV4cCI6MjA5NDU5MjQyNX0.82wBFq-B8cxfK9h_gkJQgIpMEabke1EhB6Oacw2lonc";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentSourceTab = '全部';
    let dbStockData = [];          
    let globalChipCache = [];      
    let targetSheetsSet = new Set();
    let recentDates = []; 
    let currentSortMode = 'stock_id'; 
    let searchKeyword = ""; 

    document.addEventListener("DOMContentLoaded", async () => {
      calculateRecentFiveTradeDays(); 
      renderTableHeader(); 
      await forceSyncFlow(); 
    });

    function calculateRecentFiveTradeDays() {
      let dates = [];
      let d = new Date();
      while(dates.length < 5) {
        let day = d.getDay();
        if (day !== 0 && day !== 6) { 
          dates.push(formatDateToString(d));
        }
        d.setDate(d.getDate() - 1);
      }
      recentDates = dates; 
      document.getElementById("chipUpdateTime").innerText = recentDates[0];
    }

    async function forceSyncFlow() {
      const modal = document.getElementById("loadingModal");
      const detailText = document.getElementById("loadingDetail");
      modal.classList.remove("hidden");

      try {
        detailText.innerText = "1. 載入雲端股票名單與成分分類...";
        const { data: dbData, error: targetError } = await supabaseClient
          .from('stock_targets')
          .select('stock_id, stock_name, sheet_tags')
          .order('stock_id', { ascending: true });
          
        if (targetError) throw targetError;
        dbStockData = dbData || [];

        // 💡 100% 還原原始碼中完全正常的下拉清單產出語法，確保標籤不遺漏
        document.getElementById("listUpdateTime").innerText = new Date().toLocaleDateString();
        targetSheetsSet.clear();
        dbStockData.forEach(item => { 
          if (Array.isArray(item.sheet_tags)) {
            item.sheet_tags.forEach(tag => targetSheetsSet.add(tag)); 
          }
        });
        updateTabSelectOptions(Array.from(targetSheetsSet));

        detailText.innerText = "2. 正在精準定位最新 5 日盤後寬數據...";
        calculateRecentFiveTradeDays();

        detailText.innerText = "3. 分批讀取雲端大量籌碼快取庫...";
        await fetchAllChipsFromSupabase();

        detailText.innerText = "4. 正在佈局視覺矩陣...";
        renderTableHeader();
        applyFilters();

        document.getElementById("dataSourceLabel").innerText = "🟢 數據狀態：Supabase 雲端寬資料快取供應中";

      } catch (err) {
        console.error("讀取雲端快取資料流程發生異常:", err);
      } finally {
        modal.classList.add("hidden");
      }
    }

    async function fetchAllChipsFromSupabase() {
      if (recentDates.length === 0 || dbStockData.length === 0) return;
      const detailText = document.getElementById("loadingDetail");
      const stockIdsInList = dbStockData.map(s => s.stock_id);
      
      let allChipsFetched = [];
      let startRange = 0;
      const batchSize = 3000;
      let keepFetching = true;

      while (keepFetching) {
        let endRange = startRange + batchSize - 1;
        detailText.innerText = `3. 分批載入雲端寬數據中 (${startRange} ~ ${endRange} 筆)...`;

        const { data, error } = await supabaseClient
          .from('stock_chips_daily')
          .select('*')
          .in('stock_id', stockIdsInList)
          .in('date', recentDates)
          .range(startRange, endRange);

        if (error) {
          console.error("分批讀取寬表雲端快取異常:", error);
          break;
        }

        if (data && data.length > 0) {
          allChipsFetched = allChipsFetched.concat(data);
          if (data.length < batchSize) {
            keepFetching = false;
          } else {
            startRange += batchSize;
          }
        } else {
          keepFetching = false;
        }
      }

      globalChipCache = allChipsFetched;
    }

    function formatDateToString(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function renderTableHeader() {
      const headerDates = document.getElementById("tableHeaderDates");
      const headerSub = document.getElementById("tableHeaderSub");
      if (!headerDates || !headerSub) return;

      let datesHtml = `
        <th rowspan="2" class="px-1 py-2 bg-slate-200 sticky left-0 z-40 w-[94px] min-w-[94px] max-w-[94px] align-middle text-center border-r border-slate-300">
          <div class="flex flex-col items-center
