<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>牛牛分析站 - 寬資料智慧排序版</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <div id="loadingModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full mx-4 text-center border border-slate-100 flex flex-col items-center">

      <h3 class="text-base font-bold text-slate-900 mb-1">5日寬數據智慧過濾中...</h3>
      <p id="loadingDetail" class="text-xs text-slate-500 font-medium">請稍候...</p>
    </div>
  </div>

  <div class="sticky top-0 z-40 bg-linear-to-r from-sky-400 via-cyan-400 to-blue-400 text-slate-900 py-4 shadow-md border-b border-sky-300/30 px-4">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:justify-between md:items-center gap-3">
      <div class="flex items-center gap-3">
        <img src="main_icon.png" alt="牛牛標誌" class="w-[42px] h-[42px] object-contain rounded-lg shadow-xs bg-white/40 p-0.5">
        <div>
          <h1 class="text-xl md:text-2xl font-extrabold tracking-tight text-slate-950 leading-tight">牛牛分析站</h1>
          <p class="text-[11px] text-slate-800/80 font-medium">精準5個交易日 · 寬資料動態排序架構</p>
        </div>
      </div>
      
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 bg-white/90 backdrop-blur-md p-2.5 px-4 rounded-xl border border-sky-200 w-full md:w-auto shadow-sm">
        <div class="flex flex-col gap-0.5 text-xs font-semibold text-slate-600 grow">
          <div class="flex items-center justify-between gap-4">
            <div>名單同步日：<span id="listUpdateTime" class="text-slate-900 font-bold">載入中...</span></div>
            <div>指定看盤起日：<span id="chipUpdateTime" class="text-slate-900 font-bold">檢測中...</span></div>
          </div>
          <div class="border-t border-slate-200/60 my-0.5"></div>
          <div id="uploadStatus" class="text-[11px] text-blue-700 font-bold">系統就緒</div>
        </div>
        <button onclick="forceSyncFlow()" class="cursor-pointer bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-xs text-center flex items-center justify-center gap-1">
          ⚡ 智慧檢查並回補
        </button>
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 pt-4 pb-12">
    <section class="bg-white p-3 rounded-xl shadow-xs border border-slate-200 mb-3">
      <div class="flex overflow-x-auto gap-2 scrollbar-none" id="tabContainer">
        <button onclick="switchTab('全部')" id="tab-全部" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-xs whitespace-nowrap cursor-pointer">🌐 全部成分股</button>
      </div>
    </section>

    <section class="bg-blue-50 p-3 rounded-xl border border-blue-100 mb-4 flex justify-between items-center">
      <div class="text-sm text-slate-700 font-semibold">目前分類共有: <span id="recordCount" class="font-bold text-lg text-blue-600">0</span> 檔股票</div>
      <div id="dataSourceLabel" class="text-xs text-slate-500 font-bold bg-white px-2 py-1 rounded border border-blue-200">狀態：初始化</div>
    </section>

    <section class="bg-white rounded-xl shadow-md border border-slate-300 overflow-auto max-h-[72vh] relative">
      <table class="min-w-full text-center text-sm text-slate-700 border-collapse table-fixed">
        <thead class="text-slate-800 font-extrabold sticky top-0 z-30 bg-slate-100 shadow-xs border-b border-slate-300">
          <tr id="tableHeaderDates"></tr>
          <tr id="tableHeaderSub" class="text-xs text-slate-500 bg-slate-50/80"></tr>
        </thead>
        <tbody id="stockTableBody" class="bg-white"></tbody>
      </table>
    </section>
  </div>

  <script>
    const SUPABASE_URL = "https://fekesirsqjbkrgaibrjf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZla2VzaXJzcWpia3JnYWlicmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTY0MjUsImV4cCI6MjA5NDU5MjQyNX0.82wBFq-B8cxfK9h_gkJQgIpMEabke1EhB6Oacw2lonc";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const EXCEL_SOURCE_URL = "./Stock_list.xlsx"; 
    const FINMIND_TOKEN = "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoiQ2h1bmcwNSIsImVtYWlsIjoiY2hpdTYuY2h1bmcwNUBnbWFpbC5jb20iLCJ0b2tlbl92ZXJzaW9uIjowfQ.Jsmprys2d_Vz8x5eeXnLZRn9_MjWpNH7kp77gL3qRz0";
    
    const colorThemes = {
      '全部': { active: 'bg-slate-800 text-white shadow-xs', inactive: 'bg-slate-100 text-slate-700 hover:bg-slate-200' },
      '高股息自選股': { active: 'bg-amber-500 text-white shadow-xs', inactive: 'bg-amber-50 text-amber-700 hover:bg-amber-100' },
      '電子權值股': { active: 'bg-indigo-600 text-white shadow-xs', inactive: 'bg-indigo-50 text-indigo-700 hover:bg-indigo-100' },
      '預設': { active: 'bg-emerald-600 text-white shadow-xs', inactive: 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100' }
    };

    let currentSourceTab = '全部';
    let dbStockData = [];          
    let globalChipCache = [];      
    let targetSheetsSet = new Set();
    let recentDates = []; 
    let currentSortMode = 'stock_id'; // 預設排序：股票代號

    document.addEventListener("DOMContentLoaded", async () => {
      calculateRecentFiveTradeDays();
      renderTableHeader();
      await forceSyncFlow(); 
    });

    // 💡 鐵腕計算最近 5 個可能交易日（排除週末）
    function calculateRecentFiveTradeDays() {
      let dates = [];
      let d = new Date();
      while(dates.length < 5) {
        let day = d.getDay();
        if (day !== 0 && day !== 6) { 
          dates.push(formatDateToString(d));
        }
        d.setDate(d.getDate() - 1);
      }
      recentDates = dates; 
      document.getElementById("chipUpdateTime").innerText = recentDates[0];
      console.log("🎯 前端硬性指定的5個看盤交易日區間：", recentDates);
    }

    async function forceSyncFlow() {
      const modal = document.getElementById("loadingModal");
      const detailText = document.getElementById("loadingDetail");
      modal.classList.remove("hidden");

      try {
        detailText.innerText = "1. 讀取並更新 Excel 標的名單...";
        await autoLoadAndSyncExcelList();

        detailText.innerText = "2. 檢查雲端缺口並精準回補 (FinMind)...";
        await handleSmartWideBackfill();

        detailText.innerText = "3. 從新寬資料表取回全量 5 日籌碼...";
        await fetchWideChipsFromSupabase();

        detailText.innerText = "4. 建立多窗格看盤矩陣與排序...";
        renderTableHeader();
        applyFilters();

      } catch (err) {
        console.error("總流程異常:", err);
      } finally {
        modal.classList.add("hidden");
      }
    }

    // 拉回目標股票這 5 天的寬資料（精準且不重複）
    async function fetchWideChipsFromSupabase() {
      if (dbStockData.length === 0) return;
      const stockIdsInList = dbStockData.map(s => s.stock_id);

      const { data, error } = await supabaseClient
        .from('stock_chips_daily')
        .select('*')
        .in('stock_id', stockIdsInList)
        .in('date', recentDates);

      if (error) {
        console.error("讀取新寬表失敗:", error);
        return;
      }

      globalChipCache = data || [];
      console.log(`🎉 寬資料載入完成，共 ${globalChipCache.length} 筆資料。`);
    }

    // 精準補網機制
    async function handleSmartWideBackfill() {
      const statusText = document.getElementById("uploadStatus");
      const detailText = document.getElementById("loadingDetail");
      const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

      if (dbStockData.length === 0) return;
      
      const startDateStr = recentDates[recentDates.length - 1];
      const endDateStr = recentDates[0];

      statusText.innerText = `🔄 正在核對雲端 5 日寬資料完整度...`;

      const { data: existingRows } = await supabaseClient
        .from('stock_chips_daily')
        .select('stock_id, date')
        .in('stock_id', dbStockData.map(s => s.stock_id))
        .in('date', recentDates);

      const existingSet = new Set((existingRows || []).map(r => `${r.stock_id}_${r.date}`));

      for (let i = 0; i < dbStockData.length; i++) {
        const stock = dbStockData[i];
        let isMissing = false;
        for (let d of recentDates) {
          if (!existingSet.has(`${stock.stock_id}_${d}`)) {
            isMissing = true;
            break;
          }
        }

        if (!isMissing) continue; 

        detailText.innerText = `[精準回補寬缺口] ${stock.stock_id} ${stock.stock_name} (${i+1}/${dbStockData.length})`;

        try {
          const apiUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInstitutionalInvestorsBuySell&data_id=${stock.stock_id}&start_date=${startDateStr}&end_date=${endDateStr}&token=${FINMIND_TOKEN}`;
          const res = await fetch(apiUrl);
          if (res.status === 429) { await sleep(4000); i--; continue; } 
          
          const resJson = await res.json();
          if (resJson.status === 200 && Array.isArray(resJson.data) && resJson.data.length > 0) {
            
            const dateMap = {};
            resJson.data.forEach(row => {
              const d = row.date;
              if (!dateMap[d]) {
                dateMap[d] = { stock_id: stock.stock_id, date: d, f_buy:0, f_sell:0, fd_buy:0, fd_sell:0, it_buy:0, it_sell:0, ds_buy:0, ds_sell:0, dh_buy:0, dh_sell:0 };
              }
              if (row.name === 'Foreign_Investor') { dateMap[d].f_buy = row.buy; dateMap[d].f_sell = row.sell; }
              else if (row.name === 'Foreign_Dealer_Self') { dateMap[d].fd_buy = row.buy; dateMap[d].fd_sell = row.sell; }
              else if (row.name === 'Investment_Trust') { dateMap[d].it_buy = row.buy; dateMap[d].it_sell = row.sell; }
              else if (row.name === 'Dealer_self') { dateMap[d].ds_buy = row.buy; dateMap[d].ds_sell = row.sell; }
              else if (row.name === 'Dealer_Hedging') { dateMap[d].dh_buy = row.buy; dateMap[d].dh_sell = row.sell; }
            });

            const rowsToUpsert = Object.values(dateMap);
            if (rowsToUpsert.length > 0) {
              await supabaseClient.from('stock_chips_daily').upsert(rowsToUpsert);
            }
          }
        } catch (err) {
          console.error(err);
        }
        await sleep(300); 
      }
      statusText.innerText = "✅ 5日寬化庫對接檢查全數落幕！";
    }

    function formatDateToString(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    // 🎯 核心更換：完美找回並內嵌排序下拉選單
    function renderTableHeader() {
      const headerDates = document.getElementById("tableHeaderDates");
      const headerSub = document.getElementById("tableHeaderSub");
      if (!headerDates || !headerSub) return;

      let datesHtml = `
        <th rowspan="2" class="px-1 py-2 bg-slate-200 sticky left-0 z-40 w-[94px] min-w-[94px] max-w-[94px] align-middle text-center border-r border-slate-300">
          <div class="flex flex-col items-center gap-1">
            <span class="font-extrabold text-[11px] text-slate-900 whitespace-nowrap tracking-tighter">標的(代號/名稱)</span>
            <select onchange="changeSortMode(this.value)" class="text-[11px] border border-slate-400 rounded px-0.5 py-0.5 bg-white font-bold cursor-pointer focus:outline-none w-full text-slate-800 tracking-tighter">
              <option value="stock_id" ${currentSortMode==='stock_id'?'selected':''}>🔢 代號排序</option>
              <option value="foreign_buy" ${currentSortMode==='foreign_buy'?'selected':''}>🔺 外資買超</option>
              <option value="foreign_dealer_buy" ${currentSortMode==='foreign_dealer_buy'?'selected':''}>🔺 外自營買</option>
              <option value="investment_buy" ${currentSortMode==='investment_buy'?'selected':''}>🔺 投信買超</option>
              <option value="dealer_self_buy" ${currentSortMode==='dealer_self_buy'?'selected':''}>🔺 自營自行</option>
              <option value="dealer_hedging_buy" ${currentSortMode==='dealer_hedging_buy'?'selected':''}>🔺 自營避險</option>
              <option value="foreign_sell" ${currentSortMode==='foreign_sell'?'selected':''}>🔻 外資賣超</option>
              <option value="foreign_dealer_sell" ${currentSortMode==='foreign_dealer_sell'?'selected':''}>🔻 外自營賣</option>
              <option value="investment_sell" ${currentSortMode==='investment_sell'?'selected':''}>🔻 投信賣超</option>
              <option value="dealer_self_sell" ${currentSortMode==='dealer_self_sell'?'selected':''}>🔻 自營自行賣</option>
              <option value="dealer_hedging_sell" ${currentSortMode==='dealer_hedging_sell'?'selected':''}>🔻 自營避險賣</option>
            </select>
          </div>
        </th>
        <th rowspan="2" class="px-1 py-2 bg-slate-100 font-extrabold text-xs text-slate-800 sticky left-[94px] z-40 w-[52px] min-w-[52px] max-w-[52px] align-middle whitespace-nowrap border-r border-slate-300 text-center">法人</th>
        <th rowspan="2" class="px-1 py-2 bg-amber-100 font-black text-xs text-amber-950 sticky left-[146px] z-40 w-[68px] min-w-[68px] max-w-[68px] align-middle whitespace-nowrap border-r border-slate-300 text-center sticky-col-shadow">5日結</th>
      `;
      let subHtml = "";

      recentDates.forEach((dateStr, index) => {
        const parts = dateStr.split('-');
        const formattedDate = parts.length === 3 ? `${parts[1]}/${parts[2]}` : dateStr;
        const borderClass = index === recentDates.length - 1 ? "" : "border-r border-slate-300";
        datesHtml += `<th colspan="3" class="px-2 py-2 ${borderClass} text-sm bg-slate-100 text-slate-900 font-bold whitespace-nowrap">${formattedDate}</th>`;
        
        const subBorderClass = index === recentDates.length - 1 ? "" : "border-r border-slate-300 bg-slate-50";
        subHtml += `
          <th class="py-1.5 border-r border-slate-200 w-[55px] min-w-[55px] text-sm font-bold text-slate-600">買</th>
          <th class="py-1.5 border-r border-slate-200 w-[55px] min-w-[55px] text-sm font-bold text-slate-600">賣</th>
          <th class="py-1.5 ${subBorderClass} w-[65px] min-w-[65px] text-sm font-extrabold text-slate-800">結</th>
        `;
      });
      headerDates.innerHTML = datesHtml;
      headerSub.innerHTML = subHtml;
    }

    function changeSortMode(val) {
      currentSortMode = val;
      applyFilters();
    }

    async function autoLoadAndSyncExcelList() {
      try {
        const response = await fetch(EXCEL_SOURCE_URL);
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        const stockMap = new Map();
        workbook.SheetNames.forEach(sheetName => {
          const worksheet = workbook.Sheets[sheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet);
          jsonData.forEach(row => {
            const stockId = String(row['股票代號'] || row['代號'] || '').trim();
            const stockName = String(row['股票名稱'] || row['名稱'] || '').trim();
            if (stockId && stockName) {
              if (stockMap.has(stockId)) {
                if(!stockMap.get(stockId).sheet_tags.includes(sheetName)) stockMap.get(stockId).sheet_tags.push(sheetName);
              } else {
                stockMap.set(stockId, { stock_id: stockId, stock_name: stockName, sheet_tags: [sheetName] });
              }
            }
          });
        });
        const rowsToUpload = Array.from(stockMap.values());
        if (rowsToUpload.length > 0) {
          await supabaseClient.from('stock_targets').upsert(rowsToUpload, { onConflict: 'stock_id' });
        }
        const { data: dbData } = await supabaseClient.from('stock_targets').select('*');
        dbStockData = dbData || [];
        document.getElementById("listUpdateTime").innerText = new Date().toLocaleDateString();
        
        targetSheetsSet.clear();
        dbStockData.forEach(item => { if(item.sheet_tags) item.sheet_tags.forEach(tag => targetSheetsSet.add(tag)); });
        updateTabButtons(Array.from(targetSheetsSet));
      } catch (err) {
        const { data: dbData } = await supabaseClient.from('stock_targets').select('*');
        dbStockData = dbData || [];
      }
    }

    function updateTabButtons(sheets) {
      const container = document.getElementById("tabContainer");
      container.innerHTML = `<button onclick="switchTab('全部')" id="tab-全部" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-xs whitespace-nowrap cursor-pointer transition-colors">🌐 全部成分股</button>`;
      sheets.forEach(sheet => {
        const theme = colorThemes[sheet] || colorThemes['預設'];
        container.innerHTML += `<button onclick="switchTab('${sheet}')" id="tab-${sheet}" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.inactive} whitespace-nowrap transition-colors cursor-pointer">📁 ${sheet}</button>`;
      });
      setActiveTabUI();
    }

    function switchTab(sheetName) {
      currentSourceTab = sheetName;
      applyFilters();
    }

    function setActiveTabUI() {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        const id = btn.id.replace('tab-', '');
        const theme = colorThemes[id] || colorThemes['預設'];
        btn.className = `tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.inactive} whitespace-nowrap transition-colors cursor-pointer`;
      });
      const activeBtn = document.getElementById(`tab-${currentSourceTab}`);
      if (activeBtn) {
        const theme = colorThemes[currentSourceTab] || colorThemes['預設'];
        activeBtn.className = `tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.active} whitespace-nowrap cursor-pointer`;
      }
    }

    // 🎯 核心更換：依據新「寬資料欄位」在前端極速完成5日綜合運算排序
    function applyFilters() {
      setActiveTabUI();
      let filteredStocks = [...dbStockData];
      if (currentSourceTab !== '全部') {
        filteredStocks = dbStockData.filter(item => item.sheet_tags && item.sheet_tags.includes(currentSourceTab));
      }

      // 多維度排序規則運算
      filteredStocks.sort((a, b) => {
        if (currentSortMode === 'stock_id') {
          return a.stock_id.localeCompare(b.stock_id, undefined, { numeric: true, sensitivity: 'base' });
        }

        // 輔助函式：累計該檔股票這5天指定法人的淨損益 (單位：張)
        const getSumForStock = (stockId, buyField, sellField) => {
          const chips = globalChipCache.filter(c => c.stock_id === stockId);
          return chips.reduce((acc, row) => {
            const b = Math.round((row[buyField] || 0) / 1000);
            const s = Math.round((row[sellField] || 0) / 1000);
            return acc + (b - s);
          }, 0);
        };

        let valA = 0, valB = 0;
        switch (currentSortMode) {
          case 'foreign_buy':
            valA = getSumForStock(a.stock_id, 'f_buy', 'f_sell');
            valB = getSumForStock(b.stock_id, 'f_buy', 'f_sell');
            return valB - valA; // 買超降序
          case 'foreign_dealer_buy':
            valA = getSumForStock(a.stock_id, 'fd_buy', 'fd_sell');
            valB = getSumForStock(b.stock_id, 'fd_buy', 'fd_sell');
            return valB - valA;
          case 'investment_buy':
            valA = getSumForStock(a.stock_id, 'it_buy', 'it_sell');
            valB = getSumForStock(b.stock_id, 'it_buy', 'it_sell');
            return valB - valA;
          case 'dealer_self_buy':
            valA = getSumForStock(a.stock_id, 'ds_buy', 'ds_sell');
            valB = getSumForStock(b.stock_id, 'ds_buy', 'ds_sell');
            return valB - valA;
          case 'dealer_hedging_buy':
            valA = getSumForStock(a.stock_id, 'dh_buy', 'dh_sell');
            valB = getSumForStock(b.stock_id, 'dh_buy', 'dh_sell');
            return valB - valA;
          case 'foreign_sell':
            valA = getSumForStock(a.stock_id, 'f_buy', 'f_sell');
            valB = getSumForStock(b.stock_id, 'f_buy', 'f_sell');
            return valA - valB; // 賣超升序 (負越多越前面)
          case 'foreign_dealer_sell':
            valA = getSumForStock(a.stock_id, 'fd_buy', 'fd_sell');
            valB = getSumForStock(b.stock_id, 'fd_buy', 'fd_sell');
            return valA - valB;
          case 'investment_sell':
            valA = getSumForStock(a.stock_id, 'it_buy', 'it_sell');
            valB = getSumForStock(b.stock_id, 'it_buy', 'it_sell');
            return valA - valB;
          case 'dealer_self_sell':
            valA = getSumForStock(a.stock_id, 'ds_buy', 'ds_sell');
            valB = getSumForStock(b.stock_id, 'ds_buy', 'ds_sell');
            return valA - valB;
          case 'dealer_hedging_sell':
            valA = getSumForStock(a.stock_id, 'dh_buy', 'dh_sell');
            valB = getSumForStock(b.stock_id, 'dh_buy', 'dh_sell');
            return valA - valB;
          default:
            return 0;
        }
      });

      renderMatrixTableFromCache(filteredStocks);
    }

    function renderMatrixTableFromCache(stocks) {
      document.getElementById("recordCount").innerText = stocks.length;
      const tbody = document.getElementById("stockTableBody");
      if (!tbody) return;
      let htmlString = "";

      stocks.forEach(item => {
        const myChips = globalChipCache.filter(c => c.stock_id === item.stock_id);

        let sumF = 0, sumFD = 0, sumIT = 0, sumDS = 0, sumDH = 0;
        let fRow = "", fdRow = "", iRow = "", dsRow = "", dhRow = "";

        const getCell = (b, s) => {
          const buy = Math.round(b / 1000);
          const sell = Math.round(s / 1000);
          const net = buy - sell;
          let netHtml = `<td class="py-2.5 border-r border-slate-300 text-slate-400 font-bold text-sm">0</td>`;
          if (net > 0) netHtml = `<td class="py-2.5 border-r border-slate-300 font-black bg-red-50 text-red-600 text-sm">+${net}</td>`;
          if (net < 0) netHtml = `<td class="py-2.5 border-r border-slate-300 font-black bg-green-50 text-green-600 text-sm">${net}</td>`;
          return `<td class="py-2.5 border-r border-slate-200 text-emerald-600 font-bold text-xs">${buy}</td><td class="py-2.5 border-r border-slate-200 text-rose-600 font-bold text-xs">${sell}</td>${netHtml}`;
        };

        recentDates.forEach(d => {
          const dayData = myChips.find(c => c.date === d) || { f_buy:0, f_sell:0, fd_buy:0, fd_sell:0, it_buy:0, it_sell:0, ds_buy:0, ds_sell:0, dh_buy:0, dh_sell:0 };
          
          sumF += (Math.round(dayData.f_buy/1000) - Math.round(dayData.f_sell/1000));
          sumFD += (Math.round(dayData.fd_buy/1000) - Math.round(dayData.fd_sell/1000));
          sumIT += (Math.round(dayData.it_buy/1000) - Math.round(dayData.it_sell/1000));
          sumDS += (Math.round(dayData.ds_buy/1000) - Math.round(dayData.ds_sell/1000));
          sumDH += (Math.round(dayData.dh_buy/1000) - Math.round(dayData.dh_sell/1000));

          fRow += getCell(dayData.f_buy, dayData.f_sell);
          fdRow += getCell(dayData.fd_buy, dayData.fd_sell);
          iRow += getCell(dayData.it_buy, dayData.it_sell);
          dsRow += getCell(dayData.ds_buy, dayData.ds_sell);
          dhRow += getCell(dayData.dh_buy, dayData.dh_sell);
        });

        const getSumCell = (val, isDarkRow) => {
          const bgClass = isDarkRow ? 'bg-amber-50/70' : 'bg-amber-50';
          if (val > 0) return `<td class="py-2.5 border-r border-slate-300 font-black text-rose-700 text-sm sticky left-[146px] z-20 ${bgClass} sticky-col-shadow text-center">+${val}</td>`;
          if (val < 0) return `<td class="py-2.5 border-r border-slate-300 font-black text-emerald-700 text-sm sticky left-[146px] z-20 ${bgClass} sticky-col-shadow text-center">${val}</td>`;
          return `<td class="py-2.5 border-r border-slate-300 font-bold text-slate-500 text-sm sticky left-[146px] z-20 ${bgClass} sticky-col-shadow text-center">0</td>`;
        };

        htmlString += `
          <tr class="border-t-2 border-slate-300 hover:bg-slate-50/50">
            <td rowspan="5" class="px-1 py-4 border-r border-slate-300 font-mono text-slate-900 bg-slate-100 sticky left-0 z-20 text-center leading-tight w-[94px] max-w-[94px] overflow-hidden">
              <div class="text-sm font-black tracking-tighter text-slate-950">${item.stock_id}</div>
              <div class="text-[11px] text-slate-600 font-sans mt-0.5 font-extrabold truncate tracking-tighter">${item.stock_name}</div>
            </td>
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[94px] z-20 text-center w-[52px]">外資</td>
            ${getSumCell(sumF, false)}${fRow}
          </tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-100 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[94px] z-20 text-center w-[52px]">外資自營</td>
            ${getSumCell(sumFD, true)}${fdRow}
          </td>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[94px] z-20 text-center w-[52px]">投信</td>
            ${getSumCell(sumIT, false)}${iRow}
          </td>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-100 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[94px] z-20 text-center w-[52px]">自營(自)</td>
            ${getSumCell(sumDS, true)}${dsRow}
          </td>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[94px] z-20 text-center w-[52px]">自營(避)</td>
            ${getSumCell(sumDH, false)}${dhRow}
          </td>
        `;
      });

      tbody.innerHTML = htmlString;
      document.getElementById("dataSourceLabel").innerText = "🟢 數據狀態：5日指定寬資料極速排序渲染完畢";
    }
  </script>
</body>
</html>
