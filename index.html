    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const EXCEL_SOURCE_URL = "./Stock_list.xlsx"; 

    const FINMIND_TOKEN = "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoiQ2h1bmcwNSIsImVtYWlsIjoiY2hpdTYuY2h1bmcwNUBnbWFpbC5jb20iLCJ0b2tlbl92ZXJzaW9uIjowfQ.Jsmprys2d_Vz8x5eeXnLZRn9_MjWpNH7kp77gL3qRz0";
    
    const colorThemes = {
      '全部': { active: 'bg-slate-800 text-white shadow-xs', inactive: 'bg-slate-100 text-slate-700 hover:bg-slate-200' },

    let currentSourceTab = '全部';

    async function forceSyncFlow() {
      const modal = document.getElementById("loadingModal");
      const detailText = document.getElementById("loadingDetail");
      modal.classList.remove("hidden");

      try {
        detailText.innerText = "1. 比對 Excel 標的名單...";
        await autoLoadAndSyncExcelList();

        detailText.innerText = "2. 檢查並補抓雲端籌碼 (FinMind)...";
        await handleSmartBackfillFlow();

        detailText.innerText = "3. 精準對接雲端成分股籌碼歷程...";
        await fetchAllChipsFromSupabase();

        detailText.innerText = "4. 正在佈局看盤矩陣...";
        renderTableHeader();
        applyFilters();

      } catch (err) {
        console.error("同步總流程發生未預期錯誤:", err);

    // 🧠 核心重大修正：直接拿名單內的所有 stock_id 去精準撈取最新的歷史籌碼，不再盲撈日期
    async function fetchAllChipsFromSupabase() {
      if (dbStockData.length === 0) return;
      const detailText = document.getElementById("loadingDetail");
      
      // 1. 取得名單中所有的股票代號陣列
      const stockIdsInList = dbStockData.map(s => s.stock_id);
      
      let allChipsFetched = [];
      let startRange = 0;
      const batchSize = 3000; 
      let keepFetching = true;

      // 2. 利用分批（Pagination）把這群股票代號的所有最新資料通通撈回來
      while (keepFetching) {
        let endRange = startRange + batchSize - 1;
        detailText.innerText = `3. 正在從雲端取回精準個股籌碼歷程 (${allChipsFetched.length} 筆)...`;

        const { data, error } = await supabaseClient
          .from('stock_chips')
          .select('stock_id, date, legal_name, buy, sell')
          .in('stock_id', stockIdsInList) // 🎯 精準過濾：只拿有名單的股票！
          .order('date', { ascending: false }) // 日期由新到舊排序
          .range(startRange, endRange);

        if (error) {
          console.error("分批讀取雲端快取遭遇異常:", error);
          break;
        }

        if (data && data.length > 0) {
          allChipsFetched = allChipsFetched.concat(data);
          if (data.length < batchSize) {
            keepFetching = false;
          } else {
            startRange += batchSize;
          }
        } else {
          keepFetching = false;
        }
      }

      globalChipCache = allChipsFetched;
      console.log(`🎉 籌碼資料讀取完畢，共計：${globalChipCache.length} 筆`);

      // 3. 【關鍵】從完全拿到手的資料中，提取出最新、不重複的 5 個交易日
      const uniqueDatesInCache = [...new Set(globalChipCache.map(c => c.date))];
      // 依日期字串降冪排序，確保最前面的就是最新交易日
      uniqueDatesInCache.sort((a, b) => b.localeCompare(a));
      
      recentDates = uniqueDatesInCache.slice(0, 5);
      console.log("🎯 成功從個股資料中精準切出 5 個交易日：", recentDates);

      if (recentDates.length > 0) {
        document.getElementById("chipUpdateTime").innerText = recentDates[0];
      } else {
        document.getElementById("chipUpdateTime").innerText = "無資料";
        // 萬一完全沒資料的備援
        let dates = []; let d = new Date();
        while(dates.length < 5) {
          if(d.getDay() !== 0 && d.getDay() !== 6) dates.push(formatDateToString(d));
          d.setDate(d.getDate() - 1);
        }
        recentDates = dates;
      }
    }

    async function handleSmartBackfillFlow() {
      const statusText = document.getElementById("uploadStatus");
      const detailText = document.getElementById("loadingDetail");
      const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
      try {
        const { data: checkRow } = await supabaseClient
          .from('stock_chips')
          .select('date')
          .order('date', { ascending: false })
          .limit(1);
        let lastChipDateStr = (checkRow && checkRow.length > 0) ? checkRow[0].date : null;

        const now = new Date();
        let targetEndDate = new Date();
        if (now.getHours() < 16) {
          targetEndDate.setDate(now.getDate() - 1);
        }
        const targetEndDateStr = formatDateToString(targetEndDate);

        let startFetchDateStr = "";
        if (!lastChipDateStr) {
          startFetchDateStr = "2026-05-02";
        } else {
          let lastDateObj = new Date(lastChipDateStr);
          lastDateObj.setDate(lastDateObj.getDate() + 1);
          startFetchDateStr = formatDateToString(lastDateObj);
        }

        if (startFetchDateStr > targetEndDateStr) {
          statusText.innerText = "✅ 智慧檢查：雲端資料已是最新的！";
          document.getElementById("dataSourceLabel").innerText = "🟢 數據狀態：Supabase 雲端快取供應中";
          return; 
        }

        statusText.innerText = `⚡ 準備補抓區間：${startFetchDateStr} ~ ${targetEndDateStr}`;
        if (dbStockData.length === 0) return;

        let allCollectedRows = []; 
        let errorCountConsecutive = 0;
        for (let i = 0; i < dbStockData.length; i++) {
          const stock = dbStockData[i];
          detailText.innerText = `[遠端合法同步中] ${stock.stock_id} ${stock.stock_name} (${i+1}/${dbStockData.length})\n請勿關閉網頁...`;

          let retryDelay = 3000; 
          let success = false;
          while (!success) {
            try {
              const apiUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInstitutionalInvestorsBuySell&data_id=${stock.stock_id}&start_date=${startFetchDateStr}&end_date=${targetEndDateStr}&token=${FINMIND_TOKEN}`;
              const res = await fetch(apiUrl);
              
              if (res.status === 429) {
                statusText.innerText = `⚠️ 流量受限，將於 ${retryDelay/1000} 秒後重試...`;
                await sleep(retryDelay);
                retryDelay *= 2; 
                continue;
              }

              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              const resJson = await res.json();

              if (resJson.status === 200 && Array.isArray(resJson.data)) {
                if (resJson.data.length > 0) {
                  resJson.data.forEach(row => {
                    allCollectedRows.push({
                      stock_id: row.stock_id,
                      date: row.date,
                      legal_name: row.name,
                      buy: row.buy || 0,
                      sell: row.sell || 0
                    });
                  });
                }
                success = true;
                errorCountConsecutive = 0;
              } else {
                success = true;
              }
            } catch (err) {
              console.error(`❌ 讀取 ${stock.stock_id} 發生異常:`, err);
              errorCountConsecutive++;
              if (errorCountConsecutive > 5) break; 
              await sleep(retryDelay);
              retryDelay *= 1.5;
            }
          }

          if (errorCountConsecutive > 5) break;
          await sleep(400);

          if (allCollectedRows.length >= 150) {
            await supabaseClient.from('stock_chips').upsert(allCollectedRows, { onConflict: 'stock_id,date,legal_name' });
            allCollectedRows = []; 
          }
        }

        if (allCollectedRows.length > 0) {
          await supabaseClient.from('stock_chips').upsert(allCollectedRows, { onConflict: 'stock_id,date,legal_name' });
        }
        statusText.innerText = "✅ 智慧區間補抓與雲端儲存全數完成！";
      } catch (e) {
        statusText.innerText = "⚠️ 智慧補償流執行異常";
      }
    }

    function formatDateToString(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

      if (!headerDates || !headerSub) return;

      let datesHtml = `

          <div class="flex flex-col items-center gap-1">
            <span class="font-extrabold text-[11px] text-slate-900 whitespace-nowrap tracking-tighter">標的(代號/名稱)</span>
            <select onchange="changeSortMode(this.value)" class="text-[11px] border border-slate-400 rounded px-0.5 py-0.5 bg-white font-bold cursor-pointer focus:outline-none w-full text-slate-800 tracking-tighter">
              <option value="stock_id" ${currentSortMode==='stock_id'?'selected':''}>🔢 代號排序</option>
              <option value="foreign_buy" ${currentSortMode==='foreign_buy'?'selected':''}>🔺 外資買超</option>
              <option value="foreign_dealer_buy" ${currentSortMode==='foreign_dealer_buy'?'selected':''}>🔺 外自營買</option>
              <option value="investment_buy" ${currentSortMode==='investment_buy'?'selected':''}>🔺 投信買超</option>

              <option value="dealer_hedging_buy" ${currentSortMode==='dealer_hedging_buy'?'selected':''}>🔺 自營避險</option>
              <option value="foreign_sell" ${currentSortMode==='foreign_sell'?'selected':''}>🔻 外資賣超</option>
              <option value="foreign_dealer_sell" ${currentSortMode==='foreign_dealer_sell'?'selected':''}>🔻 外自營賣</option>
              <option value="investment_sell" ${currentSortMode==='investment_sell'?'selected':''}>🔻 投信賣超</option>
              <option value="dealer_self_sell" ${currentSortMode==='dealer_self_sell'?'selected':''}>🔻 自營自行賣</option>
              <option value="dealer_hedging_sell" ${currentSortMode==='dealer_hedging_sell'?'selected':''}>🔻 自營避險賣</option>
            </select>
          </div>
        </th>
        <th rowspan="2" class="px-1 py-2 bg-slate-100 font-extrabold text-xs text-slate-800 sticky left-[90px] z-40 w-[52px] min-w-[52px] max-w-[52px] align-middle whitespace-nowrap border-r border-slate-300 text-center">法人</th>
        <th rowspan="2" class="px-1 py-2 bg-amber-100 font-black text-xs text-amber-950 sticky left-[142px] z-40 w-[68px] min-w-[68px] max-w-[68px] align-middle whitespace-nowrap border-r border-slate-300 text-center sticky-col-shadow">5日結</th>
      `;
      let subHtml = "";

        datesHtml += `<th colspan="3" class="px-2 py-2 ${borderClass} text-sm bg-slate-100 text-slate-900 font-bold whitespace-nowrap">${formattedDate}</th>`;
        
        const subBorderClass = index === recentDates.length - 1 ? "" : "border-r border-slate-300 bg-slate-50";
        subHtml += `
          <th class="py-1.5 border-r border-slate-200 w-[55px] min-w-[55px] text-sm font-bold text-slate-600">買</th>
          <th class="py-1.5 border-r border-slate-200 w-[55px] min-w-[55px] text-sm font-bold text-slate-600">賣</th>
          <th class="py-1.5 ${subBorderClass} w-[65px] min-w-[65px] text-sm font-extrabold text-slate-800">結</th>
        `;
      });
      headerDates.innerHTML = datesHtml;
      headerSub.innerHTML = subHtml;
    }

    function changeSortMode(val) {
      currentSortMode = val;
      applyFilters();
    }

    async function autoLoadAndSyncExcelList() {
      try {
        const response = await fetch(EXCEL_SOURCE_URL);
        if (!response.ok) throw new Error();
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        const stockMap = new Map();
        workbook.SheetNames.forEach(sheetName => {
          const worksheet = workbook.Sheets[sheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet);
          jsonData.forEach(row => {
            const stockId = String(row['股票代號'] || row['代號'] || '').trim();
            const stockName = String(row['股票名稱'] || row['名稱'] || '').trim();
            if (stockId && stockName) {
              if (stockMap.has(stockId)) {
                const item = stockMap.get(stockId);
                if (!item.sheet_tags.includes(sheetName)) item.sheet_tags.push(sheetName);
              } else {
                stockMap.set(stockId, { stock_id: stockId, stock_name: stockName, sheet_tags: [sheetName], updated_at: new Date().toISOString() });
              }
            }
          });
        });
        const rowsToUpload = Array.from(stockMap.values());
        if (rowsToUpload.length > 0) {
          await supabaseClient.from('stock_targets').upsert(rowsToUpload, { onConflict: 'stock_id' });
        }
        
        const { data: dbData } = await supabaseClient.from('stock_targets').select('stock_id, stock_name, sheet_tags').order('stock_id', { ascending: true });
        dbStockData = dbData || [];
        
        document.getElementById("listUpdateTime").innerText = new Date().toLocaleDateString();

        targetSheetsSet.clear();
        dbStockData.forEach(item => { if (Array.isArray(item.sheet_tags)) item.sheet_tags.forEach(tag => targetSheetsSet.add(tag)); });
        updateTabButtons(Array.from(targetSheetsSet));
      } catch (err) {
        const { data: dbData } = await supabaseClient.from('stock_targets').select('stock_id, stock_name, sheet_tags').order('stock_id', { ascending: true });
        dbStockData = dbData || [];
      }
    }

    function updateTabButtons(sheets) {
      const container = document.getElementById("tabContainer");
      container.innerHTML = `<button onclick="switchTab('全部')" id="tab-全部" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-xs whitespace-nowrap cursor-pointer transition-colors">🌐 全部成分股</button>`;
      sheets.forEach(sheet => {
        const theme = colorThemes[sheet] || colorThemes['預設'];
        container.innerHTML += `<button onclick="switchTab('${sheet}')" id="tab-${sheet}" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.inactive} whitespace-nowrap transition-colors cursor-pointer">📁 ${sheet}</button>`;
      });
      setActiveTabUI();
    }

    function switchTab(sheetName) {
      currentSourceTab = sheetName;
      applyFilters();
    }

    function setActiveTabUI() {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        const id = btn.id.replace('tab-', '');
        const theme = colorThemes[id] || colorThemes['預設'];
        btn.className = `tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.inactive} whitespace-nowrap transition-colors cursor-pointer`;
      });
      const activeBtn = document.getElementById(`tab-${currentSourceTab}`);
      if (activeBtn) {
        const theme = colorThemes[currentSourceTab] || colorThemes['預設'];
        activeBtn.className = `tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.active} whitespace-nowrap cursor-pointer`;
      }
    }

    function applyFilters() {
      setActiveTabUI();
      let filteredStocks = [...dbStockData];
      if (currentSourceTab !== '全部') {
        filteredStocks = dbStockData.filter(item => Array.isArray(item.sheet_tags) && item.sheet_tags.includes(currentSourceTab));
      }
      
      filteredStocks.sort((a, b) => {
        if (currentSortMode === 'stock_id') {
          return a.stock_id.localeCompare(b.stock_id, undefined, { numeric: true, sensitivity: 'base' });
        }

        const getSumForStock = (stockId, targetLegal) => {
          const chips = globalChipCache.filter(c => c.stock_id === stockId && c.legal_name === targetLegal && recentDates.includes(c.date));
          return chips.reduce((acc, row) => {
            const buy = Math.round((row.buy || 0) / 1000);
            const sell = Math.round((row.sell || 0) / 1000);
            return acc + (buy - sell);
          }, 0);
        };

        let valA = 0, valB = 0;
        
        if (currentSortMode.startsWith('foreign_buy')) {
          valA = getSumForStock(a.stock_id, 'Foreign_Investor');
          valB = getSumForStock(b.stock_id, 'Foreign_Investor');
          return valB - valA;
        } else if (currentSortMode.startsWith('foreign_dealer_buy')) {
          valA = getSumForStock(a.stock_id, 'Foreign_Dealer_Self');
          valB = getSumForStock(b.stock_id, 'Foreign_Dealer_Self');
          return valB - valA;
        } else if (currentSortMode.startsWith('investment_buy')) {
          valA = getSumForStock(a.stock_id, 'Investment_Trust');
          valB = getSumForStock(b.stock_id, 'Investment_Trust');
          return valB - valA;
        } else if (currentSortMode.startsWith('dealer_self_buy')) {
          valA = getSumForStock(a.stock_id, 'Dealer_self');
          valB = getSumForStock(b.stock_id, 'Dealer_self');
          return valB - valA;
        } else if (currentSortMode.startsWith('dealer_hedging_buy')) {
          valA = getSumForStock(a.stock_id, 'Dealer_Hedging');
          valB = getSumForStock(b.stock_id, 'Dealer_Hedging');
          return valB - valA;
        } else if (currentSortMode.startsWith('foreign_sell')) {
          valA = getSumForStock(a.stock_id, 'Foreign_Investor');
          valB = getSumForStock(b.stock_id, 'Foreign_Investor');
          return valA - valB;
        } else if (currentSortMode.startsWith('foreign_dealer_sell')) {
          valA = getSumForStock(a.stock_id, 'Foreign_Dealer_Self');
          valB = getSumForStock(b.stock_id, 'Foreign_Dealer_Self');
          return valA - valB;
        } else if (currentSortMode.startsWith('investment_sell')) {
          valA = getSumForStock(a.stock_id, 'Investment_Trust');
          valB = getSumForStock(b.stock_id, 'Investment_Trust');
          return valA - valB;
        } else if (currentSortMode.startsWith('dealer_self_sell')) {
          valA = getSumForStock(a.stock_id, 'Dealer_self');
          valB = getSumForStock(b.stock_id, 'Dealer_self');
          return valA - valB;
        } else if (currentSortMode.startsWith('dealer_hedging_sell')) {
          valA = getSumForStock(a.stock_id, 'Dealer_Hedging');
          valB = getSumForStock(b.stock_id, 'Dealer_Hedging');
          return valA - valB;
        }
        return 0;
      });

      renderMatrixTableFromCache(filteredStocks);
    }

    function renderMatrixTableFromCache(stocks) {
      document.getElementById("recordCount").innerText = stocks.length;
      const tbody = document.getElementById("stockTableBody");
      if (!tbody) return;
      let htmlString = "";

      stocks.forEach(item => {
        const stockChips = globalChipCache.filter(c => c.stock_id === item.stock_id);

        let chipMap = {
          foreign: {}, foreignDealer: {}, investment: {}, dealerSelf: {} , dealerHedging: {}
        };
        
        recentDates.forEach(d => {
          chipMap.foreign[d] = { buy: 0, sell: 0 };
          chipMap.foreignDealer[d] = { buy: 0, sell: 0 };
          chipMap.investment[d] = { buy: 0, sell: 0 };
          chipMap.dealerSelf[d] = { buy: 0, sell: 0 };
          chipMap.dealerHedging[d] = { buy: 0, sell: 0 };
        });

        stockChips.forEach(row => {
          const d = row.date;
          if(!chipMap.foreign[d]) return; // 若不在前5日內則濾除
          
          const b = Math.round((row.buy || 0) / 1000);
          const s = Math.round((row.sell || 0) / 1000);

          if (row.legal_name === 'Foreign_Investor') { chipMap.foreign[d] = { buy: b, sell: s }; }
          else if (row.legal_name === 'Foreign_Dealer_Self') { chipMap.foreignDealer[d] = { buy: b, sell: s }; }
          else if (row.legal_name === 'Investment_Trust') { chipMap.investment[d] = { buy: b, sell: s }; }
          else if (row.legal_name === 'Dealer_self') { chipMap.dealerSelf[d] = { buy: b, sell: s }; }
          else if (row.legal_name === 'Dealer_Hedging') { chipMap.dealerHedging[d] = { buy: b, sell: s }; }
        });

        const sumFin = recentDates.reduce((acc, d) => acc + ((chipMap.foreign[d]?.buy || 0) - (chipMap.foreign[d]?.sell || 0)), 0);
        const sumFinDea = recentDates.reduce((acc, d) => acc + ((chipMap.foreignDealer[d]?.buy || 0) - (chipMap.foreignDealer[d]?.sell || 0)), 0);
        const sumInv = recentDates.reduce((acc, d) => acc + ((chipMap.investment[d]?.buy || 0) - (chipMap.investment[d]?.sell || 0)), 0);
        const sumDeaSelf = recentDates.reduce((acc, d) => acc + ((chipMap.dealerSelf[d]?.buy || 0) - (chipMap.dealerSelf[d]?.sell || 0)), 0);
        const sumDeaHed = recentDates.reduce((acc, d) => acc + ((chipMap.dealerHedging[d]?.buy || 0) - (chipMap.dealerHedging[d]?.sell || 0)), 0);

        const getCell = (buy, sell) => {
          const net = buy - sell;
          let netHtml = `<td class="py-2.5 border-r border-slate-300 text-slate-400 font-bold text-sm">0</td>`;
          if (net > 0) netHtml = `<td class="py-2.5 border-r border-slate-300 font-black bg-red-50 text-red-600 text-sm">+${net}</td>`;
          if (net < 0) netHtml = `<td class="py-2.5 border-r border-slate-300 font-black bg-green-50 text-green-600 text-sm">${net}</td>`;
          return `<td class="py-2.5 border-r border-slate-200 text-emerald-600 font-bold text-sm">${buy}</td><td class="py-2.5 border-r border-slate-200 text-rose-600 font-bold text-sm">${sell}</td>${netHtml}`;
        };

        const getSumCell = (val, isDarkRow) => {
          const bgClass = isDarkRow ? 'bg-amber-50/70' : 'bg-amber-50';
          if (val > 0) return `<td class="py-2.5 border-r border-slate-300 font-black text-rose-700 text-sm sticky left-[142px] z-20 ${bgClass} sticky-col-shadow text-center">+${val}</td>`;
          if (val < 0) return `<td class="py-2.5 border-r border-slate-300 font-black text-emerald-700 text-sm sticky left-[142px] z-20 ${bgClass} sticky-col-shadow text-center">${val}</td>`;
          return `<td class="py-2.5 border-r border-slate-300 font-bold text-slate-500 text-sm sticky left-[142px] z-20 ${bgClass} sticky-col-shadow text-center">0</td>`;
        };

        let fRow = "", fdRow = "", iRow = "", dsRow = "", dhRow = "";
        recentDates.forEach(d => {
          fRow += getCell(chipMap.foreign[d]?.buy || 0, chipMap.foreign[d]?.sell || 0);
          fdRow += getCell(chipMap.foreignDealer[d]?.buy || 0, chipMap.foreignDealer[d]?.sell || 0);
          iRow += getCell(chipMap.investment[d]?.buy || 0, chipMap.investment[d]?.sell || 0);
          dsRow += getCell(chipMap.dealerSelf[d]?.buy || 0, chipMap.dealerSelf[d]?.sell || 0);
          dhRow += getCell(chipMap.dealerHedging[d]?.buy || 0, chipMap.dealerHedging[d]?.sell || 0);
        });

        htmlString += `
          <tr class="border-t-2 border-slate-300 hover:bg-slate-50/50">
            <td rowspan="5" class="px-1 py-4 border-r border-slate-300 font-mono text-slate-900 bg-slate-100 sticky left-0 z-20 text-center leading-tight w-[90px] max-w-[90px] overflow-hidden">
              <div class="text-sm font-black tracking-tighter text-slate-950">${item.stock_id}</div>
              <div class="text-[11px] text-slate-600 font-sans mt-0.5 font-extrabold truncate tracking-tighter">${item.stock_name}</div>
            </td>
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[90px] z-20 text-center w-[52px]">外資</td>
            ${getSumCell(sumFin, false)}${fRow}
          </tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-100 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[90px] z-20 text-center w-[52px]">外資自營</td>
            ${getSumCell(sumFinDea, true)}${fdRow}
          </tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[90px] z-20 text-center w-[52px]">投信</td>
            ${getSumCell(sumInv, false)}${iRow}
          </tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-100 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[90px] z-20 text-center w-[52px]">自營(自)</td>
            ${getSumCell(sumDeaSelf, true)}${dsRow}
          </tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[90px] z-20 text-center w-[52px]">自營(避)</td>
            ${getSumCell(sumDeaHed, false)}${dhRow}
          </tr>
        `;
      });

      tbody.innerHTML = htmlString;
      document.getElementById("dataSourceLabel").innerText = "🟢 數據狀態：Supabase 雲端快取精準分批供應中";
    }
  </script>
</body>
</html>
