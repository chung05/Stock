<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>牛牛分析站 - 智慧過濾籌碼寬資版</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    .sticky-col-shadow { box-shadow: 3px 0 6px -3px rgba(0, 0, 0, 0.25); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <div id="loadingModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full mx-4 text-center border border-slate-100 flex flex-col items-center">
      <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
      <h3 class="text-base font-bold text-slate-900 mb-1">雲端籌碼智慧同步中...</h3>
      <p id="loadingDetail" class="text-xs text-slate-500 font-medium">安全連線中...</p>
    </div>
  </div>

  <div id="newsModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 px-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-6xl w-full max-h-[90vh] min-h-[550px] md:min-h-0 flex flex-col border border-slate-100 overflow-hidden">
      <div class="py-2 px-4 border-b border-slate-200 flex items-center justify-between bg-slate-50 rounded-t-2xl shrink-0">
        <h3 id="newsModalTitle" class="text-base font-black text-slate-900">個股詳細資訊</h3>
        <button onclick="closeNewsModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold cursor-pointer p-1">✕</button>
      </div>

      <div id="modalIndicatorBar" class="bg-linear-to-r from-slate-50 to-slate-100 border-b border-slate-200 px-4 py-2.5 grid grid-cols-3 sm:grid-cols-6 gap-2 shrink-0 text-center">
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs">
          <div class="text-[10px] font-bold text-slate-400">目前股價</div>
          <div id="modalInfoPrice" class="text-xs font-black text-slate-800">--</div>
        </div>
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs">
          <div class="text-[10px] font-bold text-slate-400">今日漲跌</div>
          <div id="modalInfoChange" class="text-xs font-black text-slate-800">--</div>
        </div>
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs">
          <div class="text-[10px] font-bold text-slate-400">MA10 均線</div>
          <div id="modalInfoMA10" class="text-xs font-black text-blue-600">--</div>
        </div>
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs">
          <div class="text-[10px] font-bold text-slate-400">MA20 均線</div>
          <div id="modalInfoMA20" class="text-xs font-black text-orange-600">--</div>
        </div>
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs">
          <div class="text-[10px] font-bold text-slate-400">RSI14 強弱</div>
          <div id="modalInfoRSI14" class="text-xs font-black text-purple-600">--</div>
        </div>
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs">
          <div class="text-[10px] font-bold text-slate-400">MACD 動能</div>
          <div id="modalInfoMACD" class="text-xs font-black text-slate-800">--</div>
        </div>
      </div>

      <div class="flex border-b border-slate-200 bg-slate-50/50 px-4 shrink-0">
        <button id="tabBtnTrend" onclick="switchModalTab('trend')" class="py-1.5 px-4 text-sm font-black border-b-2 border-blue-600 text-blue-600 focus:outline-none cursor-pointer transition-all">📈 近期走勢</button>
        <button id="tabBtnNews" onclick="switchModalTab('news')" class="py-1.5 px-4 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 focus:outline-none cursor-pointer transition-all">📰 財經新聞</button>
      </div>
      
      <div class="p-4 overflow-y-auto h-[500px] md:h-auto md:grow bg-slate-50/30 relative flex flex-col">
        <div id="trendZone" class="block space-y-4 w-full grow">
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs">
            <h4 class="text-xs font-black text-slate-500 mb-1 flex items-center gap-1">🔹 股價走勢</h4>
            <div id="priceScrollWrapper" class="w-full overflow-x-auto pb-2 scrollbar-thin">
              <div class="min-w-[960px] px-1">
                <div id="trendPriceChart" class="flex items-end justify-between h-24 pt-4 border-b border-slate-200 relative w-full"></div>
                <div id="trendPriceDates" class="flex justify-between font-black mt-1.5 w-full"></div>
              </div>
            </div>
          </div>
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs">
            <div class="flex justify-between items-center border-b border-slate-100 pb-1 mb-1">
              <h4 class="text-xs font-black text-slate-500 flex items-center gap-1">🔹 三大法人 (張)</h4>
              <div class="flex bg-slate-100 p-0.5 rounded-lg border border-slate-200">
                <button id="subTabF" onclick="switchChipSubTab('f')" class="px-3 py-1 text-xs font-black bg-white text-slate-900 rounded-md shadow-2xs cursor-pointer transition-all">外資</button>
                <button id="subTabIT" onclick="switchChipSubTab('it')" class="px-3 py-1 text-xs font-bold text-slate-500 hover:text-slate-800 rounded-md cursor-pointer transition-all">投信</button>
                <button id="subTabDS" onclick="switchChipSubTab('ds')" class="px-3 py-1 text-xs font-bold text-slate-500 hover:text-slate-800 rounded-md cursor-pointer transition-all">自營商</button>
              </div>
            </div>
            <div class="w-full overflow-x-auto pb-2 scrollbar-thin">
              <div id="trendChipChart" class="w-full min-w-[960px]"></div>
            </div>
          </div>
        </div>
        <div id="newsZone" class="hidden h-full w-full overflow-y-auto grow">
          <div id="newsListZone" class="space-y-3 block w-full"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="sticky top-0 z-40 bg-linear-to-r from-sky-400 via-cyan-400 to-blue-400 text-slate-900 py-3 shadow-md border-b border-sky-300/30 px-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0 shrink-0">
        <h1 class="text-lg md:text-xl font-extrabold tracking-tight text-slate-950 whitespace-nowrap">牛牛分析站</h1>
      </div>
      <button onclick="forceSyncFlow()" class="cursor-pointer bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-xs whitespace-nowrap flex items-center justify-center gap-1">⚡ 更新</button>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 pt-4 pb-12">
    <section class="bg-white p-3 rounded-xl shadow-xs border border-slate-200 mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="flex items-center gap-3 grow sm:max-w-xl">
        <select id="tabSelect" onchange="switchTab(this.value)" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs font-bold text-slate-700 cursor-pointer">
          <option value="全部">🌐 全部成分股</option>
        </select>
        <span class="text-xs text-slate-500 font-semibold whitespace-nowrap">共有: <span id="recordCount" class="font-bold text-sm text-blue-600">0</span> 檔</span>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <input type="text" id="keywordInput" onkeyup="handleSearchKeyup(event)" placeholder="代號/名稱..." class="w-36 bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs" />
        <button onclick="executeStockSearch()" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">🔍</button>
      </div>
    </section>

    <section id="mainTableWrapper" class="bg-white rounded-xl shadow-md border border-slate-300 overflow-auto max-h-[72vh] relative">
      <table class="min-w-full text-center text-sm text-slate-700 border-collapse table-fixed">
        <thead class="text-slate-800 font-extrabold sticky top-0 z-30 bg-slate-100 shadow-xs border-b border-slate-300">
          <tr id="tableHeaderDates"></tr>
          <tr id="tableHeaderSub" class="text-xs text-slate-500 bg-slate-50/80"></tr>
        </thead>
        <tbody id="stockTableBody" class="bg-white"></tbody>
      </table>
    </section>
  </div>

  <script>
    const SUPABASE_URL = "https://fekesirsqjbkrgaibrjf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZla2VzaXJzcWpia3JnYWlicmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTY0MjUsImV4cCI6MjA5NDU5MjQyNX0.82wBFq-B8cxfK9h_gkJQgIpMEabke1EhB6Oacw2lonc";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let dbStockData = [], globalChipCache = [], recentDates = [], extendedTrendDates = [], currentSourceTab = '全部', currentSortMode = 'investment_buy', currentSumDaysMode = 5, searchKeyword = "", currentActiveStockId = "", currentChipSubTab = "f";   

    function getValIgnoreCase(obj, targetKey) {
      if (!obj) return null;
      const actualKey = Object.keys(obj).find(k => k.toLowerCase() === targetKey.toLowerCase());
      return actualKey ? obj[actualKey] : null;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      calculateTradeDaysLists(); renderTableHeader(); await forceSyncFlow(); 
    });

    async function forceSyncFlow() {
      const modal = document.getElementById("loadingModal");
      modal.classList.remove("hidden");
      try {
        const { data: dbData } = await supabaseClient.from('stock_targets').select('*').order('stock_id', { ascending: true });
        dbStockData = dbData || [];
        await fetchAllChipsFromSupabase();
        renderTableHeader(); applyFilters();
      } finally { modal.classList.add("hidden"); }
    }

    async function fetchAllChipsFromSupabase() {
      let allChipsFetched = [];
      const stockIds = dbStockData.map(s => String(s.stock_id).trim());
      for (let i = 0; i < stockIds.length; i += 50) {
        const chunkIds = stockIds.slice(i, i + 50);
        const { data } = await supabaseClient.from('stock_chips_daily').select('*, macd_dif, macd_signal, macd_osc').in('stock_id', chunkIds).in('date', extendedTrendDates); 
        if (data) allChipsFetched = allChipsFetched.concat(data);
      }
      globalChipCache = allChipsFetched;
    }

    function renderMatrixTableFromCache(stocks) {
      document.getElementById("recordCount").innerText = stocks.length;
      const tbody = document.getElementById("stockTableBody");
      let htmlString = "";
      stocks.forEach(item => {
        const myChips = globalChipCache.filter(c => String(c.stock_id).trim() === String(item.stock_id).trim());
        let currentPrice = "--", mainMA10 = "--", mainMA20 = "--", mainRSI14 = "--", mainMACDOsc = "--";
        for (let d of recentDates) {
          const dayData = myChips.find(c => String(c.date) === d);
          if (dayData && dayData.price) {
            currentPrice = dayData.price;
            mainMA10 = dayData.ma10 || "--"; mainMA20 = dayData.ma20 || "--"; mainRSI14 = dayData.rsi14 || "--";
            mainMACDOsc = getValIgnoreCase(dayData, 'macd_osc') ?? "--";
            break;
          }
        }
        let macdHtml = `<span class="text-slate-950 ml-1 grow text-right">${mainMACDOsc}</span>`;
        if (mainMACDOsc !== "--") {
          if (mainMACDOsc > 0) macdHtml = `<span class="text-rose-600 ml-1 grow text-right font-black">▲${mainMACDOsc}</span>`;
          else if (mainMACDOsc < 0) macdHtml = `<span class="text-emerald-600 ml-1 grow text-right font-black">▼${Math.abs(mainMACDOsc)}</span>`;
        }
        htmlString += `<tr><td onclick="openCombinedModal('${item.stock_id}')" class="cursor-pointer border-r border-slate-300">${item.stock_id}<div class="text-teal-600 font-bold">MACD: ${macdHtml}</div></td></tr>`;
      });
      tbody.innerHTML = htmlString;
    }
    // ... (其他原有邏輯省略)
  </script>
</body>
</html>
