    function calculateRecentFiveTradeDays() {
      let dates = [];
      let d = new Date();
      while(dates.length < 5) {
        let day = d.getDay();
        if (day !== 0 && day !== 6) { 
          dates.push(formatDateToString(d));
        }
        d.setDate(d.getDate() - 1);
      }
      recentDates = dates; 
      document.getElementById("chipUpdateTime").innerText = recentDates[0];
    }

    async function forceSyncFlow() {
      const modal = document.getElementById("loadingModal");
      const detailText = document.getElementById("loadingDetail");
      modal.classList.remove("hidden");

      try {
        detailText.innerText = "1. 比對 Excel 標的名單...";
        await autoLoadAndSyncExcelList();

        detailText.innerText = "2. 檢查並補抓雲端籌碼 (FinMind 寬資料格式)...";
        await handleSmartBackfillFlow();

        detailText.innerText = "3. 自動定位最新寬資料開盤日...";
        calculateRecentFiveTradeDays();

        detailText.innerText = "4. 分批合法倒出完整新表籌碼...";
        await fetchAllChipsFromSupabase();

        detailText.innerText = "5. 正在佈局視覺矩陣...";
        renderTableHeader();
        applyFilters();

      } catch (err) {
        console.error("同步總流程發生未預期錯誤:", err);
      } finally {
        modal.classList.add("hidden");
      }
    }

    async function fetchAllChipsFromSupabase() {
      if (recentDates.length === 0 || dbStockData.length === 0) return;
      const detailText = document.getElementById("loadingDetail");
      const stockIdsInList = dbStockData.map(s => s.stock_id);
      
      let allChipsFetched = [];
      let startRange = 0;
      const batchSize = 3000;
      let keepFetching = true;

      while (keepFetching) {
        let endRange = startRange + batchSize - 1;
        detailText.innerText = `4. 分批載入雲端寬數據中 (${startRange} ~ ${endRange} 筆)...`;

        const { data, error } = await supabaseClient
          .from('stock_chips_daily')
          .select('*')
          .in('stock_id', stockIdsInList)
          .in('date', recentDates)
          .range(startRange, endRange);

        if (error) {
          console.error("分批讀取寬表雲端快取異常:", error);
          break;
        }

        if (data && data.length > 0) {
          allChipsFetched = allChipsFetched.concat(data);
          if (data.length < batchSize) {
            keepFetching = false;
          } else {
            startRange += batchSize;
          }
        } else {
          keepFetching = false;
        }
      }

      globalChipCache = allChipsFetched;
      console.log(`🎉 寬資料總計分批撈取完成！共計：${globalChipCache.length} 筆`);
    }

    async function handleSmartBackfillFlow() {
      const statusText = document.getElementById("uploadStatus");
      const detailText = document.getElementById("loadingDetail");
      const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

      if (dbStockData.length === 0) return;
      
      const startDateStr = recentDates[recentDates.length - 1];
      const endDateStr = recentDates[0];

      statusText.innerText = `🔄 正在核對雲端 5 日寬資料完整度...`;

      const { data: existingRows } = await supabaseClient
        .from('stock_chips_daily')
        .select('stock_id, date')
        .in('stock_id', dbStockData.map(s => s.stock_id))
        .in('date', recentDates);

      const existingSet = new Set((existingRows || []).map(r => `${r.stock_id}_${r.date}`));

      for (let i = 0; i < dbStockData.length; i++) {
        const stock = dbStockData[i];
        let isMissing = false;
        for (let d of recentDates) {
          if (!existingSet.has(`${stock.stock_id}_${d}`)) {
            isMissing = true;
            break;
          }
        }

        if (!isMissing) continue; 

        detailText.innerText = `[寬資料精準同步] ${stock.stock_id} ${stock.stock_name} (${i+1}/${dbStockData.length})`;

        try {
          const apiUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInstitutionalInvestorsBuySell&data_id=${stock.stock_id}&start_date=${startDateStr}&end_date=${endDateStr}&token=${FINMIND_TOKEN}`;
          const res = await fetch(apiUrl);
          if (res.status === 429) { await sleep(4000); i--; continue; } 
          
          const resJson = await res.json();
          if (resJson.status === 200 && Array.isArray(resJson.data) && resJson.data.length > 0) {
            
            const dateMap = {};
            resJson.data.forEach(row => {
              const d = row.date;
              if (!dateMap[d]) {
                dateMap[d] = { stock_id: stock.stock_id, date: d, f_buy:0, f_sell:0, fd_buy:0, fd_sell:0, it_buy:0, it_sell:0, ds_buy:0, ds_sell:0, dh_buy:0, dh_sell:0 };
              }
              if (row.name === 'Foreign_Investor') { dateMap[d].f_buy = row.buy; dateMap[d].f_sell = row.sell; }
              else if (row.name === 'Foreign_Dealer_Self') { dateMap[d].fd_buy = row.buy; dateMap[d].fd_sell = row.sell; }
              else if (row.name === 'Investment_Trust') { dateMap[d].it_buy = row.buy; dateMap[d].it_sell = row.sell; }
              else if (row.name === 'Dealer_self') { dateMap[d].ds_buy = row.buy; dateMap[d].ds_sell = row.sell; }
              else if (row.name === 'Dealer_Hedging') { dateMap[d].dh_buy = row.buy; dateMap[d].dh_sell = row.sell; }
            });

            const rowsToUpsert = Object.values(dateMap);
            if (rowsToUpsert.length > 0) {
              await supabaseClient.from('stock_chips_daily').upsert(rowsToUpsert);
            }
          }
        } catch (err) {
          console.error(err);
        }
        await sleep(300); 
      }
      statusText.innerText = "✅ 智慧區間補抓與雲端儲存全數完成！";
      document.getElementById("dataSourceLabel").innerText = "🟢 數據狀態：Supabase 雲端寬資料快取供應中";
    }

    function formatDateToString(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

      headerDates.innerHTML = datesHtml;
      headerSub.innerHTML = subHtml;

    function changeSortMode(val) {
      currentSortMode = val;
      applyFilters();

    async function autoLoadAndSyncExcelList() {
      try {
        const response = await fetch(EXCEL_SOURCE_URL);
        if (!response.ok) throw new Error();
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        const stockMap = new Map();
        
        workbook.SheetNames.forEach(sheetName => {
          const worksheet = workbook.Sheets[sheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet);
          jsonData.forEach(row => {
            const stockId = String(row['股票代號'] || row['代號'] || '').trim();
            const stockName = String(row['股票名稱'] || row['名稱'] || '').trim();
            if (stockId && stockName) {
              if (stockMap.has(stockId)) {
                const item = stockMap.get(stockId);
                if (!item.sheet_tags.includes(sheetName)) item.sheet_tags.push(sheetName);
              } else {
                stockMap.set(stockId, { stock_id: stockId, stock_name: stockName, sheet_tags: [sheetName], updated_at: new Date().toISOString() });
              }
            }
          });
        });

        const rowsToUpload = Array.from(stockMap.values());
        if (rowsToUpload.length > 0) {
          await supabaseClient.from('stock_targets').upsert(rowsToUpload, { onConflict: 'stock_id' });
        }
        
        const { data: dbData } = await supabaseClient.from('stock_targets').select('stock_id, stock_name, sheet_tags').order('stock_id', { ascending: true });
        dbStockData = dbData || [];
        
        document.getElementById("listUpdateTime").innerText = new Date().toLocaleDateString();

        targetSheetsSet.clear();
        dbStockData.forEach(item => { if (Array.isArray(item.sheet_tags)) item.sheet_tags.forEach(tag => targetSheetsSet.add(tag)); });
        updateTabButtons(Array.from(targetSheetsSet));
      } catch (err) {
        const { data: dbData } = await supabaseClient.from('stock_targets').select('stock_id, stock_name, sheet_tags').order('stock_id', { ascending: true });
        dbStockData = dbData || [];
      }
    }

    function updateTabButtons(sheets) {
      const container = document.getElementById("tabContainer");
      container.innerHTML = `<button onclick="switchTab('全部')" id="tab-全部" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-xs whitespace-nowrap cursor-pointer transition-colors">🌐 全部成分股</button>`;
      sheets.forEach(sheet => {
        const theme = colorThemes[sheet] || colorThemes['預設'];
        container.innerHTML += `<button onclick="switchTab('${sheet}')" id="tab-${sheet}" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.inactive} whitespace-nowrap transition-colors cursor-pointer">📁 ${sheet}</button>`;
      });
      setActiveTabUI();
    }

      currentSourceTab = sheetName;
      applyFilters();

    function setActiveTabUI() {
      document.querySelectorAll(".tab-btn").forEach(btn => {
        const id = btn.id.replace('tab-', '');
        const theme = colorThemes[id] || colorThemes['預設'];
        btn.className = `tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.inactive} whitespace-nowrap transition-colors cursor-pointer`;
      });
      const activeBtn = document.getElementById(`tab-${currentSourceTab}`);
      if (activeBtn) {
        const theme = colorThemes[currentSourceTab] || colorThemes['預設'];
        activeBtn.className = `tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.active} whitespace-nowrap cursor-pointer`;
      }
    }

    function executeStockSearch() {
      const input = document.getElementById("keywordInput");
      searchKeyword = input.value.trim().toLowerCase();
      applyFilters();
    }

    // 新增：清除搜尋欄位
    function clearSearchField() {
      const input = document.getElementById("keywordInput");
      input.value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      searchKeyword = "";
      applyFilters();
    }

    function applyFilters() {
      setActiveTabUI();
      let filteredStocks = [...dbStockData];
      
      // 1. 先過濾分類頁籤
      if (currentSourceTab !== '全部') {
        filteredStocks = dbStockData.filter(item => Array.isArray(item.sheet_tags) && item.sheet_tags.includes(currentSourceTab));
      }
      
      // 2. 新增：再過濾關鍵字搜尋（支援模糊匹配股票代號或名稱）
      if (searchKeyword !== "") {
        filteredStocks = filteredStocks.filter(item => 
          item.stock_id.toLowerCase().includes(searchKeyword) || 
          item.stock_name.toLowerCase().includes(searchKeyword)
        );
      }
      
      filteredStocks.sort((a, b) => {
        if (currentSortMode === 'stock_id') {
          return a.stock_id.localeCompare(b.stock_id, undefined, { numeric: true, sensitivity: 'base' });
        }

        const getSumForStock = (stockId, buyField, sellField) => {
          const chips = globalChipCache.filter(c => c.stock_id === stockId);
          return chips.reduce((acc, row) => {
            const buy = Math.round((row[buyField] || 0) / 1000);
            const sell = Math.round((row[sellField] || 0) / 1000);
            return acc + (buy - sell);
          }, 0);
        };

        let valA = 0, valB = 0;
        switch (currentSortMode) {
          case 'foreign_buy':
            valA = getSumForStock(a.stock_id, 'f_buy', 'f_sell');
            valB = getSumForStock(b.stock_id, 'f_buy', 'f_sell');
            return valB - valA; 
          case 'foreign_dealer_buy':
            valA = getSumForStock(a.stock_id, 'fd_buy', 'fd_sell');
            valB = getSumForStock(b.stock_id, 'fd_buy', 'fd_sell');
            return valB - valA;
          case 'investment_buy':
            valA = getSumForStock(a.stock_id, 'it_buy', 'it_sell');
            valB = getSumForStock(b.stock_id, 'it_buy', 'it_sell');
            return valB - valA;
          case 'dealer_self_buy':
            valA = getSumForStock(a.stock_id, 'ds_buy', 'ds_sell');
            valB = getSumForStock(b.stock_id, 'ds_buy', 'ds_sell');
            return valB - valA;
          case 'dealer_hedging_buy':
            valA = getSumForStock(a.stock_id, 'dh_buy', 'dh_sell');
            valB = getSumForStock(b.stock_id, 'dh_buy', 'dh_sell');
            return valB - valA;
          case 'foreign_sell':
            valA = getSumForStock(a.stock_id, 'f_buy', 'f_sell');
            valB = getSumForStock(b.stock_id, 'f_buy', 'f_sell');
            return valA - valB; 
          case 'foreign_dealer_sell':
            valA = getSumForStock(a.stock_id, 'fd_buy', 'fd_sell');
            valB = getSumForStock(b.stock_id, 'fd_buy', 'fd_sell');
            return valA - valB;
          case 'investment_sell':
            valA = getSumForStock(a.stock_id, 'it_buy', 'it_sell');
            valB = getSumForStock(b.stock_id, 'it_buy', 'it_sell');
            return valA - valB;
          case 'dealer_self_sell':
            valA = getSumForStock(a.stock_id, 'ds_buy', 'ds_sell');
            valB = getSumForStock(b.stock_id, 'ds_buy', 'ds_sell');
            return valA - valB;
          case 'dealer_hedging_sell':
            valA = getSumForStock(a.stock_id, 'dh_buy', 'dh_sell');
            valB = getSumForStock(b.stock_id, 'dh_buy', 'dh_sell');
            return valA - valB;
          default:
            return 0;
        }
      });

      renderMatrixTableFromCache(filteredStocks);
    }

    function renderMatrixTableFromCache(stocks) {
      document.getElementById("recordCount").innerText = stocks.length;
      const tbody = document.getElementById("stockTableBody");
      if (!tbody) return;
      let htmlString = "";

      stocks.forEach(item => {
        const myChips = globalChipCache.filter(c => c.stock_id === item.stock_id);

        let sumF = 0, sumFD = 0, sumIT = 0, sumDS = 0, sumDH = 0;
        let fRow = "", fdRow = "", iRow = "", dsRow = "", dhRow = "";

        const getCell = (b, s) => {
          const buy = Math.round(b / 1000);
          const sell = Math.round(s / 1000);
          const net = buy - sell;
          let netHtml = `<td class="py-2.5 border-r border-slate-300 text-slate-400 font-bold text-sm">0</td>`;
          if (net > 0) netHtml = `<td class="py-2.5 border-r border-slate-300 font-black bg-red-50 text-red-600 text-sm">+${net}</td>`;
          if (net < 0) netHtml = `<td class="py-2.5 border-r border-slate-300 font-black bg-green-50 text-green-600 text-sm">${net}</td>`;
          return `<td class="py-2.5 border-r border-slate-200 text-emerald-600 font-bold text-xs">${buy}</td><td class="py-2.5 border-r border-slate-200 text-rose-600 font-bold text-xs">${sell}</td>${netHtml}`;
        };

        recentDates.forEach(d => {
          const dayData = myChips.find(c => c.date === d) || { f_buy:0, f_sell:0, fd_buy:0, fd_sell:0, it_buy:0, it_sell:0, ds_buy:0, ds_sell:0, dh_buy:0, dh_sell:0 };
          
          sumF += (Math.round(dayData.f_buy/1000) - Math.round(dayData.f_sell/1000));
          sumFD += (Math.round(dayData.fd_buy/1000) - Math.round(dayData.fd_sell/1000));
          sumIT += (Math.round(dayData.it_buy/1000) - Math.round(dayData.it_sell/1000));
          sumDS += (Math.round(dayData.ds_buy/1000) - Math.round(dayData.ds_sell/1000));
          sumDH += (Math.round(dayData.dh_buy/1000) - Math.round(dayData.dh_sell/1000));

          fRow += getCell(dayData.f_buy, dayData.f_sell);
          fdRow += getCell(dayData.fd_buy, dayData.fd_sell);
          iRow += getCell(dayData.it_buy, dayData.it_sell);
          dsRow += getCell(dayData.ds_buy, dayData.ds_sell);
          dhRow += getCell(dayData.dh_buy, dayData.dh_sell);
        });

        const getSumCell = (val, isDarkRow) => {
          const bgClass = isDarkRow ? 'bg-amber-50/70' : 'bg-amber-50';
          if (val > 0) return `<td class="py-2.5 border-r border-slate-300 font-black text-rose-700 text-sm sticky left-[146px] z-20 ${bgClass} sticky-col-shadow text-center">+${val}</td>`;
          if (val < 0) return `<td class="py-2.5 border-r border-slate-300 font-black text-emerald-700 text-sm sticky left-[146px] z-20 ${bgClass} sticky-col-shadow text-center">${val}</td>`;
          return `<td class="py-2.5 border-r border-slate-300 font-bold text-slate-500 text-sm sticky left-[146px] z-20 ${bgClass} sticky-col-shadow text-center">0</td>`;
        };

        // 🚀 此處同步修正了原程式碼中 </tr> 未正確閉合的語法漏洞
        htmlString += `
          <tr class="border-t-2 border-slate-300 hover:bg-slate-50/50">
            <td rowspan="5" class="px-1 py-4 border-r border-slate-300 font-mono text-slate-900 bg-slate-100 sticky left-0 z-20 text-center leading-tight w-[94px] max-w-[94px] overflow-hidden">
              <div class="text-sm font-black tracking-tighter text-slate-950">${item.stock_id}</div>
              <div class="text-[11px] text-slate-600 font-sans mt-0.5 font-extrabold truncate tracking-tighter">${item.stock_name}</div>
            </td>
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[94px] z-20 text-center w-[52px]">外資</td>
            ${getSumCell(sumF, false)}${fRow}
          </tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-100 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[94px] z-20 text-center w-[52px]">外資自營</td>
            ${getSumCell(sumFD, true)}${fdRow}
          </tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[94px] z-20 text-center w-[52px]">投信</td>
            ${getSumCell(sumIT, false)}${iRow}
          </tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-100 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[94px] z-20 text-center w-[52px]">自營(自)</td>
            ${getSumCell(sumDS, true)}${dsRow}
          </tr>
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-extrabold text-xs text-slate-700 whitespace-nowrap sticky left-[94px] z-20 text-center w-[52px]">自營(避)</td>
            ${getSumCell(sumDH, false)}${dhRow}
          </tr>
        `;
      });

      tbody.innerHTML = htmlString;
      document.getElementById("dataSourceLabel").innerText = "🟢 數據狀態：5日寬化庫對接檢查且動態排序渲染完畢";
    }
  </script>
</body>
