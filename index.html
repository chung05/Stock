<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>牛牛分析站</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <div class="bg-linear-to-r from-sky-400 via-cyan-400 to-blue-400 text-slate-900 pb-28 pt-6 shadow-xs border-b border-sky-300/30">
    <div class="max-w-7xl mx-auto px-4 flex flex-col md:flex-row md:justify-between md:items-start gap-4">
      
      <div class="flex items-center gap-3">
        <img src="main_icon.png" alt="牛牛標誌" class="w-[50px] h-[50px] object-contain rounded-lg shadow-xs bg-white/40 p-0.5">
        <div>
          <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-slate-950">牛牛分析站</h1>
          <p class="text-xs text-slate-800/80 font-medium mt-0.5">自動比對 Excel 名單 · 追蹤法人每日籌碼趨勢</p>
        </div>
      </div>
      
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 bg-white/90 backdrop-blur-md p-3 px-4 rounded-xl border border-sky-200 w-full md:w-auto shadow-sm">
        <div class="flex flex-col gap-1 text-xs font-semibold text-slate-600 grow">
          <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
              <span>名單更新：<span id="listUpdateTime" class="text-slate-900 font-bold">載入中...</span></span>
            </div>
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-blue-500"></span>
              <span>法人籌碼：<span id="chipUpdateTime" class="text-slate-900 font-bold">載入中...</span></span>
            </div>
          </div>
          <div class="border-t border-slate-200/60 my-1"></div>
          <div id="uploadStatus" class="text-[11px] text-blue-700 font-bold text-center sm:text-left">系統初始化中...</div>
        </div>
        
        <div class="border-t sm:border-t-0 sm:border-l border-slate-200 pt-2 sm:pt-0 sm:pl-3 flex items-center justify-center">
          <button onclick="autoLoadAndSyncExcel()" class="w-full sm:w-auto cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg text-xs font-bold transition shadow-xs whitespace-nowrap text-center flex items-center justify-center gap-1">
            🔄 同步 Excel
          </button>
        </div>
      </div>
      
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 -mt-16 pb-12">
    
    <section class="bg-white p-3 rounded-xl shadow-md border border-slate-200 mb-4">
      <div class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 px-1">成分股來源分類</div>
      <div class="flex overflow-x-auto gap-2 scrollbar-none" id="tabContainer">
        <button onclick="switchTab('全部')" id="tab-全部" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-xs whitespace-nowrap cursor-pointer transition-colors">
          🌐 全部成分股
        </button>
      </div>
    </section>

    <section class="bg-blue-50 p-3 rounded-xl border border-blue-100 mb-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <div class="text-sm text-slate-700 font-semibold">
        目前分類共有: <span id="recordCount" class="font-bold text-lg text-blue-600">0</span> 檔股票
      </div>
      <div class="text-xs text-slate-400 font-medium">現階段展示：標準法人看盤矩陣面板</div>
    </section>

    <section class="bg-white rounded-xl shadow-md border border-slate-200 overflow-x-auto">
      <table class="min-w-full text-center text-sm text-slate-700 border-collapse">
        <thead class="bg-slate-100 text-slate-800 font-extrabold border-b border-slate-300">
          <tr class="border-b border-slate-200">
            <th rowspan="2" class="px-4 py-3 border-r border-slate-300 bg-slate-200/60 min-w-[120px]">標的 (代號/名稱)</th>
            <th rowspan="2" class="px-2 py-3 border-r border-slate-300 bg-slate-100 font-bold text-xs min-w-[60px]">法人</th>
            <th colspan="3" class="px-4 py-2 border-r border-slate-200 text-sm bg-slate-50">5月15日</th>
            <th colspan="3" class="px-4 py-2 border-r border-slate-200 text-sm bg-slate-50">5月14日</th>
            <th colspan="3" class="px-4 py-2 border-r border-slate-200 text-sm bg-slate-50">5月13日</th>
            <th colspan="3" class="px-4 py-2 border-r border-slate-200 text-sm bg-slate-50">5月12日</th>
            <th colspan="3" class="px-4 py-2 text-sm bg-slate-50">5月11日</th>
          </tr>
          <tr class="text-xs text-slate-500 bg-slate-50/50">
            <th class="py-1.5 border-r border-slate-200 min-w-[55px]">買</th><th class="py-1.5 border-r border-slate-200 min-w-[55px]">賣</th><th class="py-1.5 border-r border-slate-300 bg-slate-100/50 min-w-[60px]">結</th>
            <th class="py-1.5 border-r border-slate-200 min-w-[55px]">買</th><th class="py-1.5 border-r border-slate-200 min-w-[55px]">賣</th><th class="py-1.5 border-r border-slate-300 bg-slate-100/50 min-w-[60px]">結</th>
            <th class="py-1.5 border-r border-slate-200 min-w-[55px]">買</th><th class="py-1.5 border-r border-slate-200 min-w-[55px]">賣</th><th class="py-1.5 border-r border-slate-300 bg-slate-100/50 min-w-[60px]">結</th>
            <th class="py-1.5 border-r border-slate-200 min-w-[55px]">買</th><th class="py-1.5 border-r border-slate-200 min-w-[55px]">賣</th><th class="py-1.5 border-r border-slate-300 bg-slate-100/50 min-w-[60px]">結</th>
            <th class="py-1.5 border-r border-slate-200 min-w-[55px]">買</th><th class="py-1.5 border-r border-slate-200 min-w-[55px]">賣</th><th class="py-1.5 bg-slate-100/50 min-w-[60px]">結</th>
          </tr>
        </thead>
        <tbody id="stockTableBody" class="bg-white">
          </tbody>
      </table>
    </section>

  </div>

  <script>
    const SUPABASE_URL = "https://fekesirsqjbkrgaibrjf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZla2VzaXJzcWpia3JnYWlicmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTY0MjUsImV4cCI6MjA5NDU5MjQyNX0.82wBFq-B8cxfK9h_gkJQgIpMEabke1EhB6Oacw2lonc";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const EXCEL_SOURCE_URL = "./Stock_list.xlsx"; 

    const colorThemes = {
      '全部': { active: 'bg-slate-800 text-white shadow-xs', inactive: 'bg-slate-100 text-slate-700 hover:bg-slate-200' },
      '高股息自選股': { active: 'bg-amber-500 text-white shadow-xs', inactive: 'bg-amber-50 text-amber-700 hover:bg-amber-100' },
      '電子權值股': { active: 'bg-indigo-600 text-white shadow-xs', inactive: 'bg-indigo-50 text-indigo-700 hover:bg-indigo-100' },
      '預設': { active: 'bg-emerald-600 text-white shadow-xs', inactive: 'bg-emerald-50 text-emerald-700 hover:bg-emerald-100' }
    };

    let currentSourceTab = '全部';
    let dbStockData = [];
    let targetSheetsSet = new Set();
    let latestDbListTime = null;

    document.addEventListener("DOMContentLoaded", async () => {
      await fetchTimestamps();
      await autoLoadAndSyncExcel();
    });

    async function fetchTimestamps() {
      const { data: listData, error: listErr } = await supabaseClient
        .from('stock_targets')
        .select('updated_at')
        .order('updated_at', { ascending: false })
        .limit(1);
        
      if (!listErr && listData && listData.length > 0) {
        latestDbListTime = new Date(listData[0].updated_at);
        document.getElementById("listUpdateTime").innerText = formatDateTime(latestDbListTime);
      } else {
        document.getElementById("listUpdateTime").innerText = "尚無名單";
      }

      const { data: sysData, error: sysErr } = await supabaseClient
        .from('system_timestamps')
        .select('updated_at')
        .eq('key', 'chip_data_time')
        .single();
        
      if (!sysErr && sysData) {
        document.getElementById("chipUpdateTime").innerText = formatDateTime(new Date(sysData.updated_at));
      } else {
        document.getElementById("chipUpdateTime").innerText = "未更新";
      }
    }

    async function autoLoadAndSyncExcel() {
      const statusText = document.getElementById("uploadStatus");
      statusText.innerText = "正在連線獲取 Excel 設定檔...";

      try {
        const response = await fetch(EXCEL_SOURCE_URL);
        if (!response.ok) throw new Error(`狀態代碼: ${response.status}`);
        
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        
        const workbook = XLSX.read(data, { type: 'array' });
        const stockMap = new Map();
        let sheetNames = workbook.SheetNames;
        
        sheetNames.forEach(sheetName => {
          const worksheet = workbook.Sheets[sheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet);
          
          jsonData.forEach(row => {
            const stockId = String(row['股票代號'] || row['代號'] || '').trim();
            const stockName = String(row['股票名稱'] || row['名稱'] || '').trim();
            
            if (stockId && stockName) {
              if (stockMap.has(stockId)) {
                const existingItem = stockMap.get(stockId);
                if (!existingItem.sheet_tags.includes(sheetName)) {
                  existingItem.sheet_tags.push(sheetName);
                }
              } else {
                stockMap.set(stockId, {
                  stock_id: stockId,
                  stock_name: stockName,
                  sheet_tags: [sheetName],
                  updated_at: new Date().toISOString()
                });
              }
            }
          });
        });

        const rowsToUpload = Array.from(stockMap.values());
        if (rowsToUpload.length === 0) {
          statusText.innerText = "⚠️ 來源 Excel 中無有效股票資料。";
          await fetchStocksFromSupabase();
          return;
        }

        statusText.innerText = `同步中，共 ${rowsToUpload.length} 檔不重複名單...`;

        const { error } = await supabaseClient
          .from('stock_targets')
          .upsert(rowsToUpload, { onConflict: 'stock_id' });

        if (error) throw error;

        statusText.innerText = "✅ 名單同步完成！";
        await fetchTimestamps();
        await fetchStocksFromSupabase();
        
      } catch (err) {
        console.error(err);
        statusText.innerText = "⚠️ 無法讀取實時 Excel，切換為歷史緩存讀取...";
        await fetchStocksFromSupabase();
      }
    }

    async function fetchStocksFromSupabase() {
      const { data, error } = await supabaseClient
        .from('stock_targets')
        .select('stock_id, stock_name, sheet_tags')
        .order('stock_id', { ascending: true });
        
      if (error) {
        console.error(error);
        return;
      }

      dbStockData = data || [];
      
      targetSheetsSet.clear();
      dbStockData.forEach(item => {
        if (Array.isArray(item.sheet_tags)) {
          item.sheet_tags.forEach(tag => targetSheetsSet.add(tag));
        }
      });

      updateTabButtons(Array.from(targetSheetsSet));
      applyFilters();
    }

    function updateTabButtons(sheets) {
      const container = document.getElementById("tabContainer");
      container.innerHTML = `<button onclick="switchTab('全部')" id="tab-全部" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-xs whitespace-nowrap cursor-pointer transition-colors">🌐 全部成分股</button>`;
      
      sheets.forEach(sheet => {
        const theme = colorThemes[sheet] || colorThemes['預設'];
        container.innerHTML += `
          <button onclick="switchTab('${sheet}')" id="tab-${sheet}" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.inactive} whitespace-nowrap transition-colors cursor-pointer">
            📁 ${sheet}
          </button>
        `;
      });
      
      const activeBtn = document.getElementById(`tab-${currentSourceTab}`);
      if (activeBtn) {
        const theme = colorThemes[currentSourceTab] || colorThemes['預設'];
        activeBtn.className = `tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.active} whitespace-nowrap cursor-pointer`;
      }
    }

    function switchTab(sheetName) {
      currentSourceTab = sheetName;
      document.querySelectorAll(".tab-btn").forEach(btn => {
        const id = btn.id.replace('tab-', '');
        const theme = colorThemes[id] || colorThemes['預設'];
        btn.className = `tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.inactive} whitespace-nowrap transition-colors cursor-pointer`;
      });
      
      const activeBtn = document.getElementById(`tab-${sheetName}`);
      if (activeBtn) {
        const theme = colorThemes[sheetName] || colorThemes['預設'];
        activeBtn.className = `tab-btn px-4 py-1.5 rounded-lg text-xs font-bold ${theme.active} whitespace-nowrap cursor-pointer`;
      }
      applyFilters();
    }

    function applyFilters() {
      let filteredData = [...dbStockData];
      if (currentSourceTab !== '全部') {
        filteredData = dbStockData.filter(item => 
          Array.isArray(item.sheet_tags) && item.sheet_tags.includes(currentSourceTab)
        );
      }
      renderMatrixTable(filteredData);
    }

    // 💡 核心優化：依照你上傳的看盤格式，產生 3 列跨列聯集 HTML 結構 (現階段籌碼為網頁前端預載示範格式)
    function renderMatrixTable(data) {
      document.getElementById("recordCount").innerText = data.length;
      const tbody = document.getElementById("stockTableBody");
      
      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="17" class="px-6 py-12 text-center text-slate-400 text-sm">此分類下目前沒有股票名單</td></tr>`;
        return;
      }
      
      let htmlString = "";
      
      data.forEach(item => {
        // 模擬五天的法人數據 (待第二階段串接真實資料庫 daily_chip_data)
        // 格式：[買, 賣, 結]
        const mockChip = {
          foreign:  [[150, 50, 100],  [200, 80, 120],  [90, 100, -10],  [300, 100, 200], [80, 120, -40]],
          investment:[[30, 10, 20],   [50, 0, 50],     [10, 20, -10],   [40, 10, 30],    [15, 15, 0]],
          dealer:   [[10, 20, -10],  [15, 15, 0],     [40, 10, 30],    [5, 25, -20],    [30, 10, 20]]
        };

        // 輔助函式：幫「結算欄位」自動染上紅字或綠字底色
        const getResultCell = (val) => {
          if (val > 0) return `<td class="py-2 border-r border-slate-300 font-bold bg-red-50 text-red-600">+${val}</td>`;
          if (val < 0) return `<td class="py-2 border-r border-slate-300 font-bold bg-green-50 text-green-600">${val}</td>`;
          return `<td class="py-2 border-r border-slate-300 text-slate-400">0</td>`;
        };

        // 1. 第一列：外資列 (包含跨3列的股票代號名稱主欄位)
        htmlString += `
          <tr class="border-t-2 border-slate-300 hover:bg-slate-50/50">
            <td rowspan="3" class="px-4 py-4 border-r border-slate-300 font-mono font-bold text-slate-900 bg-slate-100/30 text-center leading-tight">
              <div class="text-base">${item.stock_id}</div>
              <div class="text-xs text-slate-500 font-sans mt-1">${item.stock_name}</div>
            </td>
            <td class="py-2 border-r border-slate-300 bg-slate-50/80 font-bold text-xs text-slate-600">外資</td>
            <td class="py-2 border-r border-slate-200 text-emerald-600">${mockChip.foreign[0][0]}</td><td class="py-2 border-r border-slate-200 text-rose-600">${mockChip.foreign[0][1]}</td>${getResultCell(mockChip.foreign[0][2])}
            <td class="py-2 border-r border-slate-200 text-emerald-600">${mockChip.foreign[1][0]}</td><td class="py-2 border-r border-slate-200 text-rose-600">${mockChip.foreign[1][1]}</td>${getResultCell(mockChip.foreign[1][2])}
            <td class="py-2 border-r border-slate-200 text-emerald-600">${mockChip.foreign[2][0]}</td><td class="py-2 border-r border-slate-200 text-rose-600">${mockChip.foreign[2][1]}</td>${getResultCell(mockChip.foreign[2][2])}
            <td class="py-2 border-r border-slate-200 text-emerald-600">${mockChip.foreign[3][0]}</td><td class="py-2 border-r border-slate-200 text-rose-600">${mockChip.foreign[3][1]}</td>${getResultCell(mockChip.foreign[3][2])}
            <td class="py-2 border-r border-slate-200 text-emerald-600">${mockChip.foreign[4][0]}</td><td class="py-2 border-r border-slate-200 text-rose-600">${mockChip.foreign[4][1]}</td>${getResultCell(mockChip.foreign[4][2])}
          </tr>
        `;

        // 2. 第二列：投信列
        htmlString += `
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-2 border-r border-slate-300 bg-slate-50/80 font-bold text-xs text-slate-600">投信</td>
            <td class="py-2 border-r border-slate-200 text-emerald-600">${mockChip.investment[0][0]}</td><td class="py-2 border-r border-slate-200 text-rose-600">${mockChip.investment[0][1]}</td>${getResultCell(mockChip.investment[0][2])}
            <td class="py-2 border-r border-slate-200 text-emerald-600">${mockChip.investment[1][0]}</td><td class="py-2 border-r border-slate-200 text-rose-600">${mockChip.investment[1][1]}</td>${getResultCell(mockChip.investment[1][2])}
            <td class="py-2 border-r border-slate-200 text-emerald-600">${mockChip.investment[2][0]}</td><td class="py-2 border-r border-slate-200 text-rose-600">${mockChip.investment[2][1]}</td>${getResultCell(mockChip.investment[2][2])}
            <td class="py-2 border-r border-slate-200 text-emerald-600">${mockChip.investment[3][0]}</td><td class="py-2 border-r border-slate-200 text-rose-600">${mockChip.investment[3][1]}</td>${getResultCell(mockChip.investment[3][2])}
            <td class="py-2 border-r border-slate-200 text-emerald-600">${mockChip.investment[4][0]}</td><td class="py-2 border-r border-slate-200 text-rose-600">${mockChip.investment[4][1]}</td>${getResultCell(mockChip.investment[4][2])}
          </tr>
        `;

        // 3. 第三列：自營商列
        htmlString += `
          <tr class="border-t border-slate-200 hover:bg-slate-50/50">
            <td class="py-2 border-r border-slate-300 bg-slate-50/80 font-bold text-xs text-slate-600">自營商</td>
            <td class="py-2 border-r border-slate-200 text-emerald-600">${mockChip.dealer[0][0]}</td><td class="py-2 border-r border-slate-200 text-rose-600">${mockChip.dealer[0][1]}</td>${getResultCell(mockChip.dealer[0][2])}
            <td class="py-2 border-r border-slate-200 text-emerald-600">${mockChip.dealer[1][0]}</td><td class="py-2 border-r border-slate-200 text-rose-600">${mockChip.dealer[1][1]}</td>${getResultCell(mockChip.dealer[1][2])}
            <td class="py-2 border-r border-slate-200 text-emerald-600">${mockChip.dealer[2][0]}</td><td class="py-2 border-r border-slate-200 text-rose-600">${mockChip.dealer[2][1]}</td>${getResultCell(mockChip.dealer[2][2])}
            <td class="py-2 border-r border-slate-200 text-emerald-600">${mockChip.dealer[3][0]}</td><td class="py-2 border-r border-slate-200 text-rose-600">${mockChip.dealer[3][1]}</td>${getResultCell(mockChip.dealer[3][2])}
            <td class="py-2 border-r border-slate-200 text-emerald-600">${mockChip.dealer[4][0]}</td><td class="py-2 border-r border-slate-200 text-rose-600">${mockChip.dealer[4][1]}</td>${getResultCell(mockChip.dealer[4][2])}
          </tr>
        `;
      });
      
      tbody.innerHTML = htmlString;
    }

    function formatDateTime(date) {
      if(!date || isNaN(date.getTime())) return "無紀錄";
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const hh = String(date.getHours()).padStart(2, '0');
      const mm = String(date.getMinutes()).padStart(2, '0');
      return `${y}-${m}-${d} ${hh}:${mm}`;
    }
  </script>
</body>
</html>
