<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>牛牛分析站 - 寬資料大成版</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    .sticky-col-shadow { box-shadow: 3px 0 6px -3px rgba(0, 0, 0, 0.25); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <div id="loadingModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full mx-4 text-center border border-slate-100 flex flex-col items-center">
      <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
      <h3 class="text-base font-bold text-slate-900 mb-1">5日寬數據智慧過濾中...</h3>
      <p id="loadingDetail" class="text-xs text-slate-500 font-medium">請稍候...</p>
    </div>
  </div>

  <div class="sticky top-0 z-40 bg-linear-to-r from-sky-400 via-cyan-400 to-blue-400 text-slate-900 py-4 shadow-md border-b border-sky-300/30 px-4">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:justify-between md:items-center gap-3">
      <div class="flex items-center gap-3">
        <img src="main_icon.png" alt="牛牛標誌" class="w-[42px] h-[42px] object-contain rounded-lg shadow-xs bg-white/40 p-0.5">
        <div>
          <h1 class="text-xl md:text-2xl font-extrabold tracking-tight text-slate-950 leading-tight">牛牛分析站</h1>
          <p class="text-[11px] text-slate-800/80 font-medium">精準5個交易日 · 寬資料扁平架構</p>
        </div>
      </div>
      
      <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 bg-white/90 backdrop-blur-md p-2.5 px-4 rounded-xl border border-sky-200 w-full md:w-auto shadow-sm">
        <div class="flex flex-col gap-0.5 text-xs font-semibold text-slate-600 grow">
          <div class="flex items-center justify-between gap-4">
            <div>名單同步日：<span id="listUpdateTime" class="text-slate-900 font-bold">載入中...</span></div>
            <div>指定看盤起日：<span id="chipUpdateTime" class="text-slate-900 font-bold">檢測中...</span></div>
          </div>
          <div class="border-t border-slate-200/60 my-0.5"></div>
          <div id="uploadStatus" class="text-[11px] text-blue-700 font-bold">系統就緒</div>
        </div>
        <button onclick="forceSyncFlow()" class="cursor-pointer bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-xs text-center flex items-center justify-center gap-1">
          ⚡ 智慧檢查並回補
        </button>
      </div>
    </div>
  </div>

  <div class="max-w-7xl mx-auto px-4 pt-4 pb-12">
    <section class="bg-white p-3 rounded-xl shadow-xs border border-slate-200 mb-3">
      <div class="flex overflow-x-auto gap-2 scrollbar-none" id="tabContainer">
        <button onclick="switchTab('全部')" id="tab-全部" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white shadow-xs whitespace-nowrap cursor-pointer">🌐 全部成分股</button>
      </div>
    </section>

    <section class="bg-blue-50 p-3 rounded-xl border border-blue-100 mb-4 flex justify-between items-center">
      <div class="text-sm text-slate-700 font-semibold">目前分類共有: <span id="recordCount" class="font-bold text-lg text-blue-600">0</span> 檔股票</div>
      <div id="dataSourceLabel" class="text-xs text-slate-500 font-bold bg-white px-2 py-1 rounded border border-blue-200">狀態：初始化</div>
    </section>

    <section class="bg-white rounded-xl shadow-md border border-slate-300 overflow-auto max-h-[72vh] relative">
      <table class="min-w-full text-center text-sm text-slate-700 border-collapse table-fixed">
        <thead class="text-slate-800 font-extrabold sticky top-0 z-30 bg-slate-100 shadow-xs border-b border-slate-300">
          <tr id="tableHeaderDates"></tr>
          <tr id="tableHeaderSub" class="text-xs text-slate-500 bg-slate-50/80"></tr>
        </thead>
        <tbody id="stockTableBody" class="bg-white"></tbody>
      </table>
    </section>
  </div>

  <script>
    const SUPABASE_URL = "https://fekesirsqjbkrgaibrjf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZla2VzaXJzcWpia3JnYWlicmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTY0MjUsImV4cCI6MjA5NDU5MjQyNX0.82wBFq-B8cxfK9h_gkJQgIpMEabke1EhB6Oacw2lonc";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const EXCEL_SOURCE_URL = "./Stock_list.xlsx"; 
    const FINMIND_TOKEN = "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJ1c2VyX2lkIjoiQ2h1bmcwNSIsImVtYWlsIjoiY2hpdTYuY2h1bmcwNUBnbWFpbC5jb20iLCJ0b2tlbl92ZXJzaW9uIjowfQ.Jsmprys2d_Vz8x5eeXnLZRn9_MjWpNH7kp77gL3qRz0";
    
    let currentSourceTab = '全部';
    let dbStockData = [];          
    let globalChipCache = [];      
    let targetSheetsSet = new Set();
    let recentDates = []; 
    let currentSortMode = 'stock_id'; 

    document.addEventListener("DOMContentLoaded", async () => {
      // 🎯 核心修正 1：一開網頁，前端直接硬性算出最近 5 個工作日，不再被資料庫綁架
      calculateRecentFiveTradeDays();
      renderTableHeader();
      await forceSyncFlow(); 
    });

    // 💡 鐵腕計算最近5個可能交易日（排除週末）
    function calculateRecentFiveTradeDays() {
      let dates = [];
      let d = new Date();
      // 如果現在是下午4點前，籌碼未出，可能要多往前推一天，這裡直接預抓大範圍
      while(dates.length < 5) {
        let day = d.getDay();
        if (day !== 0 && day !== 6) { // 排除週六週日
          dates.push(formatDateToString(d));
        }
        d.setDate(d.getDate() - 1);
      }
      recentDates = dates; // 取得強制定向的 5 個日期
      document.getElementById("chipUpdateTime").innerText = recentDates[0];
      console.log("🎯 前端硬性指定的5個看盤交易日區間：", recentDates);
    }

    async function forceSyncFlow() {
      const modal = document.getElementById("loadingModal");
      const detailText = document.getElementById("loadingDetail");
      modal.classList.remove("hidden");

      try {
        detailText.innerText = "1. 讀取並更新 Excel 標的名單...";
        await autoLoadAndSyncExcelList();

        detailText.innerText = "2. 檢查雲端缺口並精準回補 (FinMind)...";
        await handleSmartWideBackfill();

        detailText.innerText = "3. 從寬資料表取回全量 5 日籌碼...";
        await fetchWideChipsFromSupabase();

        detailText.innerText = "4. 建立多窗格看盤矩陣...";
        renderTableHeader();
        applyFilters();

      } catch (err) {
        console.error("總流程異常:", err);
      } finally {
        modal.classList.add("hidden");
      }
    }

    // ⚡ 一次性拉回所有人這 5 天的資料（200檔 × 5天 = 1000筆，完美避開斷尾限制）
    async function fetchWideChipsFromSupabase() {
      if (dbStockData.length === 0) return;
      const stockIdsInList = dbStockData.map(s => s.stock_id);

      const { data, error } = await supabaseClient
        .from('stock_chips_daily')
        .select('*')
        .in('stock_id', stockIdsInList)
        .in('date', recentDates); // 🎯 核心修正 2：精準只抓前端指定的這5天

      if (error) {
        console.error("讀取新寬表失敗:", error);
        return;
      }

      globalChipCache = data || [];
      console.log(`🎉 記憶體載入完成，共 ${globalChipCache.length} 筆不重複日資料。`);
    }

    // ⚡ 精準大補網：檢查這 5 天誰在資料庫缺席，就幫誰打 API 補抓
    async function handleSmartWideBackfill() {
      const statusText = document.getElementById("uploadStatus");
      const detailText = document.getElementById("loadingDetail");
      const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

      if (dbStockData.length === 0) return;
      
      // 算出需要的日期邊界
      const startDateStr = recentDates[recentDates.length - 1];
      const endDateStr = recentDates[0];

      statusText.innerText = `🔄 正在核對雲端 5 日寬資料完整度...`;

      // 預先查出這群股票在這5天內，資料庫裡已經有哪些資料了
      const { data: existingRows } = await supabaseClient
        .from('stock_chips_daily')
        .select('stock_id, date')
        .in('stock_id', dbStockData.map(s => s.stock_id))
        .in('date', recentDates);

      // 建立索引加速比對
      const existingSet = new Set((existingRows || []).map(r => `${r.stock_id}_${r.date}`));

      for (let i = 0; i < dbStockData.length; i++) {
        const stock = dbStockData[i];
        
        // 檢查此股票是否 5 天在資料庫裡都健在？
        let isMissing = false;
        for (let d of recentDates) {
          if (!existingSet.has(`${stock.stock_id}_${d}`)) {
            isMissing = true;
            break;
          }
        }

        // 如果資料庫早就存好這 5 天的寬資料了，直接跳過不打 API，省流量、免卡死！
        if (!isMissing) {
          continue; 
        }

        detailText.innerText = `[精準回補缺缺口] ${stock.stock_id} ${stock.stock_name} (${i+1}/${dbStockData.length})`;

        try {
          const apiUrl = `https://api.finmindtrade.com/api/v4/data?dataset=TaiwanStockInstitutionalInvestorsBuySell&data_id=${stock.stock_id}&start_date=${startDateStr}&end_date=${endDateStr}&token=${FINMIND_TOKEN}`;
          const res = await fetch(apiUrl);
          if (res.status === 429) { await sleep(4000); i--; continue; } 
          
          const resJson = await res.json();
          if (resJson.status === 200 && Array.isArray(resJson.data) && resJson.data.length > 0) {
            
            // 💡 將抓回來的多元法人明細，揉捏成一檔個股一天的「寬結構」
            const dateMap = {};
            resJson.data.forEach(row => {
              const d = row.date;
              if (!dateMap[d]) {
                dateMap[d] = { stock_id: stock.stock_id, date: d, f_buy:0, f_sell:0, fd_buy:0, fd_sell:0, it_buy:0, it_sell:0, ds_buy:0, ds_sell:0, dh_buy:0, dh_sell:0 };
              }
              if (row.name === 'Foreign_Investor') { dateMap[d].f_buy = row.buy; dateMap[d].f_sell = row.sell; }
              else if (row.name === 'Foreign_Dealer_Self') { dateMap[d].fd_buy = row.buy; dateMap[d].fd_sell = row.sell; }
              else if (row.name === 'Investment_Trust') { dateMap[d].it_buy = row.buy; dateMap[d].it_sell = row.sell; }
              else if (row.name === 'Dealer_self') { dateMap[d].ds_buy = row.buy; dateMap[d].ds_sell = row.sell; }
              else if (row.name === 'Dealer_Hedging') { dateMap[d].dh_buy = row.buy; dateMap[d].dh_sell = row.sell; }
            });

            const rowsToUpsert = Object.values(dateMap);
            if (rowsToUpsert.length > 0) {
              // 🎯 寫入新表，PrimaryKey 鎖死 (stock_id, date)，重複只會覆蓋更新，絕不重複！
              await supabaseClient.from('stock_chips_daily').upsert(rowsToUpsert);
            }
          }
        } catch (err) {
          console.error(err);
        }
        await sleep(300); 
      }
      statusText.innerText = "✅ 5日寬化庫對接檢查全數落幕！";
    }

    function formatDateToString(dateObj) {
      const yyyy = dateObj.getFullYear();
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function renderTableHeader() {
      const headerDates = document.getElementById("tableHeaderDates");
      const headerSub = document.getElementById("tableHeaderSub");
      if (!headerDates || !headerSub) return;

      let datesHtml = `
        <th rowspan="2" class="px-1 py-2 bg-slate-200 sticky left-0 z-40 w-[90px] min-w-[90px] text-center border-r border-slate-300 font-extrabold text-[11px]">標的</th>
        <th rowspan="2" class="px-1 py-2 bg-slate-100 font-extrabold text-xs sticky left-[90px] z-40 w-[52px] border-r border-slate-300 text-center">法人</th>
        <th rowspan="2" class="px-1 py-2 bg-amber-100 font-black text-xs sticky left-[142px] z-40 w-[68px] border-r border-slate-300 text-center sticky-col-shadow">5日結</th>
      `;
      let subHtml = "";

      recentDates.forEach((dateStr) => {
        const parts = dateStr.split('-');
        const formattedDate = parts.length === 3 ? `${parts[1]}/${parts[2]}` : dateStr;
        datesHtml += `<th colspan="3" class="px-2 py-2 border-r border-slate-300 text-sm bg-slate-100 text-slate-900 font-bold">${formattedDate}</th>`;
        subHtml += `
          <th class="py-1.5 border-r border-slate-200 w-[55px] text-xs font-bold text-slate-600">買</th>
          <th class="py-1.5 border-r border-slate-200 w-[55px] text-xs font-bold text-slate-600">賣</th>
          <th class="py-1.5 border-r border-slate-300 w-[65px] font-extrabold text-slate-800 bg-slate-50">結</th>
        `;
      });
      headerDates.innerHTML = datesHtml;
      headerSub.innerHTML = subHtml;
    }

    async function autoLoadAndSyncExcelList() {
      try {
        const response = await fetch(EXCEL_SOURCE_URL);
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        const stockMap = new Map();
        workbook.SheetNames.forEach(sheetName => {
          const worksheet = workbook.Sheets[sheetName];
          const jsonData = XLSX.utils.sheet_to_json(worksheet);
          jsonData.forEach(row => {
            const stockId = String(row['股票代號'] || row['代號'] || '').trim();
            const stockName = String(row['股票名稱'] || row['名稱'] || '').trim();
            if (stockId && stockName) {
              if (stockMap.has(stockId)) {
                if(!stockMap.get(stockId).sheet_tags.includes(sheetName)) stockMap.get(stockId).sheet_tags.push(sheetName);
              } else {
                stockMap.set(stockId, { stock_id: stockId, stock_name: stockName, sheet_tags: [sheetName] });
              }
            }
          });
        });
        const rowsToUpload = Array.from(stockMap.values());
        if (rowsToUpload.length > 0) {
          await supabaseClient.from('stock_targets').upsert(rowsToUpload, { onConflict: 'stock_id' });
        }
        const { data: dbData } = await supabaseClient.from('stock_targets').select('*');
        dbStockData = dbData || [];
        document.getElementById("listUpdateTime").innerText = new Date().toLocaleDateString();
        
        targetSheetsSet.clear();
        dbStockData.forEach(item => { if(item.sheet_tags) item.sheet_tags.forEach(tag => targetSheetsSet.add(tag)); });
        updateTabButtons(Array.from(targetSheetsSet));
      } catch (err) {
        const { data: dbData } = await supabaseClient.from('stock_targets').select('*');
        dbStockData = dbData || [];
      }
    }

    function updateTabButtons(sheets) {
      const container = document.getElementById("tabContainer");
      container.innerHTML = `<button onclick="switchTab('全部')" id="tab-全部" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-800 text-white cursor-pointer">🌐 全部成分股</button>`;
      sheets.forEach(sheet => {
        container.innerHTML += `<button onclick="switchTab('${sheet}')" id="tab-${sheet}" class="tab-btn px-4 py-1.5 rounded-lg text-xs font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 cursor-pointer">📁 ${sheet}</button>`;
      });
    }

    function switchTab(sheetName) {
      currentSourceTab = sheetName;
      applyFilters();
    }

    function applyFilters() {
      let filteredStocks = [...dbStockData];
      if (currentSourceTab !== '全部') {
        filteredStocks = dbStockData.filter(item => item.sheet_tags && item.sheet_tags.includes(currentSourceTab));
      }
      renderMatrixTableFromCache(filteredStocks);
    }

    function renderMatrixTableFromCache(stocks) {
      document.getElementById("recordCount").innerText = stocks.length;
      const tbody = document.getElementById("stockTableBody");
      let htmlString = "";

      stocks.forEach(item => {
        const myChips = globalChipCache.filter(c => c.stock_id === item.stock_id);

        let sumF = 0, sumFD = 0, sumIT = 0, sumDS = 0, sumDH = 0;
        let fRow = "", fdRow = "", iRow = "", dsRow = "", dhRow = "";

        const getCell = (b, s) => {
          const buy = Math.round(b / 1000);
          const sell = Math.round(s / 1000);
          const net = buy - sell;
          let netHtml = `<td class="py-2.5 border-r border-slate-300 text-slate-400 font-bold text-sm">0</td>`;
          if (net > 0) netHtml = `<td class="py-2.5 border-r border-slate-300 font-black bg-red-50 text-red-600 text-sm">+${net}</td>`;
          if (net < 0) netHtml = `<td class="py-2.5 border-r border-slate-300 font-black bg-green-50 text-green-600 text-sm">${net}</td>`;
          return `<td class="py-2.5 border-r border-slate-200 text-emerald-600 font-bold text-xs">${buy}</td><td class="py-2.5 border-r border-slate-200 text-rose-600 font-bold text-xs">${sell}</td>${netHtml}`;
        };

        recentDates.forEach(d => {
          const dayData = myChips.find(c => c.date === d) || { f_buy:0, f_sell:0, fd_buy:0, fd_sell:0, it_buy:0, it_sell:0, ds_buy:0, ds_sell:0, dh_buy:0, dh_sell:0 };
          
          sumF += (Math.round(dayData.f_buy/1000) - Math.round(dayData.f_sell/1000));
          sumFD += (Math.round(dayData.fd_buy/1000) - Math.round(dayData.fd_sell/1000));
          sumIT += (Math.round(dayData.it_buy/1000) - Math.round(dayData.it_sell/1000));
          sumDS += (Math.round(dayData.ds_buy/1000) - Math.round(dayData.ds_sell/1000));
          sumDH += (Math.round(dayData.dh_buy/1000) - Math.round(dayData.dh_sell/1000));

          fRow += getCell(dayData.f_buy, dayData.f_sell);
          fdRow += getCell(dayData.fd_buy, dayData.fd_sell);
          iRow += getCell(dayData.it_buy, dayData.it_sell);
          dsRow += getCell(dayData.ds_buy, dayData.ds_sell);
          dhRow += getCell(dayData.dh_buy, dayData.dh_sell);
        });

        const getSumCell = (val) => {
          if (val > 0) return `<td class="py-2.5 border-r border-slate-300 font-black text-rose-700 bg-amber-50 sticky left-[142px] z-20 sticky-col-shadow">+${val}</td>`;
          if (val < 0) return `<td class="py-2.5 border-r border-slate-300 font-black text-emerald-700 bg-amber-50 sticky left-[142px] z-20 sticky-col-shadow">${val}</td>`;
          return `<td class="py-2.5 border-r border-slate-300 font-bold text-slate-500 bg-amber-50 sticky left-[142px] z-20 sticky-col-shadow">0</td>`;
        };

        htmlString += `
          <tr class="border-t-2 border-slate-300">
            <td rowspan="5" class="px-1 py-4 border-r border-slate-300 font-mono text-slate-900 bg-slate-100 sticky left-0 z-20 text-center leading-tight w-[90px]">
              <div class="text-sm font-black">${item.stock_id}</div>
              <div class="text-[11px] text-slate-600 font-extrabold truncate">${item.stock_name}</div>
            </td>
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-extrabold text-xs text-slate-700 sticky left-[90px] z-20 text-center w-[52px]">外資</td>
            ${getSumCell(sumF)}${fRow}
          </tr>
          <tr class="border-t border-slate-200">
            <td class="py-3 border-r border-slate-300 bg-slate-100 font-extrabold text-xs text-slate-700 sticky left-[90px] z-20 text-center w-[52px]">外資自營</td>
            ${getSumCell(sumFD)}${fdRow}
          </tr>
          <tr class="border-t border-slate-200">
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-extrabold text-xs text-slate-700 sticky left-[90px] z-20 text-center w-[52px]">投信</td>
            ${getSumCell(sumIT)}${iRow}
          </tr>
          <tr class="border-t border-slate-200">
            <td class="py-3 border-r border-slate-300 bg-slate-100 font-extrabold text-xs text-slate-700 sticky left-[90px] z-20 text-center w-[52px]">自營(自)</td>
            ${getSumCell(sumDS)}${dsRow}
          </tr>
          <tr class="border-t border-slate-200">
            <td class="py-3 border-r border-slate-300 bg-slate-50 font-extrabold text-xs text-slate-700 sticky left-[90px] z-20 text-center w-[52px]">自營(避)</td>
            ${getSumCell(sumDH)}${dhRow}
          </tr>
        `;
      });

      tbody.innerHTML = htmlString;
      document.getElementById("dataSourceLabel").innerText = "🟢 數據狀態：5日指定寬資料極速渲染完畢";
    }
  </script>
</body>
</html>
