<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>牛牛分析站 - 智慧過濾籌碼寬資版</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    .sticky-col-shadow { box-shadow: 3px 0 6px -3px rgba(0, 0, 0, 0.25); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

  <div id="loadingModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full mx-4 text-center border border-slate-100 flex flex-col items-center">
      <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
      <h3 class="text-base font-bold text-slate-900 mb-1">雲端籌碼智慧同步中...</h3>
      <p id="loadingDetail" class="text-xs text-slate-500 font-medium">安全連線中...</p>
    </div>
  </div>

  <div id="newsModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 px-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-6xl w-full max-h-[90vh] min-h-[550px] md:min-h-0 flex flex-col border border-slate-100 overflow-hidden">
      
      <div class="py-2 px-4 border-b border-slate-200 flex items-center justify-between bg-slate-50 rounded-t-2xl shrink-0">
        <h3 id="newsModalTitle" class="text-base font-black text-slate-900">個股詳細資訊</h3>
        <button onclick="closeNewsModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold cursor-pointer p-1">✕</button>
      </div>

      <div id="modalIndicatorBar" class="bg-linear-to-r from-slate-50 to-slate-100 border-b border-slate-200 px-4 py-2.5 grid grid-cols-3 sm:grid-cols-6 gap-2 shrink-0 text-center">
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs"><div class="text-[10px] font-bold text-slate-400">目前股價</div><div id="modalInfoPrice" class="text-xs font-black text-slate-800">--</div></div>
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs"><div class="text-[10px] font-bold text-slate-400">今日漲跌</div><div id="modalInfoChange" class="text-xs font-black text-slate-800">--</div></div>
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs"><div class="text-[10px] font-bold text-slate-400">MA10 均線</div><div id="modalInfoMA10" class="text-xs font-black text-blue-600">--</div></div>
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs"><div class="text-[10px] font-bold text-slate-400">MA20 均線</div><div id="modalInfoMA20" class="text-xs font-black text-orange-600">--</div></div>
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs"><div class="text-[10px] font-bold text-slate-400">RSI14 強弱</div><div id="modalInfoRSI14" class="text-xs font-black text-purple-600">--</div></div>
        <div class="bg-white p-1.5 rounded-lg border border-slate-200 shadow-2xs"><div class="text-[10px] font-bold text-slate-400">MACD 動能</div><div id="modalInfoMACD" class="text-xs font-black text-slate-800">--</div></div>
      </div>

      <div class="flex border-b border-slate-200 bg-slate-50/50 px-4 shrink-0">
        <button id="tabBtnTrend" onclick="switchModalTab('trend')" class="py-1.5 px-4 text-sm font-black border-b-2 border-blue-600 text-blue-600 focus:outline-none cursor-pointer transition-all">📈 近期走勢</button>
        <button id="tabBtnMacd" onclick="switchModalTab('macd')" class="py-1.5 px-4 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 focus:outline-none cursor-pointer transition-all">📊 MACD 趨勢圖</button>
        <button id="tabBtnNews" onclick="switchModalTab('news')" class="py-1.5 px-4 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 focus:outline-none cursor-pointer transition-all">📰 財經新聞</button>
      </div>
      
      <div class="p-4 overflow-y-auto h-[500px] md:h-auto md:grow bg-slate-50/30 relative flex flex-col">
        <div id="trendZone" class="block space-y-4 w-full grow">
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs">
            <h4 class="text-xs font-black text-slate-500 mb-1 flex items-center gap-1">🔹 股價走勢</h4>
            <div id="priceScrollWrapper" class="w-full overflow-x-auto pb-2 scrollbar-thin">
              <div class="min-w-[960px] px-1">
                <div id="trendPriceChart" class="flex items-end justify-between h-24 pt-4 border-b border-slate-200 relative w-full"></div>
                <div id="trendPriceDates" class="flex justify-between font-black mt-1.5 w-full"></div>
              </div>
            </div>
          </div>
          <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-xs">
            <div class="flex justify-between items-center border-b border-slate-100 pb-1 mb-1">
              <h4 class="text-xs font-black text-slate-500 flex items-center gap-1">🔹 三大法人 (張)</h4>
              <div class="flex bg-slate-100 p-0.5 rounded-lg border border-slate-200">
                <button id="subTabF" onclick="switchChipSubTab('f')" class="px-3 py-1 text-xs font-black bg-white text-slate-900 rounded-md shadow-2xs cursor-pointer transition-all">外資</button>
                <button id="subTabIT" onclick="switchChipSubTab('it')" class="px-3 py-1 text-xs font-bold text-slate-500 hover:text-slate-800 rounded-md cursor-pointer transition-all">投信</button>
                <button id="subTabDS" onclick="switchChipSubTab('ds')" class="px-3 py-1 text-xs font-bold text-slate-500 hover:text-slate-800 rounded-md cursor-pointer transition-all">自營商</button>
              </div>
            </div>
            <div class="w-full overflow-x-auto pb-2 scrollbar-thin"><div id="trendChipChart" class="w-full min-w-[960px]"></div></div>
          </div>
        </div>

        <div id="macdZone" class="hidden space-y-4 w-full grow">
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
            <div class="flex justify-between items-center mb-2">
              <h4 class="text-xs font-black text-slate-500 flex items-center gap-1">🔹 MACD 20日快慢線與動能組合圖</h4>
              <div class="flex items-center gap-3 text-[10px] font-bold">
                <span class="flex items-center gap-1"><span class="w-2.5 h-0.5 bg-sky-500 inline-block"></span>DIF快線</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-0.5 bg-amber-500 inline-block"></span>DEA慢線</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 bg-rose-500 inline-block"></span>多方動能</span>
                <span class="flex items-center gap-1"><span class="w-2 h-2 bg-emerald-500 inline-block"></span>空方動能</span>
              </div>
            </div>
            <div class="w-full overflow-x-auto pb-2 scrollbar-thin">
              <div class="min-w-[960px] px-1 bg-slate-50/60 p-3 rounded-lg border border-slate-200/60">
                <div id="combinedMacdChart" class="flex items-center justify-between h-44 relative w-full border border-slate-200 bg-white rounded shadow-2xs"></div>
                <div id="combinedMacdDates" class="flex justify-between font-black mt-1.5 w-full"></div>
              </div>
            </div>
          </div>
        </div>

        <div id="newsZone" class="hidden h-full w-full overflow-y-auto grow">
          <div id="debugLogZone" class="mb-4 p-3 bg-slate-900 text-amber-400 font-mono text-[11px] rounded-xl border border-slate-700 leading-normal hidden whitespace-pre-wrap text-left"></div>
          <div id="newsListZone" class="space-y-3 block w-full"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="sticky top-0 z-40 bg-linear-to-r from-sky-400 via-cyan-400 to-blue-400 text-slate-900 py-3 shadow-md border-b border-sky-300/30 px-4">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 min-w-0 shrink-0">
        <img src="main_icon.png" alt="牛牛標誌" class="w-[36px] h-[36px] object-contain rounded-lg shadow-xs bg-white/40 p-0.5 shrink-0">
        <h1 class="text-lg md:text-xl font-extrabold tracking-tight text-slate-950 whitespace-nowrap">牛牛分析站</h1>
      </div>
      <div class="flex items-center gap-4 shrink-0 min-w-0">
        <div class="hidden sm:flex items-center gap-3 text-[11px] font-bold text-slate-800/90 whitespace-nowrap overflow-hidden">
          <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-600"></span>名單更新：<span id="listUpdateTime" class="font-black text-slate-950">載入中...</span></span>
          <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>資料更新：<span id="chipUpdateTime" class="font-black text-slate-950">檢測中...</span></span>
        </div>
        <button onclick="forceSyncFlow()" class="cursor-pointer bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-xs whitespace-nowrap flex items-center justify-center gap-1">⚡ 更新</button>
      </div>
    </div>
  </div>

  <div class="sm:hidden bg-slate-100 border-b border-slate-200 px-4 py-1.5 flex items-center justify-between text-[11px] font-bold text-slate-600">
    <span>名單：<span id="listUpdateTimeMob" class="text-slate-900 font-black">..</span></span>
    <span>資料更新：<span id="chipUpdateTimeMob" class="text-slate-900 font-black">..</span></span>
  </div>

  <div class="max-w-7xl mx-auto px-4 pt-4 pb-12">
    <section class="bg-white p-3 rounded-xl shadow-xs border border-slate-200 mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="flex items-center gap-3 grow sm:max-w-xl">
        <div class="w-40 md:w-48 shrink-0">
          <select id="tabSelect" onchange="switchTab(this.value)" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-xs font-bold text-slate-700 focus:outline-none cursor-pointer transition-colors">
            <option value="全部">🌐 全部成分股</option>
          </select>
        </div>
        <div class="text-xs text-slate-500 font-semibold whitespace-nowrap">共有: <span id="recordCount" class="font-bold text-sm text-blue-600">0</span> 檔股票</div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0 justify-start sm:justify-end">
        <div class="relative flex items-center">
          <input type="text" id="keywordInput" onkeyup="handleSearchKeyup(event)" placeholder="輸入代號或名稱..." class="w-36 md:w-48 bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs font-medium focus:outline-none transition-colors" />
          <button onclick="clearSearchField()" id="clearSearchBtn" class="hidden absolute right-2.5 text-slate-400 hover:text-slate-600 text-xs font-bold cursor-pointer">✕</button>
        </div>
        <button onclick="executeStockSearch()" class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-xs whitespace-nowrap flex items-center gap-1">🔍 搜尋</button>
      </div>
    </section>

    <section id="mainTableWrapper" class="bg-white rounded-xl shadow-md border border-slate-300 overflow-auto max-h-[72vh] relative">
      <table class="min-w-full text-center text-sm text-slate-700 border-collapse table-fixed">
        <thead class="text-slate-800 font-extrabold sticky top-0 z-30 bg-slate-100 shadow-xs border-b border-slate-300">
          <tr id="tableHeaderDates"></tr>
          <tr id="tableHeaderSub" class="text-xs text-slate-500 bg-slate-50/80"></tr>
        </thead>
        <tbody id="stockTableBody" class="bg-white"></tbody>
      </table>
    </section>
  </div>

  <script type="module">
    import { state, getValIgnoreCase } from './js/config.js';
    import { forceSyncFlow } from './js/api.js';
    import { applyFilters, switchModalTab, switchChipSubTab } from './js/ui.js';

    // 🧠 核心關鍵修正點：將 HTML 中的 inline 事件（如 onchange、onclick）強制註冊到全域 window 上
    window.forceSyncFlow = forceSyncFlow;
    window.switchModalTab = switchModalTab;
    window.switchChipSubTab = switchChipSubTab;
    window.changeSortMode = (val) => { state.currentSortMode = val; applyFilters(); };
    window.changeSumDaysMode = (val) => { state.currentSumDaysMode = parseInt(val, 10); applyFilters(); };
    
    window.switchTab = (sheetName) => { state.currentSourceTab = sheetName; applyFilters(); };
    window.executeStockSearch = () => { state.searchKeyword = document.getElementById("keywordInput").value.trim().toLowerCase(); applyFilters(); };
    window.closeNewsModal = () => document.getElementById("newsModal").classList.add("hidden");

    window.handleSearchKeyup = (e) => {
      const val = e.target.value.trim();
      document.getElementById("clearSearchBtn").classList.toggle("hidden", val === "");
      if (e.key === "Enter") { state.searchKeyword = val.toLowerCase(); applyFilters(); }
    };

    window.clearSearchField = () => {
      document.getElementById("keywordInput").value = "";
      document.getElementById("clearSearchBtn").classList.add("hidden");
      state.searchKeyword = "";
      applyFilters();
    };

    // 自動執行初始載入
    calculateInitialListsAndSync();

    async function calculateInitialListsAndSync() {
      // 確保一進網頁，最基本的交易日期分配陣列能正確跑完，隨後無縫接軌 API 拉取流
      let dates20 = [];
      let d = new Date();
      while(dates20.length < 20) {
        let day = d.getDay();
        if (day !== 0 && day !== 6) { 
          dates20.push(d.toISOString().split('T')[0]);
        }
        d.setDate(d.getDate() - 1);
      }
      state.extendedTrendDates = dates20; 
      state.recentDates = dates20.slice(0, 5); 
      
      // 直接觸發核心讀取與過濾流
      await forceSyncFlow();
    }
  </script>
</body>
</html>
