<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinMind 籌碼全功能動態除錯探針</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1300px; margin: 0 auto; }
        .header { background: #2c3e50; color: #fff; padding: 25px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .config-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; margin-top: 15px; }
        .config-group { display: flex; flex-direction: column; gap: 5px; }
        .config-group label { font-size: 12px; font-weight: bold; opacity: 0.9; }
        .config-group input { padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; color: #333; }
        .token-row { margin-top: 15px; display: flex; gap: 15px; align-items: flex-end; }
        .btn { background: #00b894; color: white; border: none; padding: 12px 25px; border-radius: 4px; cursor: pointer; font-size: 15px; font-weight: bold; transition: background 0.2s; height: 43px; }
        .btn:hover { background: #009473; }
        .panels-container { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        .stock-panel { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 6px solid #3498db; }
        .panel-title-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        h2 { margin: 0; color: #2c3e50; font-size: 20px; }
        .badge { font-size: 13px; padding: 5px 12px; border-radius: 4px; background: #eee; color: #666; font-weight: bold; }
        .badge.success { background: #2ecc71; color: white; }
        .badge.error { background: #e74c3c; color: white; }
        .log-msg { font-size: 14px; padding: 10px; border-radius: 4px; background: #e8f4fd; color: #1d6fa5; margin-bottom: 10px; font-family: monospace; }
        pre { background: #272822; color: #f8f8f2; padding: 15px; border-radius: 6px; overflow-x: auto; font-size: 13px; max-height: 400px; line-height: 1.5; margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0; font-size: 26px;">🎯 FinMind 籌碼全功能動態除錯探針</h1>
        
        <div class="config-grid">
            <div class="config-group">
                <label for="stocksInput">股票代號 (多檔請用半形逗號隔開)</label>
                <input type="text" id="stocksInput" value="2301, 6446" placeholder="例如: 2301, 6446, 2330">
            </div>
            <div class="config-group">
                <label for="startDateInput">開始日期 (YYYY-MM-DD)</label>
                <input type="date" id="startDateInput" value="2026-06-22">
            </div>
            <div class="config-group">
                <label for="endDateInput">結束日期 (YYYY-MM-DD)</label>
                <input type="date" id="endDateInput" value="2026-06-25">
            </div>
        </div>

        <div class="token-row">
            <div class="config-group" style="flex: 1;">
                <label for="tokenInput">FINMIND_TOKEN (留空則以無驗證免費模式查詢)</label>
                <input type="text" id="tokenInput" placeholder="請在此貼上您的 API Token 密鑰">
            </div>
            <button class="btn" id="startBtn">啟動動態刺探</button>
        </div>
    </div>

    <div id="panelsContainer" class="panels-container">
        <div style="text-align: center; color: #999; padding: 40px;">請點擊上方按鈕開始進行 API 實時檢測。</div>
    </div>
</div>

<script src="test.js"></script>
</body>
</html>
