<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>量化交易 - 籌碼觀測面板 (西元純淨修正版)</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f5f6fa; padding: 20px; color: #333; }
        .container { max-width: 850px; margin: 0 auto; }
        .header { background: #2c3e50; color: white; padding: 25px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .config-grid { display: flex; gap: 15px; align-items: center; margin-top: 15px; flex-wrap: wrap; }
        .config-group { display: flex; flex-direction: column; gap: 5px; }
        .config-group label { font-size: 13px; font-weight: bold; opacity: 0.9; }
        select, input { padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; background: white; }
        .btn { background: #e74c3c; color: white; border: none; padding: 12px 30px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn:hover { background: #c0392b; }
        .panel { background: white; border-radius: 8px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-top: 6px solid #e74c3c; margin-bottom: 20px; }
        .title-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .badge { font-size: 13px; padding: 6px 14px; border-radius: 4px; background: #718093; color: white; font-weight: bold; }
        .badge.success { background: #2ecc71; }
        .badge.error { background: #e74c3c; }
        
        .diag-box { background: #222; color: #7fdbff; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 13px; margin-bottom: 15px; border-left: 5px solid #0074d9; line-height: 1.5; }
        .diag-title { color: #aaa; font-weight: bold; margin-bottom: 5px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
        
        pre { background: #2f3542; color: #f1f2f6; padding: 18px; border-radius: 6px; font-size: 13px; max-height: 400px; overflow-y: auto; margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0; font-size: 24px;">🏛️ 臺灣證券交易所 - 三大法人籌碼落地觀測儀</h1>
        <p style="margin:5px 0 0 0; opacity: 0.8;">全線回歸西元 8 碼極簡版（已修復日曆無法點選問題）</p>
        
        <div class="config-grid">
            <div class="config-group">
                <label>股票代號</label>
                <input type="text" id="stockId" value="2301" style="width: 100px;">
            </div>
            
            <div class="config-group">
                <label>選擇交易日期</label>
                <input type="date" id="targetDate">
            </div>
            
            <button class="btn" id="analyzeBtn">執行同步與分析</button>
        </div>
    </div>

    <div class="panel">
        <div class="title-bar">
            <h2>📡 雲端管線實時通訊日誌</h2>
            <span id="resultBadge" class="badge">初始化中...</span>
        </div>
        
        <div class="diag-title">▶ 核心通訊進度與追蹤參數</div>
        <div id="diagLogs" class="diag-box">
            正在計算台股最後一個有效交易日並載入日曆...
        </div>

        <div class="diag-title">▶ 局部過濾個股籌碼結果</div>
        <pre id="resultBlock">// 數據將呈現在此</pre>
    </div>
</div>

<script src="test.js"></script>
</body>
</html>
