<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>量化交易 - GitHub 雲端大檔分析面板</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f6fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 850px; margin: 0 auto; }
        .header { background: #6c5ce7; color: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
        .config-group { display: flex; flex-direction: column; gap: 5px; }
        .config-group label { font-size: 13px; font-weight: bold; opacity: 0.9; }
        .config-group input { padding: 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
        .btn-row { margin-top: 20px; text-align: right; }
        .btn { background: #00cec9; color: white; border: none; padding: 12px 35px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #00b894; }
        .panel { background: white; border-radius: 8px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-top: 20px; border-top: 6px solid #6c5ce7; }
        .title-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        h2 { margin: 0; color: #2c3e50; font-size: 22px; }
        .badge { font-size: 13px; padding: 6px 14px; border-radius: 4px; background: #718093; color: white; font-weight: bold; }
        .badge.success { background: #2ecc71; color: white; }
        .badge.error { background: #e74c3c; color: white; }
        .log { background: #e8f4fd; padding: 12px; border-radius: 4px; font-family: monospace; font-size: 14px; color: #1d6fa5; margin-bottom: 15px; border-left: 4px solid #6c5ce7; }
        pre { background: #2f3542; color: #f1f2f6; padding: 18px; border-radius: 6px; font-size: 13px; max-height: 500px; overflow-y: auto; line-height: 1.6; margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0; font-size: 24px;">🏛️ 雲端總表全自動下載 - 前端局部過濾分析器</h1>
        <p style="margin:5px 0 0 0; opacity: 0.9;">利用 Cloudflare Worker 完美繞過 CORS，大檔案落地 GitHub 後由前端秒級分析</p>
        
        <div class="config-grid">
            <div class="config-group">
                <label for="stockId">要分析的股票代號</label>
                <input type="text" id="stockId" value="2301" placeholder="例如: 2301">
            </div>
            <div class="config-group">
                <label for="targetDate">指定交易日期</label>
                <input type="date" id="targetDate" value="2025-06-27">
            </div>
        </div>
        
        <div class="btn-row">
            <button class="btn" id="analyzeBtn">觸發雲端管線並分析</button>
        </div>
    </div>

    <div class="panel">
        <div class="title-bar">
            <h2>📊 籌碼局部過濾器</h2>
            <span id="resultBadge" class="badge">等待指令</span>
        </div>
        <div id="logMsg" class="log">請設定上方代號與日期，點擊按鈕系統將自動跨網域串聯分析。</div>
        <pre id="resultBlock">// 分析後的個股官方原始完整行數據將在此處顯示</pre>
    </div>
</div>

<script src="test.js"></script>
</body>
</html>
