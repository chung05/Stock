<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交易所官方總帳本 - 全自動前端過濾分析</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f6fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 850px; margin: 0 auto; }
        .header { background: #2c3e50; color: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
        .config-group { display: flex; flex-direction: column; gap: 5px; }
        .config-group label { font-size: 13px; font-weight: bold; opacity: 0.9; }
        .config-group input { padding: 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
        .btn-row { margin-top: 20px; text-align: right; }
        .btn { background: #2ecc71; color: white; border: none; padding: 12px 35px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #27ae60; }
        .panel { background: white; border-radius: 8px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-top: 20px; border-top: 6px solid #3498db; }
        .title-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        h2 { margin: 0; color: #2c3e50; font-size: 22px; }
        .badge { font-size: 13px; padding: 6px 14px; border-radius: 4px; background: #718093; color: white; font-weight: bold; }
        .badge.success { background: #2ecc71; color: white; }
        .badge.error { background: #e74c3c; color: white; }
        .log { background: #e8f4fd; padding: 12px; border-radius: 4px; font-family: monospace; font-size: 14px; color: #1d6fa5; margin-bottom: 15px; border-left: 4px solid #3498db; }
        pre { background: #2f3542; color: #f1f2f6; padding: 18px; border-radius: 6px; font-size: 13px; max-height: 500px; overflow-y: auto; line-height: 1.6; margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0; font-size: 24px;">🏛️ 官方總表下載 - 前端個股自動分析器</h1>
        <p style="margin:5px 0 0 0; opacity: 0.8;">指定日期自動下載當日法人買賣超總表，並在前端精準過濾指定個股資料</p>
        
        <div class="config-grid">
            <div class="config-group">
                <label for="stockInput">股票代號 (如: 2301 或 6446)</label>
                <input type="text" id="stockInput" value="2301" placeholder="請輸入股票代號">
            </div>
            <div class="config-group">
                <label for="dateInput">指定交易日期 (必須為開盤工作日)</label>
                <input type="date" id="dateInput" value="2025-06-27">
            </div>
        </div>
        
        <div class="btn-row">
            <button class="btn" id="startBtn">下載總表並分析</button>
        </div>
    </div>

    <div class="panel">
        <div class="title-bar">
            <h2>📊 本地數據過濾中心</h2>
            <span id="resultBadge" class="badge">未連線</span>
        </div>
        <div id="logMessage" class="log">請設定上方個股與日期，點擊按鈕系統將自動下載總表並篩選。</div>
        <pre id="jsonDataDump">// 解析後的個股籌碼行數據將在此處完整呈現</pre>
    </div>
</div>

<script src="test.js"></script>
</body>
</html>
