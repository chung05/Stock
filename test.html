<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWSE / TPEX 交易所官方直連歷史探針</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f6fa; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: #0097e6; color: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .config-grid { display: grid; grid-template-columns: 2fr 1.5fr; gap: 20px; margin-top: 15px; }
        .config-group { display: flex; flex-direction: column; gap: 5px; }
        .config-group label { font-size: 13px; font-weight: bold; }
        .config-group input { padding: 12px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
        .btn-row { margin-top: 20px; text-align: right; }
        .btn { background: #44bd32; color: white; border: none; padding: 12px 30px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #4cd137; }
        .notice { background: #fff3cd; color: #856404; padding: 12px; border-radius: 4px; margin-top: 15px; font-size: 13px; font-weight: bold; }
        .panel { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-top: 20px; border-top: 6px solid #8c7ae6; }
        .title-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .badge { font-size: 13px; padding: 5px 12px; border-radius: 4px; background: #718093; color: white; font-weight: bold; }
        .badge.success { background: #4bcffa; color: #1e272e; }
        .badge.error { background: #ff5e57; color: white; }
        .log { background: #f1f2f6; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 14px; color: #2f3640; margin-bottom: 15px; border-left: 4px solid #718093; }
        pre { background: #2f3542; color: #f1f2f6; padding: 15px; border-radius: 6px; font-size: 13px; max-height: 450px; overflow-y: auto; line-height: 1.5; margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="margin:0; font-size: 26px;">🏛️ 臺灣證交所 (TWSE) / 櫃買中心 (TPEX) 官方直連歷史探針</h1>
        <p style="margin:5px 0 0 0; opacity: 0.9;">免 API Token 限制，直接刺探官方原始資料庫</p>
        
        <div class="config-grid">
            <div class="config-group">
                <label>股票代號 (上市與上櫃可混合測試，自動分流)</label>
                <input type="text" id="stocksInput" value="2301, 6446" placeholder="例如: 2301, 6446">
            </div>
            <div class="config-group">
                <label>指定單一交易日 (必須是開盤工作日，如 2026-06-24)</label>
                <input type="date" id="dateInput" value="2026-06-24">
            </div>
        </div>
        
        <div class="notice">
            ⚠️ 官網反爬蟲極其嚴苛！本程式已預設限制單次查詢單一日期。每檔股票查詢之間會強迫瀏覽器「冷卻等待 4 秒鐘」，請耐心等候，切勿頻繁點擊。
        </div>
        
        <div class="btn-row">
            <button class="btn" id="startBtn">向官方網站叩門讀取</button>
        </div>
    </div>

    <div id="panelsContainer">
        <div style="text-align:center; color:#a4b0be; padding: 40px; font-weight: bold;">等待管線建立...</div>
    </div>
</div>

<script src="test.js"></script>
</body>
</html>
