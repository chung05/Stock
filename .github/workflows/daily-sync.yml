name: 主力固定成分股大帳本天天自動同步

on:
  # 🟢 已移除自動排程 (cron)，此處僅保留手動觸發按鈕，永不自動執行！
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true # 🟢 智慧防護：如果前一次手動執行還沒跑完，直接撤銷舊的，永不相撞！

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 檢查專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 自動安裝解析所需的基礎依賴套件
        run: npm install axios xlsx @supabase/supabase-js dotenv

      - name: 執行資料庫同步腳本
        run: node backend-sync-mainstock.js
        env:
          TZ: Asia/Taipei # 🟢 強制讓 GitHub 伺服器使用台灣時區
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

      - name: 🎯 打包前端網頁靜態資源
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          # 🟢 智慧除錯：硬性指定如果雲端有重複的打包檔，直接覆蓋更新，徹底根除 Multiple artifacts 報錯！
          overwrite: true 

  deploy-pages:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build-and-sync
    steps:
      - name: 🚀 部署至 GitHub Pages 網址
        uses: actions/deploy-pages@v5
