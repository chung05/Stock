name: 主力固定成分股大帳本天天自動同步

on:
  # 🟢 已移除自動排程 (cron)，此處僅保留手動觸發按鈕，永不自動執行！
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true 

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 檢查專案程式碼
        uses: actions/checkout@v4.2.2

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 自動安裝解析所需的基礎依賴套件
        run: npm install axios xlsx @supabase/supabase-js dotenv

      - name: 執行資料庫同步腳本
        run: node backend-sync-mainstock.js
        env:
          TZ: Asia/Taipei
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

      - name: 🎯 打包前端網頁靜態資源
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: '.'
          overwrite: true 

  deploy-pages:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build-and-sync
    steps:
      - name: 🚀 部署至 GitHub Pages 網址
        uses: actions/deploy-pages@v4.0.5
        env:
          # 💡 終極解鎖變數：強制遮蔽官方套件內部的 punycode 拋錯死結
          NODE_OPTIONS: "--no-deprecation"
