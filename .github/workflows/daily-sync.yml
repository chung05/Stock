name: 主力固定成分股大帳本天天自動同步

on:
  schedule:
    - cron: '0 13 * * *'  # 每天台灣時間 21:00 自動執行
    - cron: '0 14 * * *'  # 每天台灣時間 22:00 執行備援
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 檢查專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 自動安裝解析所需的基礎依賴套件
        run: npm install axios xlsx @supabase/supabase-js dotenv

      - name: 執行資料庫同步腳本 (已指向全新直連母名單引擎)
        run: node backend-sync-mainstock.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

      - name: 打包前端網頁靜態資源
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-pages:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build-and-sync
    steps:
      - name: 🚀 部署至 GitHub Pages 網址
        uses: actions/deploy-pages@v5
