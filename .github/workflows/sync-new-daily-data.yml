name: sync-new-daily-data

on:
  schedule:
    - cron: '30 8 * * 1-5' # 每天台股盤後 16:30 自動執行 (UTC 8:30)
  workflow_dispatch: # 准許您在 GitHub 後台點擊按鈕手動強制觸發

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 檢查並拉取專案程式碼
        uses: actions/checkout@v4

      - name: 設定標準 Node.js 18 環境
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: 自動安裝解析所需的基礎依賴套件
        run: |
          npm install @supabase/supabase-js dotenv axios xlsx

      # 🧠 步驟 1：常規更新核心 180 檔的金級大帳本（從 2026/01/02 累積至今）
      - name: 執行每日核心 180 檔智慧籌碼增量同步
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node sync-data.js

      # ==========================================================
      # 💡 核心新增點：在打包前，執行全新星流星池的「洗白＋41天不斷層下載」
      # ==========================================================
      - name: ⚡ 執行當日 NEW 分頁強勢股 41 天指標全量加載
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node sync-new-daily.js

      # ==========================================================
      # 唯一的網頁封裝與發布放最後，永不相撞
      # ==========================================================
      - name: 🎯 打包前端網頁靜態資源
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 部署至 GitHub Pages 網址
        uses: actions/deploy-pages@v5
