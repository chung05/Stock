name: Generate Daily Report

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 edge-tts google-genai

    - name: 啟動 Gemini AI 彙整分析並產出網頁
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        cd Python
        python generate_report.py

    - name: 將新產生的 HTML 與報告推回儲存庫
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/*
        git diff-index --quiet HEAD || (git commit -m "📊 盤前特刊：newsai.html 自動生成 [skip ci]" && git push)
