name: 🚀 工具箱：手動執行大帳本陌生髒資料物理清洗 (回歸180檔)

on:
  workflow_dispatch: 

jobs:
  clean-corrupted-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 檢查並拉取專案程式碼
        uses: actions/checkout@v4.2.2

      - name: ⚙️ 設定標準 Node.js 20 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 自動安裝清洗所需的基礎依賴套件
        run: npm install @supabase/supabase-js axios xlsx dotenv

      - name: 🎯 啟動主力大帳本全面解限物理清洗與健檢
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }} 
        run: node tool-clean-corrupted-data.js
