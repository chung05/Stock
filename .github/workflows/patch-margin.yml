name: 🚀 融資券歷史大帳本大補貼工程

on:
  workflow_dispatch: 

concurrency:
  group: "patch-margin-group"
  cancel-in-progress: true 

jobs:
  patch-margin-data:
    runs-on: ubuntu-latest

    steps:
      - name: 檢查專案程式碼
        uses: actions/checkout@v4.2.2

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: 自動安裝解析所需的基礎依賴套件
        run: npm install axios @supabase/supabase-js dotenv

      - name: 執行融資券歷史補齊腳本
        run: node tool-patch-margin-data.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
