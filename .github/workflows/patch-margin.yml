name: 🚀 融資券歷史大帳本大補貼工程

on:
  # 🟢 僅保留手動觸發按鈕，平常不自動執行，需要補件時再去後台點擊！
  workflow_dispatch: 

concurrency:
  group: "patch-margin-group"
  cancel-in-progress: true # 🟢 智慧防護：如果前一次手動執行還沒跑完再次點擊，直接撤銷舊的，永不相撞！

jobs:
  patch-margin-data:
    runs-on: ubuntu-latest

    steps:
      - name: 檢查專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 🟢 與你現有的日常同步環境保持一致 (Node 20)

      - name: 自動安裝解析所需的基礎依賴套件
        run: npm install axios @supabase/supabase-js dotenv

      - name: 執行融資券歷史補齊腳本
        run: node tool-patch-margin-data.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
