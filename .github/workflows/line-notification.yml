name: Daily Auto LINE Notification to List

on:
  workflow_dispatch:

jobs:
  send-line-message:
    runs-on: ubuntu-latest
    env:
      USER_LIST: "U3fd5afc17e5869f39772e6d55cec31e0 Uaff351b5cd6dd47d6268bd937a666cde Uae56196c905f4e502dd7175d1b9e9d6a"
      LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN_2 }}
      # LINE_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}

    steps:
      - name: Loop through User List
        run: |
          TODAY_STR=$(TZ="Asia/Taipei" date +'%Y-%m-%d')
          TITLE_DATE=$(TZ="Asia/Taipei" date +'%Y-%m-%d' | sed -E 's/-0?([0-9]+)/-\1/g')
          
          for USER_ID in $USER_LIST; do
            echo "Sending to $USER_ID for date $TODAY_STR"
            
            PAYLOAD=$(cat <<EOF
          {
            "to": "$USER_ID",
            "messages": [
              {
                "type": "template",
                "altText": "台股最新($TITLE_DATE)新聞AI 盤前情報分析",
                "template": {
                  "type": "buttons",
                  "text": "📊 台股最新($TITLE_DATE)新聞AI 盤前情報分析，請點選下方按鈕查看詳細內容。",
                  "actions": [
                    {
                      "type": "uri",
                      "label": "完整資訊",
                      "uri": "https://chung05.github.io/Stock/docs/newsai_$TODAY_STR.html"
                    }
                  ]
                }
              }
            ]
          }
          EOF
          )
            
            curl -s -X POST https://api.line.me/v2/bot/message/push \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $LINE_TOKEN" \
              -d "$PAYLOAD"
          done
