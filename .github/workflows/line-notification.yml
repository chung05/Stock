name: Daily Auto LINE Notification to List

on:
  # // 暫時關閉每天早上的自動 LINE 通知，改為備註
  # schedule:
  #   - cron: '10 22 * * *'
  
  # // 保留手動觸發按鈕，方便你隨時測試
  workflow_dispatch:

jobs:
  send-line-message:
    runs-on: ubuntu-latest
    env:
    #  USER_LIST: "U1d55204debbb0af1f992ec1d9a358f93 U3fd5afc17e5869f39772e6d55cec31e0 C7040d04f3e87e987cbaf7d2085fc3593"
       USER_LIST: "U3fd5afc17e5869f39772e6d55cec31e0"
    
    steps:
      - name: Loop through User List
        run: |
          # ✨ 網址用的標準日期 (保持 2026-07-19 格式)
          TODAY_STR=$(TZ="Asia/Taipei" date +'%Y-%m-%d')
          
          # ✨ 標題用的日期 (2026-7-19 格式)
          TITLE_DATE=$(TZ="Asia/Taipei" date +'%Y-%m-%d' | sed -E 's/-0?([0-9]+)/-\1/g')
          
          for USER_ID in $USER_LIST; do
            echo "Sending to $USER_ID for date $TODAY_STR"
            
            # // 修正點：呼叫 LINE API，使用 buttons 範本卡片，並精簡文字字數防超限
            curl -X POST https://api.line.me/v2/bot/message/push \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}" \
              -d "{
                \"to\": \"$USER_ID\",
                \"messages\": [
                  {
                    \"type\": \"template\",
                    \"altText\": \"台股最新($TITLE_DATE)新聞AI 盤前情報分析\",
                    \"template\": {
                      \"type\": \"buttons\",
                      \"text\": \"📊 台股最新($TITLE_DATE)新聞AI 盤前情報分析，請點選下方按鈕查看詳細內容。\",
                      \"actions\": [
                        {
                          \"type\": \"uri\",
                          \"label\": \"完整資訊\",
                          \"uri\": \"https://chung05.github.io/Stock/docs/newsai_$TODAY_STR.html\"
                        }
                      ]
                    }
                  }
                ]
              }"
          done
