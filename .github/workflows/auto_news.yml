name: Daily Stock News Page Generator

on:
  schedule:
    # 台灣時間早上 07:00 = UTC 時間前一天晚上 23:00
    - cron: '0 23 * * *'
  workflow_dispatch: # 允許在 GitHub 介面上手動點擊按鈕觸發測試

permissions:
  contents: write

jobs:
  generate-page:
    runs-on: ubuntu-latest
    steps:
    - name: 檢查原始碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝套件
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser beautifulsoup4

    - name: 執行新聞抓取與產生網頁檔案
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      working-directory: ./Python # 💡 修正：進入 Python 資料夾執行腳本
      run: python news_bot.py

    - name: 自動將網頁檔案提交回 GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # 由於 Python 已自動將檔案產出在外層的 docs/ 內，此處正常 add 即可
        git add ../docs/
        git diff-index --quiet HEAD || git commit -m "更新今日台股盤前報告網頁"
        git push

    # 💡 你原本處理 LINE 通知的步驟，可以直接加在下方作為此 Job 的最後一步
