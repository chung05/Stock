name: Daily Stock News Page Generator

on:
  schedule:
 # // 台灣時間早上 07:00 = UTC 時間前一天晚上 23:00
 # //    - cron: '0 23 * * *'
 # //  workflow_dispatch: # 允許在 GitHub 介面上手動點擊按鈕觸發測試

permissions:
  contents: write

jobs:
  generate-page:
    runs-on: ubuntu-latest
    steps:
    - name: 檢查原始碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝套件
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser beautifulsoup4 python-dateutil

    - name: 執行新聞抓取與產生網頁檔案
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # ✨ 修正點 1：先 cd 進入 Python 資料夾再執行，對齊程式碼中的 ".." 路徑設定
      run: |
        cd Python
        python news_bot.py

    - name: 自動將網頁檔案提交回 GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # ✨ 修正點 2：強制指定加入根目錄下的 docs 資料夾
        git add docs/*
        # 檢查是否有檔案變更，若有則提交並推回倉庫
        git diff-index --quiet HEAD || (git commit -m "🤖 自動更新：今日台股盤前報告與偵報資料" && git push)
