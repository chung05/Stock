name: 🚀 手動補件：全新高價股 34 欄位歷史完全體重建

on:
  workflow_dispatch:

jobs:
  patch-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 🌟 已移除 cache: 'npm'，徹底根除找不到 package-lock.json 的錯誤

      - name: 📦 Install Required Dependencies
        run: |
          npm install axios @supabase/supabase-js dotenv

      - name: 🔥 Execute 34-Fields High Price Stock Patch Tool
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          echo "🏁 【2026/01/02 ~ 2026/07/09 特定區間歷史數據精準灌錄】開始..."
          node tool-patch-high-price-stocks-v3.js
          echo "🎉 補件大程序執行完畢，請至 Supabase Table 進行數據核對！"
