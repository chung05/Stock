- name: 推送檔案至 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. 確保 data 資料夾存在 (如果程式執行失敗沒產生 data，這裡會跳過)
          if [ -d "data" ]; then
            # 2. 只針對目標檔案進行 add
            git add data/raw_data.json data/ai_analysis.jsonl
            
            # 3. 檢查這些檔案是否有實際變更 (忽略 node_modules 等雜訊)
            if git diff --cached --quiet; then
              echo "無資料變動，無需推送。"
            else
              git commit -m "Auto-export: Update AI-ready analysis data"
              git push
            fi
          else
            echo "警告：data 資料夾未產生，請檢查之前的執行步驟是否報錯。"
            exit 1
          fi
