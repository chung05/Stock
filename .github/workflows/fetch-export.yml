name: AI Analysis Export

on:
  schedule:
    - cron: '30 9 * * *' 
  workflow_dispatch: 

jobs:
  fetch-and-export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安裝套件
        run: npm install @supabase/supabase-js

      - name: 執行資料抓取與匯出
        run: |
          node fetch-data.js
          node export-for-ai.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 處理資料變更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 將產出的檔案強制加入 Git (即使被 ignore 也強制 add)
          git add -f data/raw_data.json data/ai_analysis.jsonl
          
          # 如果有變更才進行 commit
          if ! git diff --cached --quiet; then
            git commit -m "Auto-export: Update AI data"
            git push
          else
            echo "無資料變動，跳過推送。"
          fi
