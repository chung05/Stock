name: AI Analysis Export

on:
  schedule:
    - cron: '30 9 * * *' 
  workflow_dispatch: 

jobs:
  fetch-and-export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v4.2.2 # 💡 升級安全版本
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安裝所有必要套件
        run: npm install @supabase/supabase-js dotenv axios xlsx

      - name: 執行資料抓取與匯出
        run: |
          node fetch-data.js
          node export-for-ai.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 推送檔案至 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f data/raw_data.json data/ai_analysis.jsonl
          
          if ! git diff --cached --quiet; then
            git commit -m "Auto-export: Update AI-ready analysis data"
            git push
            echo "成功：檔案已推送。"
          else
            echo "狀態：無檔案變動，本次自動執行未推送。"
          fi
