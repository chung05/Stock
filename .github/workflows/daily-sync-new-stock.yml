name: 手動執行增加"NEW"標籤及個股

on:
  # 🟢 已移除自動排程 (cron)，此處僅保留手動觸發按鈕
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  sync-new-pool:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 檢查並拉取專案程式碼
        uses: actions/checkout@v4

      - name: ⚙️ 設定標準 Node.js 20 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 安裝運行所需的基礎套件
        run: npm install axios @supabase/supabase-js dotenv

      - name: 🎯 執行純個股篩選與 45 天全量指標暖身
        run: node backend-sync-new-stock.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
