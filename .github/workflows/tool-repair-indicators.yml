name: 🚀 工具箱：手動執行主力股全量漏洞修復與指標強行洗白

on:
  workflow_dispatch: # 准許在 GitHub Actions 後台手動點擊按鈕觸發執行

jobs:
  force-repair:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 檢查並拉取專案程式碼
        uses: actions/checkout@v4

      - name: ⚙️ 設定標準 Node.js 20 環境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 自動安裝修復所需的基礎依賴套件
        run: npm install @supabase/supabase-js axios xlsx dotenv

      - name: 🎯 啟動 180 檔主力股全量漏洞修復與指標強行洗白
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: node tool-force-repair-indicators.js
