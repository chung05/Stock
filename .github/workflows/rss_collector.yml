name: Hourly RSS News Collector

on:
  schedule:
    # 台灣 18:00 = UTC 10:00
    - cron: '0 10 * * *'
    # 台灣 00:00 = UTC 16:00
    - cron: '0 16 * * *'
    # 台灣 06:00 = UTC 22:00
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-rss:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests feedparser beautifulsoup4 python-dateutil

    - name: Run RSS Collector
      run: |
        cd Python
        python fetch_rss.py

    - name: Push Data Back to Repo
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/*
        git diff-index --quiet HEAD || (git commit -m "🤖 RSS 增量去重數據庫同步更新" && git push)
