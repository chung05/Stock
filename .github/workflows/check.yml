name: Check FinMind Stocks

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *' # 每天國際標準時間 00:00 自動執行

jobs:
  check-database:
    runs-runs-on: ubuntu-latest
    steps:
    - name: 檢出專案程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝相依套件
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 執行排查腳本
      env:
        # 請記得在 GitHub Repository -> Settings -> Secrets 中設定你的 FINMIND_TOKEN
        FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }} 
      run: python check_stocks.py
