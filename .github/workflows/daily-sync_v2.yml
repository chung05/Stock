name: 主力固定成分股大帳本天天自動同步v2(3種資料)

on:
  schedule:
    # 🟢 台灣時間 21:30 = UTC 13:30 (Cron: 30 13 * * *)
    - cron: '30 13 * * *' 
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4
        with: 
          node-version: '22' # 💡 採用 Node 22 穩定原生 WebSocket
      - run: npm install axios xlsx @supabase/supabase-js dotenv
      
      - name: 執行資料庫同步腳本
        run: node backend-sync-v2.js
        env:
          TZ: Asia/Taipei
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

      - name: 🎯 打包前端網頁靜態資源 (對齊 v5 部署)
        uses: actions/upload-pages-artifact@v3 # 💡 升級為 v3 核心，產出符合 v5 伺服器規格的正式網頁包
        with:
          path: '.'
          overwrite: true 

  deploy-pages:
    environment: { name: github-pages }
    runs-on: ubuntu-latest
    needs: build-and-sync
    steps:
      - name: 🚀 部署至 GitHub Pages (正統 v5 模式)
        uses: actions/deploy-pages@v4 # 💡 官方內部會自動安全對齊至最高相容的 v5 服務執行緒
