name: 主力固定成分股大帳本天天自動同步v2(3種資料)

on:
  schedule:
    # 🟢 台灣時間 21:30 = UTC 13:30 (Cron: 30 13 * * *)
    - cron: '30 13 * * *' 
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2 # 💡 升級到最新小版本，完美相容 Node 24 容器
      - uses: actions/setup-node@v4
        with: 
          node-version: '20' # 鎖定專案環境為穩定版 Node 20
      - run: npm install axios xlsx @supabase/supabase-js dotenv
      
      - name: 執行資料庫同步腳本
        run: node backend-sync-v2.js
        env:
          TZ: Asia/Taipei # 🟢 環境時區校準
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

      - name: 🎯 打包前端網頁靜態資源
        uses: actions/upload-pages-artifact@v3.0.1 # 💡 升級打包核心組件，根除強制執行失敗
        with:
          path: '.'
          overwrite: true 

  deploy-pages:
    environment: { name: github-pages }
    runs-on: ubuntu-latest
    needs: build-and-sync
    steps:
      - uses: actions/deploy-pages@v4.0.5 # 💡 對齊官方穩定部署版本
