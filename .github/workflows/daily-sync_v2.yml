name: 主力固定成分股大帳本天天自動同步v2(3種資料)

# 🎯 核心修正：將原本的定時 schedule 移除，改為完全由手動觸發 (workflow_dispatch)
on:
  workflow_dispatch: 

permissions:
  contents: write # 💡 必須開啟寫入權限，讓工人有權利創立並推送 gh-pages 分支

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4
        with: 
          node-version: '22' # 保持 Node 22 穩定環境
      - run: npm install axios xlsx @supabase/supabase-js dotenv
      
      - name: 執行資料庫同步腳本
        run: node backend-sync-v2.js
        env:
          TZ: Asia/Taipei
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

      # 💡 終極大絕招：直接把網頁成果推送到 gh-pages 分支，繞開所有官方 deploy-pages 組件與快取殘留的 Bug！
      - name: 🚀 物理級直接部署至 GitHub Pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: '.' # 發布當前根目錄下所有的網頁靜態資源
          force_orphan: true # 每次都清空地端殘留，徹底根除快取髒資料死結
