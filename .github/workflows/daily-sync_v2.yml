name: 主力固定成分股大帳本天天自動同步v2(3種資料)

on:
  schedule:
    # 🟢 台灣時間 21:30 = UTC 13:30 (Cron: 30 13 * * *)
    - cron: '30 13 * * *' 
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4
        with: 
          node-version: '20'
      - run: npm install axios xlsx @supabase/supabase-js dotenv
      
      - name: 執行資料庫同步腳本
        run: node backend-sync-v2.js
        env:
          TZ: Asia/Taipei
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

      - name: 🎯 打包前端網頁靜態資源
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: '.'
          overwrite: true 

  deploy-pages:
    environment: { name: github-pages }
    runs-on: ubuntu-latest
    needs: build-and-sync
    steps:
      - name: 🚀 部署至 GitHub Pages
        uses: actions/deploy-pages@v4.0.5
        env:
          # 💡 終極解鎖變數：強行叫 Node.js 閉嘴，無視 punycode 的過期警告，讓部署順利通過
          NODE_OPTIONS: "--no-deprecation"
