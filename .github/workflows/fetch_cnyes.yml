name: Fetch Cnyes News

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-cnyes:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: 1. 抓取鉅亨網指定區間新聞
      run: |
        cd Python
        python fetch_cnyes.py

    - name: 2. 將新產生的 JSON 推回儲存庫
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/*
        git diff-index --quiet HEAD || (git commit -m "📊 鉅亨網新聞與市場數據存檔 [skip ci]" && git push)
