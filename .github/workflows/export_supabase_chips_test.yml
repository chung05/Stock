name: 手動測試 Supabase 籌碼匯出

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install supabase

      - name: 執行匯出腳本
        run: |
          if [ -f "Python/export_supabase_chips.py" ]; then
            python Python/export_supabase_chips.py
          elif [ -f "Stock/Python/export_supabase_chips.py" ]; then
            python Stock/Python/export_supabase_chips.py
          else
            python export_supabase_chips.py
          fi

      - name: 檢查並顯示最新產出的 chips.json 檔案
        run: |
          find . -name "chips_*.json"
          find . -name "chips_*.json" -exec head -n 40 {} +

      - name: 將生成的 chips.json 檔案提交並推送回 GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # 正確加入 docs 目錄下生成的 chips JSON 檔案
          git add docs/chips_*.json
          
          # 檢查是否有暫存變更並推送
          if git diff --staged --quiet; then
            echo "ℹ️ 檔案無變更，無需提交。"
          else
            git commit -m "🤖 自動生成最新法人籌碼分析 JSON 檔 [skip ci]"
            git push
            echo "🎉 JSON 檔案已成功推送並儲存至 GitHub 儲存庫中！"
          fi
