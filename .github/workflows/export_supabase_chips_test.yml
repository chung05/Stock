name: 手動測試 Supabase 籌碼匯出

on:
  workflow_dispatch:

jobs:
  run-test:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案代碼
        uses: actions/checkout@v4

      - name: 檢查目錄結構 (排查路徑)
        run: |
          echo "=== 根目錄檔案清單 ==="
          ls -la

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝相依套件
        run: |
          pip install supabase

      - name: 執行匯出腳本
        run: |
          # 自動判斷腳本位置並切換執行
          if [ -d "Stock/Python" ]; then
            cd Stock/Python
          elif [ -d "Python" ]; then
            cd Python
          elif [ -d "python" ]; then
            cd python
          fi
          python export_supabase_chips.py

      - name: 檢查產出檔案與內容預覽
        run: |
          echo "=== 尋找產出的 chips 檔案 ==="
          find . -name "chips_*.txt"
          echo "=== 顯示籌碼分析檔內容前 40 行 ==="
          find . -name "chips_*.txt" -exec head -n 40 {} +
